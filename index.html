<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FFchatgram</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075E54">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1384/1384055.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1384/1384055.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, 
            updatePassword, onAuthStateChanged, signOut, updateProfile 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { 
            getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, 
            doc, setDoc, getDoc, getDocs, deleteDoc, updateDoc, arrayUnion
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyDR6F1nGbRhGdDQVXWETK0XlNxhU5AKxEU",
                authDomain: "ffchatgram.firebaseapp.com",
                projectId: "ffchatgram",
                storageBucket: "ffchatgram.firebasestorage.app",
                messagingSenderId: "6270167752",
                appId: "1:6270167752:web:dbe57e9c6166f91fa953fd"
            };

            const app = initializeApp(firebaseConfig);
            window.auth = getAuth(app);
            window.db = getFirestore(app);
            window.IMGBB_API_KEY = "c0f85456625fe8081a3039269bb5b40a".toLowerCase();
            window.firebaseMethods = {
                signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updatePassword,
                onAuthStateChanged, signOut, updateProfile, collection, addDoc, query, where, orderBy, onSnapshot,
                serverTimestamp, doc, setDoc, getDoc, getDocs, deleteDoc, updateDoc, arrayUnion
            };
            window.firebaseReady = true;
            window.dispatchEvent(new Event('firebase-ready'));
        } catch (err) {
            console.error("Errore Firebase:", err);
            window.firebaseInitError = err.message || "Errore di connessione a Firebase";
            window.dispatchEvent(new Event('firebase-error'));
        }
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: #d1d7db; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        .bg-chat-pattern { background-color: #efeae2; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        .bubble-in { background: #ffffff; border-radius: 0px 12px 12px 12px; box-shadow: 0 1px 1.5px rgba(11,20,26,.13); }
        .bubble-out { background: #d9fdd3; border-radius: 12px 0px 12px 12px; box-shadow: 0 1px 1.5px rgba(11,20,26,.13); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        function playNotificationSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.09);
                gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.22);
            } catch (e) {}
        }

        function copyTextSafe(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
            } else { fallbackCopy(text); }
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.focus(); ta.select();
            try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta);
        }

        async function uploadImageToImgBB(file) {
            const formData = new FormData(); formData.append('image', file);
            const apiKey = window.IMGBB_API_KEY;
            const response = await fetch('https://api.imgbb.com/1/upload?key=' + apiKey, { method: 'POST', body: formData });
            const data = await response.json();
            if (data?.success) return data.data.display_url || data.data.url;
            throw new Error('Errore caricamento ImgBB');
        }

        function Avatar({ name, photoURL, isGroup, size = "w-11 h-11", textSize = "text-base" }) {
            const initial = name ? name.trim()[0].toUpperCase() : '?';
            if (photoURL) return <img src={photoURL} alt="Avatar" className={size + " rounded-full object-cover flex-shrink-0 border border-black/10 bg-emerald-700"} />;
            return <div className={size + " rounded-full flex items-center justify-center font-bold text-white flex-shrink-0 shadow-inner " + (isGroup ? "bg-teal-600" : "bg-[#008069]") + " " + textSize}>{isGroup ? <i className="fa-solid fa-users text-sm"></i> : initial}</div>;
        }

        function App() {
            const [fbReady, setFbReady] = useState(!!window.firebaseReady);
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [toast, setToast] = useState(null);
            
            // STATI PER L'INSTALLAZIONE PWA
            const [installPrompt, setInstallPrompt] = useState(null);
            const [isIos, setIsIos] = useState(false);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            // GESTIONE EVENTO INSTALLAZIONE
            useEffect(() => {
                setIsIos(/iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()));
                const handleBeforeInstall = (e) => {
                    e.preventDefault(); // Blocchiamo il popup automatico
                    setInstallPrompt(e); // Salviamo l'evento per usarlo col nostro pulsante
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstall);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
            }, []);

            const triggerInstall = async () => {
                if (installPrompt) {
                    installPrompt.prompt();
                    const { outcome } = await installPrompt.userChoice;
                    if (outcome === 'accepted') setInstallPrompt(null);
                } else if (isIos) {
                    showToast("Su iPhone: tocca l'icona Condividi (il quadrato con la freccia) in basso e seleziona 'Aggiungi alla schermata Home'.", "info");
                } else {
                    showToast("L'app è già installata o il browser non supporta questa funzione.", "info");
                }
            };

            useEffect(() => {
                if (fbReady) return;
                const onReady = () => setFbReady(true);
                window.addEventListener('firebase-ready', onReady);
                return () => window.removeEventListener('firebase-ready', onReady);
            }, [fbReady]);

            useEffect(() => {
                if (!fbReady || !window.firebaseMethods) return;
                const fm = window.firebaseMethods;
                const unsub = fm.onAuthStateChanged(window.auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userRef = fm.doc(window.db, "users", currentUser.uid);
                            const snap = await fm.getDoc(userRef);
                            let profileData = snap.exists() ? snap.data() : { uid: currentUser.uid, name: currentUser.email.split('@')[0], email: currentUser.email, photoURL: '', updatedAt: fm.serverTimestamp() };
                            if (!snap.exists()) await fm.setDoc(userRef, profileData, { merge: true });
                            setUserData(profileData);

                            const params = new URLSearchParams(window.location.search);
                            const inviteUid = params.get('invite');
                            if (inviteUid && inviteUid !== currentUser.uid) {
                                const inviterSnap = await fm.getDoc(fm.doc(window.db, "users", inviteUid));
                                if (inviterSnap.exists()) {
                                    const inviterData = inviterSnap.data();
                                    const q = fm.query(fm.collection(window.db, "chats"), fm.where("members", "array-contains", currentUser.uid));
                                    const existingSnap = await fm.getDocs(q);
                                    const exists = existingSnap.docs.some(d => d.data().type === 'direct' && d.data().members.includes(inviteUid));
                                    if (!exists) {
                                        await fm.addDoc(fm.collection(window.db, "chats"), {
                                            type: 'direct', members: [currentUser.uid, inviteUid],
                                            memberData: {
                                                [currentUser.uid]: { name: profileData.name, photoURL: profileData.photoURL },
                                                [inviteUid]: { name: inviterData.name, photoURL: inviterData.photoURL }
                                            },
                                            lastMessage: '👋 Chat avviata tramite link d\'invito!', updatedAt: fm.serverTimestamp()
                                        });
                                        showToast('Collegamento completato con ' + inviterData.name + '!');
                                    }
                                }
                                window.history.replaceState({}, document.title, window.location.pathname);
                            }
                        } catch (e) {}
                    } else { setUserData(null); }
                    setAuthLoading(false);
                });
                return () => unsub();
            }, [fbReady]);

            if (!fbReady || authLoading) return <div className="h-screen w-screen flex flex-col items-center justify-center bg-[#f0f2f5]"><div className="w-14 h-14 border-4 border-[#008069] border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="h-screen w-screen overflow-hidden relative select-text">
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-semibold text-sm flex items-center gap-2.5 transition-all" style={{ backgroundColor: toast.type === 'error' ? '#dc2626' : (toast.type === 'info' ? '#0ea5e9' : '#008069') }}>
                            <i className={toast.type === 'error' ? "fa-solid fa-circle-exclamation" : "fa-solid fa-circle-info"}></i>
                            <span>{toast.msg}</span>
                        </div>
                    )}
                    {user ? <Dashboard user={user} userData={userData} setUserData={setUserData} showToast={showToast} triggerInstall={triggerInstall} /> : <AuthScreen showToast={showToast} triggerInstall={triggerInstall} />}
                </div>
            );
        }

        function AuthScreen({ showToast, triggerInstall }) {
            const [mode, setMode] = useState('login');
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const hasInvite = useMemo(() => new URLSearchParams(window.location.search).has('invite'), []);

            const handleSubmit = async (e) => {
                e.preventDefault(); setErrorMsg(''); setBusy(true);
                const fm = window.firebaseMethods;
                try {
                    if (mode === 'login') await fm.signInWithEmailAndPassword(window.auth, email.trim(), password);
                    else if (mode === 'register') {
                        if (!name.trim()) { setErrorMsg("Inserisci il Nome."); setBusy(false); return; }
                        const cred = await fm.createUserWithEmailAndPassword(window.auth, email.trim(), password);
                        await fm.updateProfile(cred.user, { displayName: name.trim() });
                        await fm.setDoc(fm.doc(window.db, "users", cred.user.uid), { uid: cred.user.uid, name: name.trim(), email: email.trim().toLowerCase(), photoURL: '', updatedAt: fm.serverTimestamp() });
                        showToast("Benvenuto!");
                    } else {
                        await fm.sendPasswordResetEmail(window.auth, email.trim());
                        showToast("Email inviata!"); setMode('login');
                    }
                } catch (err) { setErrorMsg("Errore: " + (err.message || 'Credenziali non valide')); }
                setBusy(false);
            };

            return (
                <div className="min-h-screen w-full bg-gradient-to-b from-[#00a884] to-[#eae6df] flex flex-col items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden z-10">
                        <div className="bg-[#008069] p-6 text-center text-white">
                            <h1 className="text-2xl font-extrabold tracking-tight"><i className="fa-solid fa-comments"></i> FFchatgram</h1>
                            {hasInvite && <div className="mt-3 bg-white/20 text-xs py-1.5 px-3 rounded-full font-semibold"><i className="fa-solid fa-link"></i> Invito rilevato: accedi o registrati!</div>}
                        </div>
                        <div className="p-6">
                            <div className="flex rounded-xl bg-gray-100 p-1 mb-5">
                                <button type="button" onClick={() => setMode('login')} className={"flex-1 py-2 text-xs font-bold rounded-lg " + (mode === 'login' ? "bg-white text-[#008069] shadow" : "text-gray-500")}>Accedi</button>
                                <button type="button" onClick={() => setMode('register')} className={"flex-1 py-2 text-xs font-bold rounded-lg " + (mode === 'register' ? "bg-white text-[#008069] shadow" : "text-gray-500")}>Nuovo Affiliato</button>
                            </div>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                {mode === 'register' && <input type="text" required placeholder="Tuo Nome (Visibile in chat)" value={name} onChange={e => setName(e.target.value)} className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:border-[#008069] outline-none" />}
                                <input type="email" required placeholder="Indirizzo Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:border-[#008069] outline-none" />
                                {mode !== 'reset' && <input type="password" required placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:border-[#008069] outline-none" />}
                                {errorMsg && <div className="bg-red-50 text-red-600 text-xs font-semibold p-3 rounded-xl">{errorMsg}</div>}
                                <button type="submit" disabled={busy} className="w-full bg-[#008069] text-white font-bold py-3 rounded-xl">{busy ? 'Attendere...' : (mode === 'login' ? 'Entra' : 'Crea Account')}</button>
                            </form>
                        </div>
                    </div>
                    {/* TASTO INSTALLAZIONE SCHERMATA LOGIN */}
                    <button onClick={triggerInstall} className="mt-6 text-white font-bold py-3 px-6 bg-black/20 hover:bg-black/30 rounded-xl backdrop-blur-md shadow-lg transition flex items-center gap-2">
                        <i className="fa-solid fa-mobile-screen-button text-lg"></i> Installa App sul Telefono
                    </button>
                </div>
            );
        }

        function Dashboard({ user, userData, setUserData, showToast, triggerInstall }) {
            const [chats, setChats] = useState([]);
            const [allUsers, setAllUsers] = useState({});
            const [activeChatId, setActiveChatId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [modal, setModal] = useState(null);
            const [lightboxUrl, setLightboxUrl] = useState(null);

            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.collection(window.db, "users"), (snap) => {
                    const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); }); setAllUsers(map);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                const fm = window.firebaseMethods;
                const q = fm.query(fm.collection(window.db, "chats"), fm.where("members", "array-contains", user.uid));
                const unsub = fm.onSnapshot(q, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0));
                    setChats(list);
                });
                return () => unsub();
            }, [user.uid]);

            const getChatInfo = (chat) => {
                if (!chat) return { name: 'Chat', photoURL: '', isGroup: false };
                if (chat.type === 'group') return { name: chat.name, photoURL: chat.photoURL, isGroup: true };
                const otherUid = chat.members.find(uid => uid !== user.uid);
                const liveOther = otherUid ? allUsers[otherUid] : null;
                return { name: liveOther?.name || chat.memberData?.[otherUid]?.name || 'Affiliato', photoURL: liveOther?.photoURL || '', isGroup: false, otherUid };
            };

            const handleCopyInvite = () => {
                const inviteUrl = window.location.origin + window.location.pathname + '?invite=' + user.uid;
                copyTextSafe("Entra nella mia chat privata FFchatgram: " + inviteUrl);
                showToast("Link copiato! Invialo su WhatsApp ai tuoi affiliati.");
            };

            const startDirectChatWithUser = async (targetUser) => {
                const fm = window.firebaseMethods;
                const existing = chats.find(c => c.type === 'direct' && c.members.includes(targetUser.uid));
                if (existing) { setActiveChatId(existing.id); setModal(null); return; }
                const ref = await fm.addDoc(fm.collection(window.db, "chats"), {
                    type: 'direct', members: [user.uid, targetUser.uid],
                    memberData: { [user.uid]: { name: userData?.name }, [targetUser.uid]: { name: targetUser.name } },
                    lastMessage: 'Nuova conversazione', updatedAt: fm.serverTimestamp()
                });
                setActiveChatId(ref.id); setModal(null);
            };

            const activeChat = chats.find(c => c.id === activeChatId) || null;
            const otherAffiliates = Object.values(allUsers).filter(u => u.uid && u.uid !== user.uid);
            const filteredChats = chats.filter(c => getChatInfo(c).name.toLowerCase().includes(searchTerm.toLowerCase()));

            useEffect(() => {
                const handlePopState = (e) => { if (activeChatId) setActiveChatId(null); };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [activeChatId]);

            const openChat = (id) => { window.history.pushState({chatId: id}, ""); setActiveChatId(id); };
            const closeChat = () => { window.history.back(); setActiveChatId(null); };

            return (
                <div className="flex fixed inset-0 bg-[#f0f2f5] overflow-hidden" style={{height: '100dvh', width: '100vw'}}>
                    
                    {/* SIDEBAR */}
                    <div className={"w-full md:w-[400px] bg-white border-r flex flex-col flex-shrink-0 " + (activeChat ? "hidden md:flex" : "flex")}>
                        <div className="bg-[#f0f2f5] px-4 py-3 flex items-center justify-between border-b">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setModal('settings')}>
                                <Avatar name={userData?.name} photoURL={userData?.photoURL} />
                                <div><div className="font-bold text-sm">{userData?.name || "Profilo"}</div><div className="text-[11px] text-[#008069]">● Online</div></div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setModal('newChat')} className="w-9 h-9 rounded-full text-gray-600 hover:bg-gray-200"><i className="fa-solid fa-address-book"></i></button>
                                <button onClick={() => setModal('settings')} className="w-9 h-9 rounded-full text-gray-600 hover:bg-gray-200"><i className="fa-solid fa-gear"></i></button>
                            </div>
                        </div>

                        <div className="p-3 bg-emerald-50/70 border-b flex gap-2">
                            <button onClick={handleCopyInvite} className="flex-1 bg-[#008069] text-white text-xs font-bold py-2 rounded-lg shadow-sm"><i className="fa-solid fa-share-nodes"></i> Invita Affiliato</button>
                        </div>

                        <div className="flex-1 overflow-y-auto">
                            {filteredChats.map(chat => {
                                const info = getChatInfo(chat);
                                return (
                                    <div key={chat.id} onClick={() => openChat(chat.id)} className="px-4 py-3 flex gap-3 cursor-pointer hover:bg-gray-50 border-b border-gray-100">
                                        <Avatar name={info.name} photoURL={info.photoURL} isGroup={info.isGroup} size="w-12 h-12" />
                                        <div className="flex-1 min-w-0">
                                            <div className="font-bold text-sm truncate">{info.name}</div>
                                            <div className="text-xs text-gray-500 truncate">{chat.lastMessage}</div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* CHAT ROOM */}
                    <div className={"flex-1 flex flex-col bg-chat-pattern " + (!activeChat ? "hidden md:flex" : "flex")}>
                        {activeChat ? (
                            <ChatRoom chat={activeChat} chatInfo={getChatInfo(activeChat)} user={user} userData={userData} allUsers={allUsers} onBack={closeChat} showToast={showToast} onOpenLightbox={setLightboxUrl} />
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-gray-500"><i className="fa-solid fa-comments text-5xl mb-4 text-[#008069]/30"></i><h2>Seleziona una chat</h2></div>
                        )}
                    </div>

                    {/* MODAL IMPOSTAZIONI */}
                    {modal === 'settings' && (
                        <div className="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md overflow-hidden">
                                <div className="bg-[#008069] px-5 py-4 text-white flex justify-between">
                                    <h3 className="font-bold"><i className="fa-solid fa-gear"></i> Impostazioni</h3>
                                    <button onClick={() => setModal(null)}><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="p-5 space-y-4">
                                    
                                    {/* TASTO INSTALLAZIONE DENTRO LE IMPOSTAZIONI */}
                                    <button onClick={triggerInstall} className="w-full py-3 bg-emerald-50 hover:bg-emerald-100 text-[#008069] font-bold text-sm rounded-xl border border-emerald-200 flex justify-center items-center gap-2 transition">
                                        <i className="fa-solid fa-download"></i> Installa l'App sulla Home
                                    </button>
                                    
                                    <div className="border-t pt-4">
                                        <button onClick={() => window.firebaseMethods.signOut(window.auth)} className="w-full py-2.5 bg-red-50 text-red-600 font-bold text-xs rounded-xl border border-red-200">
                                            <i className="fa-solid fa-right-from-bracket"></i> Esci dall'Account
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* MODAL RUBRICA */}
                    {modal === 'newChat' && (
                        <div className="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold">Rubrica</h3><button onClick={() => setModal(null)}><i className="fa-solid fa-xmark"></i></button></div>
                                <div className="flex-1 overflow-y-auto p-2">
                                    {otherAffiliates.map(u => (
                                        <div key={u.uid} onClick={() => startDirectChatWithUser(u)} className="p-3 hover:bg-gray-50 flex items-center gap-3 cursor-pointer">
                                            <Avatar name={u.name} photoURL={u.photoURL} /><div className="font-bold text-sm">{u.name}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {lightboxUrl && (
                        <div className="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4" onClick={() => setLightboxUrl(null)}>
                            <img src={lightboxUrl} className="max-w-full max-h-[85vh] object-contain rounded-lg" onClick={e => e.stopPropagation()} />
                        </div>
                    )}
                </div>
            );
        }

        function ChatRoom({ chat, chatInfo, user, userData, allUsers, onBack, showToast, onOpenLightbox }) {
            const [allMessages, setAllMessages] = useState([]);
            const [text, setText] = useState('');
            const fileInputRef = useRef();
            const messagesEndRef = useRef();

            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.query(fm.collection(window.db, "chats", chat.id, "messages"), fm.orderBy("timestamp", "asc")), (snap) => {
                    setAllMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 50);
                });
                return () => unsub();
            }, [chat.id]);

            const handleSend = async (e, imageUrl = '') => {
                if (e) e.preventDefault();
                if (!text.trim() && !imageUrl) return;
                const fm = window.firebaseMethods;
                const msgText = text.trim(); setText('');
                await fm.addDoc(fm.collection(window.db, "chats", chat.id, "messages"), {
                    type: imageUrl ? 'image' : 'text', text: msgText, imageUrl: imageUrl, senderId: user.uid, timestamp: fm.serverTimestamp()
                });
                await fm.updateDoc(fm.doc(window.db, "chats", chat.id), { lastMessage: imageUrl ? '📷 Foto' : msgText, updatedAt: fm.serverTimestamp() });
            };

            const handleImagePick = async (e) => {
                const file = e.target.files?.[0]; if (!file) return;
                try { const url = await uploadImageToImgBB(file); await handleSend(null, url); } 
                catch (err) { showToast("Errore invio", "error"); }
            };

            return (
                <div className="flex flex-col h-full w-full relative">
                    <div className="bg-[#f0f2f5] px-4 py-2.5 flex items-center gap-3 border-b flex-shrink-0 sticky top-0 z-20">
                        <button onClick={onBack} className="md:hidden text-gray-600 bg-white shadow-sm rounded-full w-8 h-8 flex items-center justify-center font-bold text-lg"><i className="fa-solid fa-arrow-left"></i></button>
                        <Avatar name={chatInfo.name} photoURL={chatInfo.photoURL} />
                        <div className="font-bold text-sm truncate">{chatInfo.name}</div>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
                        {allMessages.map(msg => {
                            const isMe = msg.senderId === user.uid;
                            return (
                                <div key={msg.id} className={"flex " + (isMe ? "justify-end" : "justify-start")}>
                                    <div className={"max-w-[85%] px-3 py-2 " + (isMe ? "bubble-out" : "bubble-in")}>
                                        {msg.type === 'image' && <img src={msg.imageUrl} onClick={() => onOpenLightbox(msg.imageUrl)} className="rounded-lg max-h-60 mb-1 cursor-pointer" />}
                                        {msg.text && <div className="text-[15px] break-words">{msg.text}</div>}
                                    </div>
                                </div>
                            );
                        })}
                        <div ref={messagesEndRef}></div>
                    </div>

                    <div className="bg-[#f0f2f5] px-3 py-2.5 flex items-center gap-2 border-t">
                        <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImagePick} className="hidden" />
                        <button onClick={() => fileInputRef.current?.click()} className="w-10 h-10 rounded-full text-gray-500 hover:bg-gray-200"><i className="fa-solid fa-paperclip text-lg"></i></button>
                        <form onSubmit={handleSend} className="flex-1 flex gap-2">
                            <input type="text" value={text} onChange={e => setText(e.target.value)} placeholder="Scrivi un messaggio..." className="flex-1 bg-white rounded-full px-4 py-2 text-sm outline-none shadow-sm" />
                            <button type="submit" disabled={!text.trim()} className="w-10 h-10 rounded-full bg-[#008069] text-white disabled:opacity-50"><i className="fa-solid fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
        }
    </script>
</body>
</html>
