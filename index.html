                                <>
                                    <button onClick={() => setModal('tagChat')} className="bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400 text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer"><i className="fa-solid fa-tag"></i></button>
                                    {chatInfo.isGroup && <button onClick={onOpenAddMembers} className="bg-[#008069]/10 dark:bg-[#008069]/30 text-[#008069] dark:text-[#00a884] text-xs font-bold px-3 py-1.5 rounded-lg cursor-pointer"><i className="fa-solid fa-user-plus"></i></button>}
                                </>
                            )}
                        </div>
                    </div>
                    {chat.pinnedMessage && (
                        <div className="bg-white/90 dark:bg-gray-800/90 backdrop-blur border-b dark:border-gray-700 px-4 py-2 flex justify-between items-center z-10 shadow-sm"><div className="flex items-center gap-2 min-w-0"><i className="fa-solid fa-thumbtack text-[#008069] dark:text-[#00a884]"></i><div className="truncate text-xs"><div className="font-bold text-[#008069] dark:text-[#00a884]">{chat.pinnedMessage.senderName}</div><div className="text-gray-600 dark:text-gray-300 truncate">{formatText(chat.pinnedMessage.text, false)}</div></div></div><button onClick={handleUnpinMessage} className="text-gray-500 p-2 cursor-pointer"><i className="fa-solid fa-xmark"></i></button></div>
                    )}
                    
                    <div className="flex-1 overflow-y-auto p-4 space-y-3">
                        {globalSearchTerm && filteredMessages.length === 0 && (
                            <div className="text-center text-gray-500 mt-4 text-sm">Nessun messaggio trovato per "{globalSearchTerm}"</div>
                        )}
                        
                        {filteredMessages.map(msg => {
                            const isMe = msg.senderId === user.uid; const isRead = msg.readBy?.length > 0;
                            const activeReactions = Object.entries(msg.reactions || {}).filter(([, arr]) => Array.isArray(arr) && arr.length > 0);
                            return (
                                <div key={msg.id} className={"flex flex-col " + (isMe ? "items-end" : "items-start")}>
                                    <div className={"max-w-[85%] sm:max-w-[70%] px-3 py-2 relative group " + (isMe ? "bubble-out" : "bubble-in")} onClick={e => e.stopPropagation()}>
                                        {!isMe && chatInfo.isGroup && <div className="text-xs font-bold text-[#008069] mb-0.5">{msg.senderName}</div>}
                                        {msg.replyToData && <div className="bg-black/5 dark:bg-white/5 border-l-4 border-[#008069] px-2.5 py-1.5 mb-1.5 rounded text-xs"><div className="font-bold text-[#008069]">{msg.replyToData.senderName}</div><div className="opacity-80 truncate">{msg.replyToData.text}</div></div>}
                                        
                                        {msg.type === 'image' && <div className="mb-1"><img src={msg.imageUrl} onClick={()=>onOpenLightbox(msg.imageUrl)} className="rounded-lg max-h-72 object-cover cursor-pointer border border-black/5" /></div>}
                                        {msg.type === 'file' && (
                                            <a href={msg.fileUrl} target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 bg-black/5 dark:bg-white/5 p-3 rounded-xl mb-1 cursor-pointer hover:bg-black/10 transition no-underline text-gray-900 dark:text-white">
                                                <div className="w-10 h-10 rounded-lg bg-[#008069] text-white flex items-center justify-center flex-shrink-0"><i className="fa-solid fa-file-lines text-xl"></i></div>
                                                <div className="min-w-0 flex-1"><div className="font-bold text-sm truncate">{msg.fileName}</div><div className="text-xs opacity-70">Documento allegato</div></div>
                                            </a>
                                        )}
                                        {msg.type === 'audio' && (
                                            <CustomAudioPlayer src={msg.audioUrl} />
                                        )}
                                        {msg.type === 'poll' && msg.pollData && (() => {
                                            const opts = msg.pollData.options || [];
                                            const votesMap = msg.pollData.votes || {};
                                            const totalVotes = opts.reduce((acc, o) => acc + ((votesMap[o.id] || []).length), 0);
                                            return (
                                                <div className="w-64 sm:w-72 py-1 space-y-2">
                                                    <div className="font-extrabold text-sm flex items-center gap-1.5">
                                                        <i className="fa-solid fa-square-poll-vertical text-[#008069]"></i>
                                                        <span>{msg.pollData.question}</span>
                                                    </div>
                                                    <div className="text-[10px] opacity-70 font-semibold">Tocca un'opzione per votare ({totalVotes} voti totali)</div>
                                                    <div className="space-y-1.5">
                                                        {opts.map(opt => {
                                                            const vArr = votesMap[opt.id] || [];
                                                            const count = vArr.length;
                                                            const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                                                            const myVote = vArr.includes(user.uid);
                                                            return (
                                                                <button
                                                                    key={opt.id}
                                                                    type="button"
                                                                    onClick={() => handleVotePoll(msg, opt.id)}
                                                                    className={`w-full text-left p-2 rounded-xl border relative overflow-hidden transition cursor-pointer ${myVote ? 'border-[#008069] bg-white/80 dark:bg-gray-800/80 font-bold' : 'border-black/10 dark:border-white/10 bg-black/5 dark:bg-white/5'}`}
                                                                >
                                                                    <div className="absolute inset-y-0 left-0 bg-[#008069]/20 transition-all duration-300" style={{ width: `${pct}%` }}></div>
                                                                    <div className="relative flex justify-between items-center text-xs gap-2">
                                                                        <span className="truncate">{myVote && '✅ '}{opt.text}</span>
                                                                        <span className="font-mono text-[11px] flex-shrink-0">{pct}% ({count})</span>
                                                                    </div>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                        
                                        {msg.text && <div className="text-[15px] break-words leading-snug">{formatText(msg.text, true, globalSearchTerm)}</div>}

                                        {reactionPickerMsgId === msg.id && (
                                            <div className={"absolute -top-10 z-30 bg-white dark:bg-gray-800 shadow-xl border border-gray-200 dark:border-gray-700 rounded-full px-2.5 py-1 flex items-center gap-1.5 " + (isMe ? "right-0" : "left-0")}>
                                                {REACTION_EMOJIS.map(em => (
                                                    <button key={em} type="button" onClick={() => toggleReaction(msg, em)} className="text-base hover:scale-125 transition cursor-pointer">{em}</button>
                                                ))}
                                            </div>
                                        )}

                                        <div className="flex items-center justify-end gap-2 mt-1">
                                            <button type="button" onClick={() => setReactionPickerMsgId(prev => prev === msg.id ? null : msg.id)} title="Reagisci" className="opacity-60 hover:opacity-100 text-[11px] cursor-pointer"><i className="fa-regular fa-face-smile"></i></button>
                                            <button type="button" onClick={()=>handlePinMessage(msg)} title="Fissa in alto" className="opacity-60 hover:opacity-100 text-[11px] cursor-pointer"><i className="fa-solid fa-thumbtack"></i></button>
                                            <button type="button" onClick={()=>setReplyTo(msg)} title="Rispondi" className="opacity-60 hover:opacity-100 text-[11px] cursor-pointer"><i className="fa-solid fa-reply"></i></button>
                                            {isMe && (msg.type === 'text' || msg.type === 'image') && (
                                                <button type="button" onClick={() => startEditMessage(msg)} title="Modifica messaggio" className="opacity-60 hover:opacity-100 text-[11px] cursor-pointer"><i className="fa-solid fa-pen"></i></button>
                                            )}
                                            {isMe && (confirmDeleteId===msg.id ? <span className="text-[10px] bg-red-100 dark:bg-red-900/50 px-1 rounded"><button onClick={()=>handleDeleteMessage(msg.id)} className="text-red-600 font-bold cursor-pointer">Eli</button> | <button onClick={()=>setConfirmDeleteId(null)} className="cursor-pointer">No</button></span> : <button onClick={()=>setConfirmDeleteId(msg.id)} className="opacity-60 text-[11px] cursor-pointer"><i className="fa-solid fa-trash"></i></button>)}
                                            {msg.edited && <span className="text-[10px] italic opacity-60">modificato</span>}
                                            <span className="text-[10px] opacity-60">{msg.timestamp?.toDate ? msg.timestamp.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : '...'}</span>
                                            {isMe && <i className={"fa-solid fa-check-double text-[11px] " + (isRead ? "text-[#34B7F1]" : "opacity-50")}></i>}
                                        </div>
                                    </div>

                                    {activeReactions.length > 0 && (
                                        <div className="flex flex-wrap gap-1 mt-1 px-1">
                                            {activeReactions.map(([emoji, uids]) => {
                                                const mine = uids.includes(user.uid);
                                                return (
                                                    <button
                                                        key={emoji}
                                                        type="button"
                                                        onClick={() => toggleReaction(msg, emoji)}
                                                        className={`text-xs px-2 py-0.5 rounded-full border shadow-sm flex items-center gap-1 cursor-pointer transition ${mine ? 'bg-emerald-100 dark:bg-emerald-900/60 border-[#008069] text-[#008069] dark:text-emerald-300 font-bold' : 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200'}`}
                                                    >
                                                        <span>{emoji}</span><span>{uids.length}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                        <div ref={messagesEndRef}></div>
                    </div>

                    {/* BARRA RISPOSTA O MODIFICA */}
                    {replyTo && <div className="bg-[#f0f2f5] dark:bg-gray-800 px-4 py-2 border-t dark:border-gray-700 border-l-4 border-l-[#008069] flex justify-between flex-shrink-0"><div className="text-xs truncate"><div className="font-bold text-[#008069]">Rispondi a {replyTo.senderName}</div><div className="text-gray-600 dark:text-gray-300 truncate">{replyTo.text || 'Allegato'}</div></div><button onClick={()=>setReplyTo(null)} className="text-gray-500 cursor-pointer"><i className="fa-solid fa-xmark"></i></button></div>}
                    {editingMsg && (
                        <div className="bg-amber-50 dark:bg-amber-900/30 px-4 py-2 border-t dark:border-gray-700 border-l-4 border-l-amber-500 flex justify-between items-center flex-shrink-0">
                            <div className="text-xs truncate">
                                <div className="font-bold text-amber-700 dark:text-amber-400">✏️ Modifica messaggio</div>
                                <div className="text-gray-600 dark:text-gray-300 truncate">{editingMsg.text}</div>
                            </div>
                            <button onClick={() => { setEditingMsg(null); setText(''); }} className="text-gray-500 cursor-pointer"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                    )}

                    {/* BARRA RISPOSTE RAPIDE CON TASTO GESTISCI */}
                    {showQuick && isAdmin && (
                        <div className="bg-white dark:bg-gray-800 border-t dark:border-gray-700 p-2 overflow-x-auto flex items-center gap-2 flex-shrink-0 no-scrollbar">
                            <button
                                type="button"
                                onClick={() => setShowQuickManager(true)}
                                className="bg-[#008069] text-white text-xs font-bold px-3 py-2 rounded-xl whitespace-nowrap cursor-pointer flex items-center gap-1 flex-shrink-0"
                            >
                                <i className="fa-solid fa-sliders"></i> + Gestisci Risposte
                            </button>
                            {quickRepliesList.map((r,i) => (
                                <button key={i} onClick={()=>{setText(r); setShowQuick(false);}} className="bg-gray-100 dark:bg-gray-700 dark:text-gray-200 text-xs px-3 py-2 rounded-xl whitespace-nowrap cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600">
                                    {r.length > 35 ? r.substring(0, 35) + '...' : r}
                                </button>
                            ))}
                        </div>
                    )}
                    
                    <div className="bg-[#f0f2f5] dark:bg-gray-900 px-3 py-2.5 flex items-center gap-1.5 border-t dark:border-gray-700 flex-shrink-0">
                        {isRecording ? (
                            <div className="flex-1 flex items-center justify-between bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 rounded-full px-4 py-2.5 text-sm font-bold animate-pulse">
                                <div className="flex items-center gap-2"><i className="fa-solid fa-microphone"></i> Registrazione...</div>
                                <span>{formatTime(recordingTime)}</span>
                            </div>
                        ) : (
                            <>
                                {isAdmin && <button onClick={()=>setShowQuick(!showQuick)} title="Risposte Rapide" className="w-9 h-9 rounded-full text-amber-500 hover:bg-gray-200 dark:hover:bg-gray-800 cursor-pointer flex-shrink-0"><i className="fa-solid fa-bolt text-lg"></i></button>}
                                {(chatInfo.isGroup || isAdmin) && (
                                    <button type="button" onClick={() => setShowPollModal(true)} title="Crea Sondaggio" className="w-9 h-9 rounded-full text-[#008069] dark:text-[#00a884] hover:bg-gray-200 dark:hover:bg-gray-800 cursor-pointer flex-shrink-0">
                                        <i className="fa-solid fa-square-poll-vertical text-lg"></i>
                                    </button>
                                )}
                                <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImagePick} className="hidden" />
                                <input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.zip" ref={docInputRef} onChange={handleFilePick} className="hidden" />
                                
                                <button type="button" disabled={uploadingImg} onClick={()=>docInputRef.current?.click()} title="Allega Documento" className="w-9 h-9 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800 cursor-pointer flex-shrink-0">
                                    <i className="fa-solid fa-file-lines text-lg"></i>
                                </button>
                                <button type="button" disabled={uploadingImg} onClick={()=>fileInputRef.current?.click()} title="Allega Foto" className="w-9 h-9 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800 cursor-pointer flex-shrink-0">
                                    {uploadingImg ? <div className="w-5 h-5 border-2 border-[#008069] border-t-transparent rounded-full animate-spin mx-auto"></div> : <i className="fa-solid fa-camera text-lg"></i>}
                                </button>
                                
                                <form onSubmit={handleSendForm} className="flex-1 flex gap-2 min-w-0">
                                    <input type="text" value={text} onChange={handleTextChange} placeholder={editingMsg ? "Modifica testo..." : "Scrivi..."} className="flex-1 bg-white dark:bg-gray-700 dark:text-white rounded-full px-4 py-2.5 text-sm outline-none min-w-0" />
                                    <button type="submit" disabled={!text.trim()} className="w-10 h-10 rounded-full bg-[#008069] text-white disabled:hidden cursor-pointer flex-shrink-0"><i className={`fa-solid ${editingMsg ? 'fa-check' : 'fa-paper-plane'}`}></i></button>
                                </form>
                            </>
                        )}
                        
                        {!editingMsg && (
                            <button type="button" onClick={toggleRecording} className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 transition cursor-pointer ${isRecording ? 'bg-red-500 text-white shadow-lg shadow-red-500/30' : 'bg-[#008069] text-white'}`}>
                                {isRecording ? <i className="fa-solid fa-stop"></i> : <i className="fa-solid fa-microphone"></i>}
                            </button>
                        )}
                    </div>

                    {/* MODALE ANTEPRIMA IMMAGINE + DIDASCALIA */}
                    {pendingImage && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <form onSubmit={confirmSendPendingImage} className="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
                                <div className="bg-[#008069] px-5 py-3.5 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-sm"><i className="fa-solid fa-image mr-2"></i>Anteprima Immagine</h3>
                                    <button type="button" onClick={() => { URL.revokeObjectURL(pendingImage.previewUrl); setPendingImage(null); }} className="cursor-pointer"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="p-4 space-y-4">
                                    <div className="bg-black/90 rounded-xl overflow-hidden flex items-center justify-center max-h-72">
                                        <img src={pendingImage.previewUrl} alt="Anteprima" className="max-h-72 object-contain" />
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="Aggiungi una didascalia opzionale..."
                                        value={pendingImage.caption}
                                        onChange={e => setPendingImage(prev => ({ ...prev, caption: e.target.value }))}
                                        className="w-full px-3.5 py-2.5 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none"
                                        autoFocus
                                    />
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => { URL.revokeObjectURL(pendingImage.previewUrl); setPendingImage(null); }} className="flex-1 py-2.5 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold text-xs rounded-xl cursor-pointer">Annulla</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-[#008069] text-white font-bold text-xs rounded-xl cursor-pointer"><i className="fa-solid fa-paper-plane mr-1.5"></i> Invia Foto</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODALE GESTIONE RISPOSTE RAPIDE (⚡) */}
                    {showQuickManager && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl flex flex-col max-h-[80vh]">
                                <div className="bg-[#008069] px-5 py-4 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-sm"><i className="fa-solid fa-bolt mr-2"></i>Gestisci Risposte Rapide</h3>
                                    <button onClick={() => setShowQuickManager(false)} className="cursor-pointer"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <form onSubmit={handleAddQuickReply} className="p-4 border-b dark:border-gray-700 flex gap-2">
                                    <input
                                        type="text"
                                        placeholder="Nuovo template risposta rapida..."
                                        value={newQuickReplyText}
                                        onChange={e => setNewQuickReplyText(e.target.value)}
                                        className="flex-1 px-3 py-2 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-xs outline-none"
                                    />
                                    <button type="submit" className="bg-[#008069] text-white font-bold text-xs px-4 rounded-xl cursor-pointer">Aggiungi</button>
                                </form>
                                <div className="flex-1 overflow-y-auto p-3 space-y-2">
                                    {quickRepliesList.map((item, idx) => (
                                        <div key={idx} className="flex items-center justify-between gap-2 p-2.5 bg-gray-50 dark:bg-gray-700/60 rounded-xl text-xs text-gray-800 dark:text-gray-200">
                                            <span className="flex-1">{item}</span>
                                            <button onClick={() => handleDeleteQuickReply(idx)} className="text-red-500 hover:text-red-700 p-1 cursor-pointer"><i className="fa-solid fa-trash"></i></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALE CREA SONDAGGIO (POLLS) */}
                    {showPollModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleCreatePoll} className="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
                                <div className="bg-[#008069] px-5 py-4 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-sm"><i className="fa-solid fa-square-poll-vertical mr-2"></i>Nuovo Sondaggio Istantaneo</h3>
                                    <button type="button" onClick={() => setShowPollModal(false)} className="cursor-pointer"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="p-5 space-y-3 max-h-[75vh] overflow-y-auto">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-600 dark:text-gray-300 mb-1">Domanda del Sondaggio</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Es. Quale orario preferite per la Zoom?"
                                            value={pollQuestion}
                                            onChange={e => setPollQuestion(e.target.value)}
                                            className="w-full px-3.5 py-2 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-gray-600 dark:text-gray-300">Opzioni di risposta</label>
                                        {pollOptions.map((opt, i) => (
                                            <div key={i} className="flex gap-2">
                                                <input
                                                    type="text"
                                                    placeholder={`Opzione ${i + 1}`}
                                                    value={opt}
                                                    onChange={e => {
                                                        const copy = [...pollOptions];
                                                        copy[i] = e.target.value;
                                                        setPollOptions(copy);
                                                    }}
                                                    className="flex-1 px-3 py-2 bg-gray-50 dark:bg-gray-700 dark:text-white border dark:border-gray-600 rounded-xl text-xs outline-none"
                                                />
                                                {pollOptions.length > 2 && (
                                                    <button type="button" onClick={() => setPollOptions(pollOptions.filter((_, idx) => idx !== i))} className="text-red-500 px-2 cursor-pointer"><i className="fa-solid fa-xmark"></i></button>
                                                )}
                                            </div>
                                        ))}
                                        {pollOptions.length < 6 && (
                                            <button type="button" onClick={() => setPollOptions([...pollOptions, ''])} className="text-xs font-bold text-[#008069] dark:text-[#00a884] cursor-pointer">+ Aggiungi opzione</button>
                                        )}
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-[#008069] text-white font-bold text-xs rounded-xl cursor-pointer mt-2">Pubblica Sondaggio</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        function AcademyModule({ user, userData, setUserData, isAdmin, showToast, onOpenLauncher }) {
            const [pages, setPages] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [activePageId, setActivePageId] = useState(null);
            const [editMode, setEditMode] = useState(false);
            const [allUsers, setAllUsers] = useState({});

            // Bacheca Annunci / Eventi Zoom in Cima all'Academy
            const [eventBanner, setEventBanner] = useState(null);
            const [editingBanner, setEditingBanner] = useState(false);
            const [bannerForm, setBannerForm] = useState({ title: '', dateTime: '', link: '', active: true });

            const academyContentRef = useRef(null);
            const [localContent, setLocalContent] = useState('');

            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.collection(window.db, "academy_pages"), (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => d.id !== '_announcement_banner');
                    list.sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0));
                    setPages(list);
                });
                return () => unsub();
            }, []);

            // Listener per il Banner Evento in cima all'Academy
            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.doc(window.db, "academy_pages", "_announcement_banner"), (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        setEventBanner(data);
                        setBannerForm({
                            title: data.title || '',
                            dateTime: data.dateTime || '',
                            link: data.link || '',
                            active: data.active !== false
                        });
                    }
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if(isAdmin) {
                    const fm = window.firebaseMethods;
                    const unsub = fm.onSnapshot(fm.collection(window.db, "users"), (snap) => {
                        const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); }); setAllUsers(map);
                    });
                    return () => unsub();
                }
            }, [isAdmin]);

            const activePage = pages.find(p => p.id === activePageId) || null;

            useEffect(() => {
                if(activePage) setLocalContent(activePage.content || '');
            }, [activePage?.id]);

            useEffect(() => {
                if(activePageId && !isAdmin) {
                    const fm = window.firebaseMethods;
                    fm.updateDoc(fm.doc(window.db, "academy_pages", activePageId), {
                        views: fm.arrayUnion(user.uid)
                    }).catch(()=>{});
                }
            }, [activePageId, isAdmin, user.uid]);

            const saveBannerEvent = async (e) => {
                e.preventDefault();
                const fm = window.firebaseMethods;
                try {
                    await fm.setDoc(fm.doc(window.db, "academy_pages", "_announcement_banner"), {
                        ...bannerForm,
                        updatedAt: fm.serverTimestamp()
                    }, { merge: true });
                    setEditingBanner(false);
                    showToast("Bacheca Evento aggiornata!");
                } catch (err) {
                    showToast("Errore salvataggio evento", "error");
                }
            };

            const createAcademyPage = async () => {
                if (!isAdmin) return;
                const fm = window.firebaseMethods;
                try {
                    const ref = await fm.addDoc(fm.collection(window.db, "academy_pages"), {
                        title: "Nuova Guida Academy", icon: "🎓", category: "Formazione", content: "Scrivi qui la guida...", views: [], completedBy: [], updatedAt: fm.serverTimestamp()
                    });
                    setActivePageId(ref.id); setEditMode(true);
                } catch (e) { showToast("Errore creazione", "error"); }
            };

            const updateAcademyField = (field, value) => {
                if (!isAdmin || !activePageId) return;
                const fm = window.firebaseMethods;
                fm.setDoc(fm.doc(window.db, "academy_pages", activePageId), { [field]: value, updatedAt: fm.serverTimestamp() }, { merge: true }).catch(() => {});
            };

            const deleteAcademyPage = async () => {
                if (!isAdmin || !activePageId) return;
                if (window.confirm("Eliminare definitivamente?")) {
                    await window.firebaseMethods.deleteDoc(window.firebaseMethods.doc(window.db, "academy_pages", activePageId));
                    setActivePageId(null); showToast("Eliminata!");
                }
            };

            // Gamification: Segna Guida come Completata
            const completedGuides = Array.isArray(userData?.completedAcademyIds) ? userData.completedAcademyIds : [];
            const completionPercentage = pages.length > 0
                ? Math.min(100, Math.round((pages.filter(p => completedGuides.includes(p.id)).length / pages.length) * 100))
                : 0;

            const toggleCompleteGuide = async (pageId) => {
                const fm = window.firebaseMethods;
                const isDone = completedGuides.includes(pageId);
                const updatedList = isDone ? completedGuides.filter(id => id !== pageId) : [...completedGuides, pageId];
                try {
                    await fm.setDoc(fm.doc(window.db, "users", user.uid), {
                        completedAcademyIds: updatedList
                    }, { merge: true });
                    await fm.updateDoc(fm.doc(window.db, "academy_pages", pageId), {
                        completedBy: isDone ? fm.arrayRemove(user.uid) : fm.arrayUnion(user.uid)
                    }).catch(()=>{});
                    setUserData(prev => ({ ...prev, completedAcademyIds: updatedList }));
                    showToast(isDone ? "Guida rimossa dai completati" : "✅ Guida completata!");
                } catch (e) {
                    showToast("Errore aggiornamento progresso", "error");
                }
            };

            const handleContentChange = (val) => {
                setLocalContent(val);
                updateAcademyField('content', val);
            };

            const handleAcademyFormat = (pref, suff) => applyFormatting(academyContentRef, pref, suff, handleContentChange);

            const filteredPages = pages.filter(p => (p.title || '').toLowerCase().includes(searchTerm.toLowerCase()) || (p.category || '').toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <>
                    <div className={"w-full md:w-[320px] lg:w-[350px] h-full bg-gray-50 dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col flex-shrink-0 " + (activePage ? "hidden md:flex" : "flex")}>
                        <div className="bg-[#008069] px-4 py-4 flex items-center justify-between text-white flex-shrink-0">
                            <div className="flex items-center gap-3">
                                <button onClick={onOpenLauncher} className="md:hidden w-9 h-9 rounded-full hover:bg-white/20 flex items-center justify-center transition cursor-pointer"><i className="fa-solid fa-grip text-lg"></i></button>
                                <div className="font-bold text-lg cursor-pointer" onClick={()=>setActivePageId(null)}>Academy & Risorse</div>
                            </div>
                            {isAdmin && (
                                <button onClick={() => setEditingBanner(true)} title="Configura Banner Evento / Call Zoom" className="w-8 h-8 rounded-full hover:bg-white/20 flex items-center justify-center cursor-pointer">
                                    <i className="fa-solid fa-calendar-star text-sm"></i>
                                </button>
                            )}
                        </div>

                        {/* BARRA DI AVANZAMENTO FORMAZIONE (% COMPLETAMENTO) */}
                        <div className="px-4 py-3 bg-emerald-50/80 dark:bg-gray-900 border-b border-emerald-100 dark:border-gray-700">
                            <div className="flex justify-between items-center text-xs font-extrabold text-[#008069] dark:text-[#00a884] mb-1">
                                <span>🏆 Tuo Progresso Percorso</span>
                                <span>{completionPercentage}%</span>
                            </div>
                            <div className="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                                <div className="h-full bg-[#008069] transition-all duration-500" style={{ width: `${completionPercentage}%` }}></div>
                            </div>
                        </div>

                        <div className="p-3 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
                            <div className="bg-gray-100 dark:bg-gray-900 rounded-xl flex items-center px-3.5 py-2 mb-2">
                                <i className="fa-solid fa-magnifying-glass text-gray-400"></i>
                                <input type="text" placeholder="Cerca materiale..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-transparent border-none outline-none w-full text-sm ml-2.5 text-gray-700 dark:text-gray-200" />
                            </div>
                            {isAdmin && (
                                <button onClick={createAcademyPage} className="w-full bg-[#008069] hover:bg-[#017561] text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-2 transition cursor-pointer">
                                    <i className="fa-solid fa-plus"></i> Nuova Guida
                                </button>
                            )}
                        </div>

                        <div className="flex-1 overflow-y-auto p-3 space-y-1.5">
                            {filteredPages.map(p => {
                                const isDone = completedGuides.includes(p.id);
                                return (
                                    <div key={p.id} onClick={() => { setActivePageId(p.id); setEditMode(false); }} className={`p-3 rounded-xl flex items-center gap-3 cursor-pointer transition ${activePageId === p.id ? 'bg-[#008069]/10 dark:bg-[#008069]/30 text-[#008069] dark:text-[#00a884] font-bold' : 'bg-white dark:bg-gray-750 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 shadow-sm border border-gray-100 dark:border-gray-700'}`}>
                                        <span className="text-2xl">{p.icon || '🎓'}</span>
                                        <div className="min-w-0 flex-1">
                                            <div className="text-sm font-bold truncate">{p.title || 'Senza Titolo'}</div>
                                            <div className="text-[11px] text-gray-400 truncate">{p.category || 'Risorsa'}</div>
                                        </div>
                                        {isDone && <span className="text-emerald-500 text-sm" title="Completata">✅</span>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className={"flex-1 h-full flex flex-col bg-white dark:bg-[#191919] overflow-y-auto " + (!activePage ? "hidden md:flex" : "flex w-full")}>
                        {/* BACHECA ANNUNCI / EVENTI IN CIMA ALL'ACADEMY */}
                        {eventBanner && eventBanner.active && eventBanner.title && (
                            <div className="bg-gradient-to-r from-amber-500 to-orange-600 text-white px-5 py-3 flex flex-wrap items-center justify-between gap-3 shadow-md flex-shrink-0">
                                <div className="flex items-center gap-3">
                                    <span className="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-lg"><i className="fa-solid fa-video"></i></span>
                                    <div>
                                        <div className="text-xs font-extrabold uppercase tracking-wider opacity-90">📅 Prossimo Evento / Call Live</div>
                                        <div className="text-sm font-bold">{eventBanner.title} {eventBanner.dateTime && <span className="opacity-90 font-normal">({eventBanner.dateTime})</span>}</div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2">
                                    {eventBanner.link && (
                                        <a href={eventBanner.link} target="_blank" rel="noopener noreferrer" className="bg-white text-orange-600 font-extrabold text-xs px-4 py-2 rounded-xl shadow hover:bg-orange-50 transition">
                                            Partecipa alla Call 🚀
                                        </a>
                                    )}
                                    {isAdmin && (
                                        <button onClick={() => setEditingBanner(true)} className="bg-black/20 hover:bg-black/30 text-white text-xs px-2.5 py-2 rounded-xl cursor-pointer">
                                            <i className="fa-solid fa-pen"></i>
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}

                        {activePage ? (
                            <div className="max-w-4xl w-full mx-auto pb-32">
                                <div className="h-32 sm:h-44 w-full bg-gradient-to-r from-teal-500 to-[#008069] relative flex-shrink-0">
                                    <button onClick={() => setActivePageId(null)} className="md:hidden absolute top-4 left-4 w-10 h-10 bg-black/20 text-white rounded-full flex items-center justify-center backdrop-blur cursor-pointer"><i className="fa-solid fa-arrow-left"></i></button>
                                    {isAdmin && (
                                        <div className="absolute top-4 right-4 flex gap-2">
                                            <button onClick={() => setEditMode(prev => !prev)} className="px-3 py-1.5 bg-black/30 hover:bg-black/50 text-white rounded-full text-xs font-bold backdrop-blur cursor-pointer">
                                                {editMode ? '👁️ Anteprima' : '✏️ Modifica'}
                                            </button>
                                            <button onClick={deleteAcademyPage} className="w-9 h-9 bg-black/30 hover:bg-red-600 text-white rounded-full flex items-center justify-center backdrop-blur cursor-pointer">
                                                <i className="fa-solid fa-trash text-xs"></i>
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="px-6 sm:px-16 -mt-12 relative z-10">
                                    {isAdmin && editMode ? (
                                        <>
                                            <input type="text" value={activePage.icon || '🎓'} onChange={e => updateAcademyField('icon', e.target.value)} className="w-20 h-20 text-5xl bg-white dark:bg-[#191919] rounded-2xl text-center outline-none mb-4" />
                                            <input type="text" placeholder="Categoria (es. Script, Zoom)" value={activePage.category || ''} onChange={e => updateAcademyField('category', e.target.value)} className="block text-xs font-bold uppercase tracking-wider text-[#008069] bg-transparent outline-none mb-2 w-full" />
                                            <input type="text" placeholder="Titolo della Guida" value={activePage.title || ''} onChange={e => updateAcademyField('title', e.target.value)} className="w-full text-3xl sm:text-4xl font-extrabold text-gray-900 dark:text-white mb-6 bg-transparent outline-none" />
                                            
                                            <div className="text-xs text-gray-500 dark:text-gray-400 mb-2">💡 Incolla un link <b>YouTube, Vimeo o Loom</b> su una riga dedicata per incorporare il video player direttamente nella lezione.</div>
                                            <AdminToolbar onFormat={handleAcademyFormat} />
                                            <textarea ref={academyContentRef} placeholder="Scrivi il contenuto..." value={localContent} onChange={e => handleContentChange(e.target.value)} className="w-full min-h-[400px] bg-gray-50 dark:bg-gray-800/60 p-4 rounded-xl text-gray-800 dark:text-gray-200 outline-none text-base leading-relaxed resize-none"></textarea>
                                        </>
                                    ) : (
                                        <>
                                            <div className="w-20 h-20 text-5xl bg-white dark:bg-[#191919] rounded-2xl flex items-center justify-center shadow-sm mb-4">{activePage.icon || '🎓'}</div>
                                            <div className="text-xs font-bold uppercase tracking-wider text-[#008069] dark:text-[#00a884] mb-1">{activePage.category || 'Risorsa'}</div>
                                            <h1 className="text-3xl sm:text-4xl font-extrabold text-gray-900 dark:text-white mb-6">{activePage.title}</h1>
                                            <div className="text-gray-800 dark:text-gray-200 text-base leading-relaxed space-y-1 border-t border-gray-100 dark:border-gray-800 pt-6 pb-8">
                                                {formatText(activePage.content || '', true, '', true)}
                                            </div>

                                            {/* PULSANTE SEGNA COME COMPLETATA */}
                                            <div className="my-6 p-4 rounded-2xl bg-gray-50 dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700 flex flex-wrap items-center justify-between gap-3">
                                                <div>
                                                    <div className="font-bold text-sm text-gray-800 dark:text-white">Stato di avanzamento lezione</div>
                                                    <div className="text-xs text-gray-500 dark:text-gray-400">Hai completato il {completionPercentage}% dell'intero percorso Academy.</div>
                                                </div>
                                                <button
                                                    type="button"
                                                    onClick={() => toggleCompleteGuide(activePage.id)}
                                                    className={`px-5 py-2.5 rounded-xl font-extrabold text-xs transition cursor-pointer ${completedGuides.includes(activePage.id) ? 'bg-emerald-600 text-white shadow-md' : 'bg-white dark:bg-gray-700 border border-[#008069] text-[#008069] dark:text-emerald-300'}`}
                                                >
                                                    {completedGuides.includes(activePage.id) ? '✅ Guida Completata!' : '☑️ Segna guida come completata'}
                                                </button>
                                            </div>
                                            
                                            {isAdmin && activePage.views && activePage.views.length > 0 && (
                                                <div className="mt-8 bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-900/30 p-4 rounded-xl">
                                                    <div className="text-xs font-bold text-blue-800 dark:text-blue-300 uppercase tracking-wider mb-3 flex items-center gap-2"><i className="fa-solid fa-eye"></i> Visto da {activePage.views.length} affiliati:</div>
                                                    <div className="flex flex-wrap gap-2">
                                                        {activePage.views.map(uid => (
                                                            <div key={uid} className="bg-white dark:bg-gray-800 px-2.5 py-1 rounded-full text-xs font-bold text-gray-700 dark:text-gray-200 shadow-sm border border-gray-100 dark:border-gray-700 flex items-center gap-1.5">
                                                                <Avatar name={allUsers[uid]?.name} photoURL={allUsers[uid]?.photoURL} size="w-4 h-4" textSize="text-[8px]" />
                                                                {allUsers[uid]?.name || 'Utente rimosso'}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-center p-6">
                                <div className="w-24 h-24 bg-emerald-50 dark:bg-gray-800 rounded-3xl flex items-center justify-center mb-6"><i className="fa-solid fa-graduation-cap text-5xl text-[#008069]"></i></div>
                                <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-200">Academy Formativa</h2>
                                <p className="text-gray-500 dark:text-gray-400 mt-2 max-w-md text-sm">Consulta i materiali, guarda i video integrati e segna le lezioni come completate. ({completionPercentage}% completato)</p>
                                {isAdmin && (
                                    <button onClick={() => setEditingBanner(true)} className="mt-5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow cursor-pointer">
                                        📅 Imposta Banner Evento / Call Zoom
                                    </button>
                                )}
                            </div>
                        )}
                    </div>

                    {/* MODALE CONFIGURAZIONE BANNER EVENTO ACADEMY */}
                    {editingBanner && isAdmin && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <form onSubmit={saveBannerEvent} className="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
                                <div className="bg-amber-500 px-5 py-4 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-sm"><i className="fa-solid fa-video mr-2"></i>Bacheca Evento / Call Zoom</h3>
                                    <button type="button" onClick={() => setEditingBanner(false)} className="cursor-pointer"><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="p-5 space-y-3">
                                    <input
                                        type="text"
                                        placeholder="Titolo Evento (es. Masterclass Settimanale)"
                                        value={bannerForm.title}
                                        onChange={e => setBannerForm({ ...bannerForm, title: e.target.value })}
                                        className="w-full px-3.5 py-2 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none"
                                    />
                                    <input
                                        type="text"
                                        placeholder="Data e Ora (es. Giovedì ore 21:00)"
                                        value={bannerForm.dateTime}
                                        onChange={e => setBannerForm({ ...bannerForm, dateTime: e.target.value })}
                                        className="w-full px-3.5 py-2 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none"
                                    />
                                    <input
                                        type="url"
                                        placeholder="Link diretto Zoom / Meet (https://...)"
                                        value={bannerForm.link}
                                        onChange={e => setBannerForm({ ...bannerForm, link: e.target.value })}
                                        className="w-full px-3.5 py-2 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none"
                                    />
                                    <label className="flex items-center gap-2 text-xs font-bold text-gray-700 dark:text-gray-200 cursor-pointer pt-1">
                                        <input
                                            type="checkbox"
                                            checked={bannerForm.active}
                                            onChange={e => setBannerForm({ ...bannerForm, active: e.target.checked })}
                                        />
                                        Mostra banner in cima all'Academy
                                    </label>
                                    <button type="submit" className="w-full py-3 bg-amber-500 text-white font-bold text-xs rounded-xl cursor-pointer">Salva Bacheca Evento</button>
                                </div>
                            </form>
                        </div>
                    )}
                </>
            );
        }

        function CRMModule({ user, isAdmin, showToast, onOpenLauncher, onOpenDirectChat }) {
            const [allUsers, setAllUsers] = useState({});
            const [allCrmProfiles, setAllCrmProfiles] = useState({});
            const [customPages, setCustomPages] = useState([]);
            const [academyPages, setAcademyPages] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            
            const [activeSelection, setActiveSelection] = useState(null);
            const [activeData, setActiveData] = useState(null);
            const [viewChecklistMode, setViewChecklistMode] = useState(false);
            const [crmViewMode, setCrmViewMode] = useState('dashboard'); // 'dashboard' | 'kanban'
            const historyPushedRef = useRef(false);
            const crmNoteRef = useRef(null);

            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.collection(window.db, "users"), (snap) => {
                    const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); }); setAllUsers(map);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.collection(window.db, "crm_profiles"), (snap) => {
                    const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); }); setAllCrmProfiles(map);
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.collection(window.db, "academy_pages"), (snap) => {
                    setAcademyPages(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(d => d.id !== '_announcement_banner'));
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                const fm = window.firebaseMethods;
                const q = fm.query(fm.collection(window.db, "crm_pages"), fm.where("ownerId", "==", user.uid));
                const unsub = fm.onSnapshot(q, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0));
                    setCustomPages(list);
                });
                return () => unsub();
            }, [user.uid]);

            useEffect(() => {
                if (!activeSelection) { setActiveData(null); return; }
                const fm = window.firebaseMethods;
                let unsub;
                if (activeSelection.type === 'profile') {
                    unsub = fm.onSnapshot(fm.doc(window.db, "crm_profiles", activeSelection.id), (doc) => {
                        if (doc.exists()) setActiveData(doc.data());
                        else setActiveData({ icon: '👤', status: 'Lead (Nuovo)', phone: '', campaign: '', followUpDate: '', revenue: 0, notes: '' });
                    });
                } else if (activeSelection.type === 'page') {
                    unsub = fm.onSnapshot(fm.doc(window.db, "crm_pages", activeSelection.id), (doc) => {
                        if (doc.exists()) setActiveData(doc.data());
                    });
                }
                return () => { if (unsub) unsub(); };
            }, [activeSelection]);

            const getAffiliateAcademyPct = (uid) => {
                if (!academyPages.length) return 0;
                const u = allUsers[uid];
                const completedIds = Array.isArray(u?.completedAcademyIds) ? u.completedAcademyIds : [];
                const doneCount = academyPages.filter(p => completedIds.includes(p.id) || (Array.isArray(p.completedBy) && p.completedBy.includes(uid))).length;
                return Math.min(100, Math.round((doneCount / academyPages.length) * 100));
            };

            const handleExportExcel = () => {
                const dataToExport = Object.values(allUsers)
                    .filter(u => u.uid && u.uid !== user.uid)
                    .map(u => {
                        const crm = allCrmProfiles[u.uid] || {};
                        return {
                            "Nome Affiliato": u.name || 'Sconosciuto',
                            "Email": u.email || 'N/D',
                            "Stato CRM": crm.status || 'Lead (Nuovo)',
                            "Fatturato / Punti (€)": Number(crm.revenue || 0),
                            "% Academy Completata": getAffiliateAcademyPct(u.uid) + '%',
                            "Telefono": crm.phone || '',
                            "Campagna": crm.campaign || '',
                            "Data Ricontatto (Follow-up)": crm.followUpDate || '',
                            "Note Operative": crm.notes || '',
                            "Data Registrazione": u.updatedAt?.toDate ? u.updatedAt.toDate().toLocaleDateString() : 'N/D',
                            "UID": u.uid
                        };
                    });

                if (dataToExport.length === 0) { showToast("Nessun affiliato da esportare.", "error"); return; }
                const ws = XLSX.utils.json_to_sheet(dataToExport);
                ws['!cols'] = [{wch: 24}, {wch: 28}, {wch: 18}, {wch: 18}, {wch: 18}, {wch: 18}, {wch: 22}, {wch: 22}, {wch: 45}, {wch: 18}, {wch: 32}];
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "CRM_Affiliati");
                XLSX.writeFile(wb, `FFchatgram_CRM_${new Date().toISOString().split('T')[0]}.xlsx`);
                showToast("File Excel scaricato!");
            };

            const selectItem = (type, id) => {
                setActiveSelection({ type, id }); setViewChecklistMode(false);
                if (id && !historyPushedRef.current) { try { window.history.pushState({ crmOpen: true }, ''); historyPushedRef.current = true; } catch (e) {} }
            };
            const handleBackToList = () => { setActiveSelection(null); if (historyPushedRef.current) { historyPushedRef.current = false; try { window.history.back(); } catch (e) {} } };

            useEffect(() => {
                const handlePopState = () => { historyPushedRef.current = false; setActiveSelection(null); };
                window.addEventListener('popstate', handlePopState); return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const createNewPage = async () => {
                const fm = window.firebaseMethods;
                try {
                    const ref = await fm.addDoc(fm.collection(window.db, "crm_pages"), { ownerId: user.uid, title: "", icon: "📄", content: "", updatedAt: fm.serverTimestamp() });
                    selectItem('page', ref.id);
                } catch (e) { showToast("Errore", "error"); }
            };

            const deleteActivePage = async () => {
                if (!activeSelection || activeSelection.type !== 'page') return;
                const fm = window.firebaseMethods;
                if(window.confirm("Sei sicuro di voler eliminare questa pagina?")) {
                    await fm.deleteDoc(fm.doc(window.db, "crm_pages", activeSelection.id));
                    setActiveSelection(null); showToast("Pagina eliminata!");
                }
            };

            const updateField = (field, value) => {
                if (!activeSelection) return;
                const fm = window.firebaseMethods;
                const ref = fm.doc(window.db, activeSelection.type === 'profile' ? "crm_profiles" : "crm_pages", activeSelection.id);
                fm.setDoc(ref, { [field]: value, updatedAt: fm.serverTimestamp() }, { merge: true }).catch(() => {});
            };

            const updateAffiliateStatusQuick = async (uid, newStatus) => {
                const fm = window.firebaseMethods;
                try {
                    await fm.setDoc(fm.doc(window.db, "crm_profiles", uid), { status: newStatus, updatedAt: fm.serverTimestamp() }, { merge: true });
                    showToast(`Spostato in ${newStatus}`);
                } catch (e) {}
            };
            
            const currentNoteField = activeSelection?.type === 'page' ? 'content' : 'notes';
            const handleCrmFormat = (pref, suff) => applyFormatting(crmNoteRef, pref, suff, (val) => {
                updateField(currentNoteField, val);
                setActiveData({...activeData, [currentNoteField]: val});
            });

            const renderInteractiveChecklist = (text, fieldName) => {
                if (!text || !text.trim()) return <div className="text-gray-400 italic text-sm py-4">Nessuna nota presente. Passa a "Modifica Testo" per scrivere.</div>;
                const lines = text.split(String.fromCharCode(10));
                return lines.map((line, idx) => {
                    const match = line.match(/^(\[(x|X| )?\])\s*(.*)$/);
                    if (match) {
                        const isChecked = match[2] && match[2].toLowerCase() === 'x';
                        const restOfLine = match[3];
                        const toggleCheck = () => {
                            const newLines = [...lines]; newLines[idx] = (isChecked ? '[ ] ' : '[x] ') + restOfLine;
                            const newText = newLines.join(String.fromCharCode(10)); updateField(fieldName, newText);
                            if (activeData) setActiveData({ ...activeData, [fieldName]: newText });
                        };
                        return (
                            <div key={idx} onClick={toggleCheck} className="task-list-item cursor-pointer">
                                <input type="checkbox" checked={!!isChecked} readOnly className="task-checkbox" />
                                <span className={"text-base " + (isChecked ? "line-through text-gray-400 dark:text-gray-500" : "text-gray-800 dark:text-gray-200")}>{restOfLine || 'Task senza testo'}</span>
                            </div>
                        );
                    }
                    return <div key={idx} className="min-h-[1.6em] text-base text-gray-800 dark:text-gray-200 py-0.5">{formatText(line)}</div>;
                });
            };

            const affiliates = Object.values(allUsers).filter(u => u.uid && u.uid !== user.uid);
            const totalAffiliates = affiliates.length;
            const newThisWeek = affiliates.filter(a => {
                if(!a.updatedAt?.toDate) return false;
                return ((new Date() - a.updatedAt.toDate()) / (1000 * 60 * 60 * 24)) <= 7;
            }).length;

            const todayStr = new Date().toISOString().split('T')[0];
            const dueFollowUps = affiliates.filter(u => {
                const fDate = allCrmProfiles[u.uid]?.followUpDate; return fDate && fDate <= todayStr;
            });

            // Calcolo Totale Fatturato / Punti e Classifica Top 3 Affiliati
            const totalNetworkRevenue = affiliates.reduce((sum, u) => sum + Number(allCrmProfiles[u.uid]?.revenue || 0), 0);
            const top3Affiliates = [...affiliates]
                .map(u => ({ ...u, revenue: Number(allCrmProfiles[u.uid]?.revenue || 0) }))
                .filter(u => u.revenue > 0)
                .sort((a, b) => b.revenue - a.revenue)
                .slice(0, 3);

            const filteredAffiliates = affiliates.filter(u => (u.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || (u.email || '').toLowerCase().includes(searchTerm.toLowerCase()));
            const filteredPages = customPages.filter(p => (p.title || 'Senza Titolo').toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <>
                    <div className={"w-full md:w-[320px] lg:w-[350px] h-full bg-gray-50 dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col flex-shrink-0 " + (activeSelection ? "hidden md:flex" : "flex")}>
                        <div className="bg-[#008069] px-4 py-4 flex items-center justify-between text-white flex-shrink-0">
                            <div className="flex items-center gap-3">
                                <button onClick={onOpenLauncher} className="md:hidden w-9 h-9 rounded-full hover:bg-white/20 flex items-center justify-center transition cursor-pointer"><i className="fa-solid fa-grip text-lg"></i></button>
                                <div className="font-bold text-lg cursor-pointer" onClick={() => setActiveSelection(null)}>Workspace CRM</div>
                            </div>
                            <div className="flex items-center gap-1">
                                <button onClick={() => { setActiveSelection(null); setCrmViewMode(prev => prev === 'kanban' ? 'dashboard' : 'kanban'); }} title="Vista Kanban Pipeline" className={`w-9 h-9 rounded-full flex items-center justify-center transition cursor-pointer ${crmViewMode === 'kanban' && !activeSelection ? 'bg-white text-[#008069]' : 'hover:bg-white/20'}`}>
                                    <i className="fa-solid fa-table-columns text-sm"></i>
                                </button>
                                <button onClick={handleExportExcel} title="Esporta CRM Completo in Excel" className="w-9 h-9 rounded-full hover:bg-white/20 flex items-center justify-center transition cursor-pointer"><i className="fa-solid fa-file-excel text-lg"></i></button>
                            </div>
                        </div>
                        
                        <div className="p-3 flex-shrink-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
                            <div className="bg-gray-100 dark:bg-gray-900 rounded-xl flex items-center px-3.5 py-2 mb-2">
                                <i className="fa-solid fa-magnifying-glass text-gray-400"></i>
                                <input type="text" placeholder="Cerca pagina o affiliato..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-transparent border-none outline-none w-full text-sm ml-2.5 text-gray-700 dark:text-gray-200" />
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={createNewPage} className="flex-1 bg-gray-900 dark:bg-gray-700 hover:bg-black dark:hover:bg-gray-600 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1.5 transition cursor-pointer">
                                    <i className="fa-solid fa-plus"></i> Pagina Notion
                                </button>
                                <button onClick={() => { setActiveSelection(null); setCrmViewMode(prev => prev === 'kanban' ? 'dashboard' : 'kanban'); }} className="px-3 bg-[#008069]/10 text-[#008069] dark:text-[#00a884] text-xs font-bold py-2 rounded-lg cursor-pointer">
                                    {crmViewMode === 'kanban' ? '📊 KPI' : '📋 Kanban'}
                                </button>
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-3 space-y-4">
                            <div>
                                <div className="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2 px-1">📄 Le Mie Pagine Notion</div>
                                <div className="space-y-1">
                                    {filteredPages.map(p => (
                                        <div key={p.id} onClick={() => selectItem('page', p.id)} className={`p-2 rounded-lg flex items-center gap-3 cursor-pointer transition ${activeSelection?.id === p.id ? 'bg-[#008069]/10 dark:bg-[#008069]/30 text-[#008069] dark:text-[#00a884] font-bold' : 'hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 font-medium'}`}>
                                            <span className="text-lg">{p.icon || '📄'}</span><div className="text-sm truncate">{p.title || 'Senza Titolo'}</div>
                                        </div>
                                    ))}
                                    {filteredPages.length === 0 && <div className="text-xs text-gray-400 px-2 italic">Nessuna pagina creata.</div>}
                                </div>
                            </div>
                            <div>
                                <div className="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2 px-1">👥 Schede Affiliati ({filteredAffiliates.length})</div>
                                <div className="space-y-1">
                                    {filteredAffiliates.map(u => {
                                        const crm = allCrmProfiles[u.uid] || {}; const isDue = crm.followUpDate && crm.followUpDate <= todayStr;
                                        const acadPct = getAffiliateAcademyPct(u.uid);
                                        return (
                                            <div key={u.uid} onClick={() => selectItem('profile', u.uid)} className={`p-2 rounded-lg flex items-center gap-3 cursor-pointer transition ${activeSelection?.id === u.uid ? 'bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600' : 'hover:bg-gray-200 dark:hover:bg-gray-700'}`}>
                                                <Avatar name={u.name} photoURL={u.photoURL} size="w-8 h-8" />
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center justify-between"><span className="font-bold text-sm text-gray-900 dark:text-white truncate">{u.name}</span>{isDue && <span className="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold" title="Da ricontattare">🔔</span>}</div>
                                                    <div className="text-[10px] text-gray-500 dark:text-gray-400 truncate flex items-center gap-2">
                                                        <span>{crm.status ? `● ${crm.status}` : u.email}</span>
                                                        <span>🎓 {acadPct}%</span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className={"flex-1 h-full flex flex-col bg-white dark:bg-[#191919] overflow-y-auto " + (!activeSelection ? "hidden md:flex" : "flex w-full")}>
                        {activeSelection && activeData ? (
                            <div className="max-w-4xl w-full mx-auto pb-32 relative">
                                <div className="h-32 sm:h-48 w-full bg-gradient-to-r from-emerald-200 to-[#008069] dark:from-[#005c4b] dark:to-gray-900 relative flex-shrink-0 group">
                                    <button onClick={handleBackToList} className="md:hidden absolute top-4 left-4 w-10 h-10 bg-black/20 hover:bg-black/40 text-white rounded-full flex items-center justify-center backdrop-blur transition cursor-pointer"><i className="fa-solid fa-arrow-left"></i></button>
                                    {activeSelection.type === 'page' && <button onClick={deleteActivePage} className="absolute top-4 right-4 w-10 h-10 bg-black/20 hover:bg-red-500 text-white rounded-full flex items-center justify-center backdrop-blur transition cursor-pointer"><i className="fa-solid fa-trash"></i></button>}
                                </div>

                                <div className="px-6 sm:px-16 -mt-12 sm:-mt-16 relative z-10">
                                    <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
                                        <input type="text" value={activeData.icon || (activeSelection.type === 'profile' ? '👤' : '📄')} onChange={e => updateField('icon', e.target.value)} className="w-24 h-24 sm:w-28 sm:h-28 text-6xl sm:text-7xl bg-white dark:bg-[#191919] rounded-2xl flex items-center justify-center text-center outline-none p-0 border-none" />
                                        
                                        {/* PULSANTE APRI CHAT DIRETTO DALLA SCHEDA CRM */}
                                        {activeSelection.type === 'profile' && (
                                            <button
                                                type="button"
                                                onClick={() => onOpenDirectChat(activeSelection.id)}
                                                className="bg-[#008069] hover:opacity-95 text-white font-extrabold text-xs px-5 py-3 rounded-xl shadow-lg flex items-center gap-2 cursor-pointer transition"
                                            >
                                                <i className="fa-solid fa-comments text-sm"></i> 💬 Scrivigli ora in Chat
                                            </button>
                                        )}
                                    </div>
                                    
                                    {activeSelection.type === 'page' ? (
                                        <input type="text" placeholder="Senza Titolo" value={activeData.title || ''} onChange={e => updateField('title', e.target.value)} className="w-full text-4xl sm:text-5xl font-extrabold text-gray-900 dark:text-white mb-8 tracking-tight bg-transparent outline-none placeholder-gray-300 dark:placeholder-gray-700" />
                                    ) : (
                                        <div className="mb-8">
                                            <h1 className="text-4xl sm:text-5xl font-extrabold text-gray-900 dark:text-white tracking-tight">{allUsers[activeSelection.id]?.name}</h1>
                                            <div className="text-xs text-gray-400 mt-1">{allUsers[activeSelection.id]?.email}</div>
                                        </div>
                                    )}
                                    
                                    {activeSelection.type === 'profile' && (
                                        <div className="space-y-3 mb-10 border-b border-gray-200 dark:border-gray-800 pb-8">
                                            <div className="flex items-center gap-6"><div className="w-40 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-chart-pie w-4"></i> Stato CRM</div><select value={activeData.status || 'Lead (Nuovo)'} onChange={e => updateField('status', e.target.value)} className="flex-1 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded outline-none text-gray-900 dark:text-white font-medium cursor-pointer transition">{CRM_STATUSES.map(s => <option key={s} value={s} className="dark:bg-gray-800">{s}</option>)}</select></div>
                                            
                                            {/* CAMPO ECONOMICO / PERFORMANCE (FATTURATO O PUNTI) */}
                                            <div className="flex items-center gap-6">
                                                <div className="w-40 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-coins w-4 text-emerald-500"></i> Volume / Punti (€)</div>
                                                <input type="number" step="any" placeholder="0" value={activeData.revenue ?? ''} onChange={e => updateField('revenue', Number(e.target.value))} className="flex-1 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded outline-none text-gray-900 dark:text-white font-bold transition" />
                                            </div>

                                            {/* PROGRESSO ACADEMY DELL'AFFILIATO */}
                                            <div className="flex items-center gap-6">
