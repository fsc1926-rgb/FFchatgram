<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FFchatgram</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FFchatgram">
  <link rel="apple-touch-icon" href="icon-192.svg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    body { -webkit-tap-highlight-color: transparent; }
    .chat-bg { background-color: #92a9bd; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M54.627 0l1.43 1.43-23.86 23.86-1.43-1.43L54.627 0zm-5.73 0l1.43 1.43-29.59 29.59-1.43-1.43L48.897 0zm-5.73 0l1.43 1.43-35.32 35.32-1.43-1.43L43.167 0zm-5.73 0l1.43 1.43-41.05 41.05-1.43-1.43L37.437 0zm-5.73 0l1.43 1.43-46.78 46.78-1.43-1.43L31.707 0zm-5.73 0l1.43 1.43-52.51 52.51-1.43-1.43L25.977 0z' fill='%23000000' fill-opacity='0.08' fill-rule='evenodd'/%3E%3C/svg%3E"); }
  </style>
</head>
<body class="bg-white text-slate-800 font-sans h-[100dvh] w-full overflow-hidden flex flex-col">

  <div id="screen-join" class="h-full flex flex-col items-center justify-center p-6 bg-slate-50">
    <div class="max-w-md w-full bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 p-8 border border-slate-100">
      <div class="w-20 h-20 bg-gradient-to-tr from-blue-500 to-indigo-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/30 transform rotate-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="-rotate-3"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </div>
      <h1 class="text-3xl font-bold text-center text-slate-800 mb-2">FFchatgram</h1>
      <p class="text-slate-500 text-center mb-8 text-sm">Accesso alla rete privata affiliati.</p>
      
      <form id="join-form" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Codice Stanza</label>
          <input type="text" id="room-input" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono font-bold text-slate-700" placeholder="Es. VIP-1234" required />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Il tuo Nome</label>
          <input type="text" id="name-input" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all text-slate-800 font-medium" placeholder="Come vuoi essere chiamato?" required />
        </div>
        <button type="submit" class="w-full py-4 mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-md shadow-blue-600/20 transition-all active:scale-95 text-lg">
          Accedi alla Chat
        </button>
      </form>
    </div>
  </div>

  <div id="screen-chat" class="hidden h-full flex flex-col relative chat-bg w-full">
    <header class="z-20 bg-white/90 backdrop-blur-md px-4 py-3 flex items-center justify-between shadow-sm border-b border-slate-200/50 sticky top-0">
      <div class="flex items-center gap-3">
        <button id="leave-btn" class="p-2 -ml-2 text-slate-500 hover:bg-slate-100 rounded-full active:bg-slate-200 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div id="room-avatar" class="w-11 h-11 bg-gradient-to-br from-indigo-500 to-blue-500 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm"></div>
        <div class="flex flex-col">
          <h1 id="chat-header-title" class="font-bold text-slate-900 text-base leading-tight"></h1>
          <span class="text-[12px] text-blue-600 font-medium flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Online
          </span>
        </div>
      </div>
      <button id="invite-btn" class="p-2.5 text-blue-600 hover:bg-blue-50 rounded-full flex items-center gap-2 active:scale-95 transition-all">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>
      </button>
    </header>

    <main id="messages-container" class="flex-1 overflow-y-auto p-4 z-10 flex flex-col gap-3 pb-4"></main>

    <footer class="z-20 bg-transparent p-3 pb-safe">
      <form id="chat-form" class="flex items-end gap-2 max-w-4xl mx-auto">
        <div class="flex-1 bg-white rounded-[24px] shadow-sm flex items-center overflow-hidden border border-slate-200">
          <input type="text" id="message-input" class="flex-1 bg-transparent border-none text-slate-900 py-3.5 px-5 focus:outline-none w-full text-[15px]" placeholder="Scrivi un messaggio..." autocomplete="off" />
        </div>
        <button type="submit" class="w-12 h-12 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-md shadow-blue-600/20 active:scale-90 transition-all flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="ml-0.5"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
    </footer>
  </div>

  <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium transition-all duration-300 opacity-0 pointer-events-none z-50">
    Link copiato!
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
  "apiKey": "AIzaSyDR6F1nGbRhGdDQVXWETK0XlNxhU5AKxEU",
  "authDomain": "ffchatgram.firebaseapp.com",
  "projectId": "ffchatgram",
  "storageBucket": "ffchatgram.firebasestorage.app",
  "messagingSenderId": "6270167752",
  "appId": "1:6270167752:web:dbe57e9c6166f91fa953fd"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let unsubscribeMessages = null;
    let roomId = "";
    let displayName = "";

    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) document.getElementById('room-input').value = roomParam;

    signInAnonymously(auth).catch(err => console.error("Auth Error:", err));
    onAuthStateChanged(auth, (user) => { currentUser = user; });

    const screenJoin = document.getElementById('screen-join');
    const screenChat = document.getElementById('screen-chat');

    document.getElementById('join-form').addEventListener('submit', (e) => {
      e.preventDefault();
      roomId = document.getElementById('room-input').value.trim();
      displayName = document.getElementById('name-input').value.trim();
      
      if (roomId && displayName && currentUser) {
        const newUrl = `${window.location.pathname}?room=${roomId}`;
        window.history.pushState({ path: newUrl }, '', newUrl);
        
        document.getElementById('chat-header-title').innerText = roomId;
        document.getElementById('room-avatar').innerText = roomId.charAt(0).toUpperCase();
        
        screenJoin.classList.add('hidden');
        screenChat.classList.remove('hidden');
        ascoltaMessaggi();
      }
    });

    function ascoltaMessaggi() {
      if (!currentUser) return;
      if (unsubscribeMessages) unsubscribeMessages();
      
      const collectionName = `chat_room_${roomId}`;
      const messagesRef = collection(db, collectionName);
      
      unsubscribeMessages = onSnapshot(messagesRef, (snapshot) => {
        let messaggi = [];
        snapshot.forEach(doc => messaggi.push({ id: doc.id, ...doc.data() }));
        messaggi.sort((a, b) => a.timestamp - b.timestamp);
        renderizzaMessaggi(messaggi);
      });
    }

    function renderizzaMessaggi(messaggi) {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';

      if (messaggi.length === 0) {
        container.innerHTML = `<div class="flex items-center justify-center h-full"><div class="bg-black/30 backdrop-blur-sm text-white px-5 py-2.5 rounded-full text-sm shadow-sm font-medium">Inizia la conversazione!</div></div>`;
        return;
      }

      messaggi.forEach((msg, index) => {
        const isMe = msg.senderId === currentUser.uid;
        const showName = !isMe && (index === 0 || messaggi[index - 1].senderId !== msg.senderId);
        const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const div = document.createElement('div');
        div.className = `flex w-full ${isMe ? 'justify-end' : 'justify-start'}`;
        
        const bubbleColor = isMe ? 'bg-[#E3FFC8] text-slate-900' : 'bg-white text-slate-900';
        const radius = isMe ? 'rounded-2xl rounded-br-sm' : 'rounded-2xl rounded-bl-sm';
        
        const bubble = document.createElement('div');
        bubble.className = `relative max-w-[85%] sm:max-w-[75%] px-3.5 py-2 shadow-sm border border-black/5 flex flex-col ${bubbleColor} ${radius}`;
        
        let html = '';
        if (showName) html += `<span class="text-[13px] font-bold mb-0.5 text-indigo-500">${msg.senderName}</span>`;
        
        html += `
          <div class="flex items-end gap-3 flex-wrap">
            <span class="text-[15px] break-words leading-relaxed whitespace-pre-wrap">${msg.text}</span>
            <div class="flex items-center gap-1 self-end ml-auto pt-1 pb-0.5 -mr-1">
              <span class="text-[11px] font-medium ${isMe ? 'text-green-700/70' : 'text-slate-400'}">${time}</span>
              ${isMe ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-500"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>' : ''}
            </div>
          </div>`;
        
        bubble.innerHTML = html;
        div.appendChild(bubble);
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;
      
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;
      
      input.value = '';
      const collectionName = `chat_room_${roomId}`;
      const messagesRef = collection(db, collectionName);
      
      await addDoc(messagesRef, {
        text: text,
        senderId: currentUser.uid,
        senderName: displayName,
        timestamp: Date.now()
      });
    });

    document.getElementById('leave-btn').addEventListener('click', () => {
      if (unsubscribeMessages) unsubscribeMessages();
      screenChat.classList.add('hidden');
      screenJoin.classList.remove('hidden');
    });

    document.getElementById('invite-btn').addEventListener('click', () => {
      const url = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
      navigator.clipboard.writeText(url);
      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2000);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
