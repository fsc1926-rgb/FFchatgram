<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FFchatgram Workspace</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#008069">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FFchatgram">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1384/1384055.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1384/1384055.png">

    <script>
        window.deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); window.deferredPwaPrompt = e; window.dispatchEvent(new Event('pwa-prompt-ready')); });
        window.addEventListener('appinstalled', function() { window.deferredPwaPrompt = null; window.dispatchEvent(new Event('pwa-installed')); });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updatePassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDoc, getDocs, deleteDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyDR6F1nGbRhGdDQVXWETK0XlNxhU5AKxEU",
                authDomain: "ffchatgram.firebaseapp.com",
                projectId: "ffchatgram",
                storageBucket: "ffchatgram.firebasestorage.app",
                messagingSenderId: "6270167752",
                appId: "1:6270167752:web:dbe57e9c6166f91fa953fd"
            };
            const app = initializeApp(firebaseConfig);
            window.auth = getAuth(app);
            window.db = getFirestore(app);
            window.IMGBB_API_KEY = "c0f85456625fe8081a3039269bb5b40a".toLowerCase();
            window.firebaseMethods = { signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updatePassword, onAuthStateChanged, signOut, updateProfile, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDoc, getDocs, deleteDoc, updateDoc, arrayUnion };
            window.firebaseReady = true; window.dispatchEvent(new Event('firebase-ready'));
        } catch (err) {
            window.firebaseInitError = err.message || "Errore Firebase"; window.dispatchEvent(new Event('firebase-error'));
        }
    </script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body, #root { height: 100vh; height: 100dvh; width: 100%; margin: 0; padding: 0; overflow: hidden; position: fixed; inset: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        .bg-chat-pattern { background-color: #efeae2; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
        .dark .bg-chat-pattern { background-color: #0b141a; background-image: radial-gradient(#202c33 1px, transparent 1px); }
        .bubble-in { background: #ffffff; border-radius: 0px 12px 12px 12px; box-shadow: 0 1px 1.5px rgba(11,20,26,.13); }
        .bubble-out { background: #d9fdd3; border-radius: 12px 0px 12px 12px; box-shadow: 0 1px 1.5px rgba(11,20,26,.13); }
        .dark .bubble-in { background: #202c33; color: #e9edef; }
        .dark .bubble-out { background: #005c4b; color: #e9edef; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
        /* Notion Textarea */
        .notion-textarea { resize: none; overflow: hidden; min-height: 300px; line-height: 1.6; }
    </style>
</head>
<body class="bg-[#d1d7db] dark:bg-gray-900 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const ADMIN_EMAILS = ["pumafreccia@gmail.com"];
        function checkIsAdmin(user, userData) {
            const email = (user?.email || userData?.email || '').toLowerCase().trim();
            if (!email) return false; return ADMIN_EMAILS.map(e => e.toLowerCase().trim()).includes(email);
        }

        const TAGS = [
            { id: 'urgente', icon: '🔴', label: 'Urgente' },
            { id: 'formazione', icon: '🟡', label: 'Formazione' },
            { id: 'assistenza', icon: '🔵', label: 'Assistenza' },
            { id: 'attivo', icon: '🟢', label: 'Attivo' }
        ];

        const CRM_STATUSES = ['Lead (Nuovo)', 'In Trattativa', 'Attivo', 'Inattivo', 'VIP'];

        const QUICK_REPLIES = [
            "Benvenuto su FFchatgram! Sono qui per aiutarti a iniziare al meglio. 👋",
            "Ecco il link per la nostra prossima sessione di formazione:",
            "Ottimo lavoro! Continua così, i risultati arriveranno presto. 🚀",
            "Hai bisogno di una mano con la configurazione del sistema?",
            "Per favore, controlla gli ultimi aggiornamenti nel portale."
        ];

        const pendingInviteStore = {
            key: 'ffchatgram_pending_invite', chatKey: 'ffchatgram_auto_open_chat', memInvite: null, memChat: null,
            getInvite() { try { return window.sessionStorage.getItem(this.key) || this.memInvite; } catch (e) { return this.memInvite; } },
            setInvite(val) { this.memInvite = val; try { window.sessionStorage.setItem(this.key, val); } catch (e) {} },
            clearInvite() { this.memInvite = null; try { window.sessionStorage.removeItem(this.key); } catch (e) {} },
            getAutoChat() { try { return window.sessionStorage.getItem(this.chatKey) || this.memChat; } catch (e) { return this.memChat; } },
            setAutoChat(val) { this.memChat = val; try { window.sessionStorage.setItem(this.chatKey, val); } catch (e) {} },
            clearAutoChat() { this.memChat = null; try { window.sessionStorage.removeItem(this.chatKey); } catch (e) {} }
        };

        try { const initParams = new URLSearchParams(window.location.search); const initInvite = initParams.get('invite'); if (initInvite && initInvite.trim()) pendingInviteStore.setInvite(initInvite.trim()); } catch (e) {}
        function getInviteUrl(uid) { let baseUrl = 'https://fsc1926-rgb.github.io/FFchatgram/'; try { if (window.location.hostname.includes('github.io')) baseUrl = window.location.origin + window.location.pathname.replace(/\/index\.html$/i, '').replace(/\/+$/, '') + '/'; } catch (e) {} return baseUrl + '?invite=' + encodeURIComponent(uid || ''); }

        function playNotificationSound() { try { const AudioCtx = window.AudioContext || window.webkitAudioContext; if (!AudioCtx) return; const ctx = new AudioCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.09); gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.22); } catch (e) {} }
        function copyTextSafe(text) { try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(() => fallbackCopy(text)); else fallbackCopy(text); } catch (e) { fallbackCopy(text); } }
        function fallbackCopy(text) { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); } catch (e) {} }
        
        async function uploadImageToImgBB(file) {
            const formData = new FormData(); formData.append('image', file);
            const apiKey = (window.IMGBB_API_KEY).toLowerCase().trim();
            const response = await fetch('https://api.imgbb.com/1/upload?key=' + apiKey, { method: 'POST', body: formData });
            const data = await response.json();
            if (data?.success) return data.data.display_url || data.data.url; throw new Error('Errore ImgBB');
        }

        function Avatar({ name, photoURL, isGroup, size = "w-11 h-11", textSize = "text-base" }) {
            const initial = name ? name.trim()[0].toUpperCase() : '?';
            if (photoURL) return <img src={photoURL} alt="Avatar" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/100x100/008069/ffffff?text=' + initial; }} className={size + " rounded-full object-cover flex-shrink-0 border border-black/10 dark:border-white/10 bg-emerald-700"} />;
            return <div className={size + " rounded-full flex items-center justify-center font-bold text-white flex-shrink-0 shadow-inner " + (isGroup ? "bg-teal-600" : "bg-[#008069]") + " " + textSize}>{isGroup ? <i className="fa-solid fa-users text-sm"></i> : initial}</div>;
        }

        function InstallGuideModal({ onClose, darkMode }) {
            const ua = typeof navigator !== 'undefined' ? navigator.userAgent.toLowerCase() : '';
            const isIOS = /iphone|ipad|ipod/.test(ua);
            const isInApp = /whatsapp|fbav|fban|instagram|telegram/.test(ua);
            return (
                <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold flex items-center gap-2"><i className="fa-solid fa-mobile-screen-button"></i> Installa App</h3><button onClick={onClose}><i className="fa-solid fa-xmark text-lg"></i></button></div>
                        <div className="p-5 space-y-4 text-sm text-gray-700 dark:text-gray-200">
                            {isInApp && <div className="bg-amber-50 dark:bg-amber-900/30 p-3.5 rounded-xl text-amber-900 dark:text-amber-200 text-xs"><b>Passo Preliminare:</b> Tocca i 3 puntini ⋮ e scegli "Apri nel browser".</div>}
                            {isIOS ? (
                                <div className="space-y-3"><div className="font-bold">iPhone / iPad (Safari):</div>
                                    <div className="flex gap-3 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl"><span className="w-6 h-6 rounded-full bg-[#008069] text-white flex items-center justify-center text-xs">1</span><div>Tocca il pulsante <b>Condividi</b> in basso.</div></div>
                                    <div className="flex gap-3 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl"><span className="w-6 h-6 rounded-full bg-[#008069] text-white flex items-center justify-center text-xs">2</span><div>Tocca <b>"Aggiungi a schermata Home"</b>.</div></div>
                                </div>
                            ) : (
                                <div className="space-y-3"><div className="font-bold">Android:</div>
                                    <div className="flex gap-3 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl"><span className="w-6 h-6 rounded-full bg-[#008069] text-white flex items-center justify-center text-xs">1</span><div>Tocca i <b>3 puntini ⋮</b> in alto a destra.</div></div>
                                    <div className="flex gap-3 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl"><span className="w-6 h-6 rounded-full bg-[#008069] text-white flex items-center justify-center text-xs">2</span><div>Seleziona <b>"Installa app"</b> o <b>"Aggiungi a schermata Home"</b>.</div></div>
                                </div>
                            )}
                            <button onClick={onClose} className="w-full bg-[#008069] text-white font-bold py-3 rounded-xl">Chiudi</button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [fbReady, setFbReady] = useState(!!window.firebaseReady);
            const [fbError, setFbError] = useState(window.firebaseInitError || '');
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [toast, setToast] = useState(null);

            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('ffchatgram_theme') === 'dark');
            const toggleDarkMode = () => { const newVal = !darkMode; setDarkMode(newVal); localStorage.setItem('ffchatgram_theme', newVal ? 'dark' : 'light'); };

            const [isStandalone, setIsStandalone] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(() => window.deferredPwaPrompt || null);
            const [showInstallGuide, setShowInstallGuide] = useState(false);

            const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3500); };

            useEffect(() => { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch (e) {} }, []);

            useEffect(() => {
                const checkStandalone = () => { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } };
                setIsStandalone(checkStandalone());
                const onPromptReady = () => setDeferredPrompt(window.deferredPwaPrompt);
                const onInstalled = () => { setDeferredPrompt(null); setIsStandalone(true); setShowInstallGuide(false); showToast("Installata con successo!"); };
                window.addEventListener('pwa-prompt-ready', onPromptReady); window.addEventListener('pwa-installed', onInstalled);
                return () => { window.removeEventListener('pwa-prompt-ready', onPromptReady); window.removeEventListener('pwa-installed', onInstalled); };
            }, []);

            const triggerInstall = async () => {
                if (isStandalone) return showToast("L'App è già installata!");
                const promptEvent = deferredPrompt || window.deferredPwaPrompt;
                if (promptEvent) { try { promptEvent.prompt(); const { outcome } = await promptEvent.userChoice; if (outcome === 'accepted') { window.deferredPwaPrompt = null; setDeferredPrompt(null); } return; } catch (err) {} }
                setShowInstallGuide(true);
            };

            useEffect(() => {
                if (fbReady) return;
                const onReady = () => setFbReady(true); const onError = () => setFbError(window.firebaseInitError || 'Errore Firebase');
                window.addEventListener('firebase-ready', onReady); window.addEventListener('firebase-error', onError);
                const timeout = setTimeout(() => { if (!window.firebaseReady) setFbError('Connessione bloccata. Verifica la rete.'); }, 8000);
                return () => { window.removeEventListener('firebase-ready', onReady); window.removeEventListener('firebase-error', onError); clearTimeout(timeout); };
            }, [fbReady]);

            const handleAutoInvite = async (myUid, myProfile, inviterUid) => {
                if (!myUid || !inviterUid || myUid === inviterUid) return;
                try {
                    const fm = window.firebaseMethods;
                    const inviterSnap = await fm.getDoc(fm.doc(window.db, "users", inviterUid));
                    const inviterData = inviterSnap.exists() ? inviterSnap.data() : { name: 'Amministratore' };
                    const q = fm.query(fm.collection(window.db, "chats"), fm.where("members", "array-contains", myUid));
                    const existingSnap = await fm.getDocs(q);
                    const existingDoc = existingSnap.docs.find(d => d.data().type === 'direct' && d.data().members && d.data().members.includes(inviterUid));
                    let targetChatId = null;
                    if (existingDoc) targetChatId = existingDoc.id;
                    else {
                        const newChatRef = await fm.addDoc(fm.collection(window.db, "chats"), {
                            type: 'direct', members: [myUid, inviterUid],
                            memberData: { [myUid]: { name: myProfile?.name, photoURL: myProfile?.photoURL }, [inviterUid]: { name: inviterData.name, photoURL: inviterData.photoURL } },
                            lastMessage: '👋 Chat avviata tramite link di invito!', updatedAt: fm.serverTimestamp()
                        });
                        targetChatId = newChatRef.id; showToast('Collegamento completato!');
                    }
                    pendingInviteStore.clearInvite();
                    if (targetChatId) { pendingInviteStore.setAutoChat(targetChatId); window.dispatchEvent(new CustomEvent('ffchatgram-open-chat', { detail: { chatId: targetChatId } })); }
                    try { window.history.replaceState({}, document.title, window.location.pathname); } catch (e) {}
                } catch (e) {}
            };

            useEffect(() => {
                if (!fbReady || !window.firebaseMethods) return;
                const fm = window.firebaseMethods;
                const unsub = fm.onAuthStateChanged(window.auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userRef = fm.doc(window.db, "users", currentUser.uid); const snap = await fm.getDoc(userRef);
                            let profileData;
                            if (snap.exists()) { profileData = snap.data(); if (!profileData.email && currentUser.email) profileData.email = currentUser.email.toLowerCase(); } 
                            else {
                                profileData = { uid: currentUser.uid, name: currentUser.displayName || currentUser.email.split('@')[0], email: (currentUser.email || '').toLowerCase(), photoURL: currentUser.photoURL || '', updatedAt: fm.serverTimestamp() };
                                await fm.setDoc(userRef, profileData, { merge: true });
                            }
                            setUserData(profileData);
                            let inviteUid = pendingInviteStore.getInvite(); try { const params = new URLSearchParams(window.location.search); if (params.get('invite')) inviteUid = params.get('invite').trim(); } catch (e) {}
                            if (inviteUid && inviteUid !== currentUser.uid) await handleAutoInvite(currentUser.uid, profileData, inviteUid);
                        } catch (e) {}
                    } else setUserData(null);
                    setAuthLoading(false);
                });
                return () => unsub();
            }, [fbReady]);

            if (fbError) return <div className="h-full w-full flex items-center justify-center p-6"><div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center"><h2>Errore Connessione</h2><p>{fbError}</p></div></div>;
            if (!fbReady || authLoading) return <div className="h-full w-full flex items-center justify-center"><div className="w-14 h-14 border-4 border-[#008069] border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className={`h-full w-full overflow-hidden relative select-text ${darkMode ? 'dark' : ''}`} style={{ height: '100dvh', position: 'fixed', inset: 0 }}>
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-semibold text-sm flex items-center gap-2.5" style={{ backgroundColor: toast.type === 'error' ? '#dc2626' : '#008069' }}>
                            <i className={toast.type === 'error' ? "fa-solid fa-circle-exclamation" : "fa-solid fa-check"}></i><span>{toast.msg}</span>
                        </div>
                    )}
                    {showInstallGuide && <InstallGuideModal onClose={() => setShowInstallGuide(false)} darkMode={darkMode} />}
                    {user ? (
                        <Workspace user={user} userData={userData} setUserData={setUserData} showToast={showToast} triggerInstall={triggerInstall} isStandalone={isStandalone} darkMode={darkMode} toggleDarkMode={toggleDarkMode} />
                    ) : (
                        <AuthScreen showToast={showToast} onAutoInvite={handleAutoInvite} triggerInstall={triggerInstall} isStandalone={isStandalone} />
                    )}
                </div>
            );
        }

        // --- AUTH ---
        function AuthScreen({ showToast, onAutoInvite, triggerInstall, isStandalone }) {
            const hasInvite = useMemo(() => { try { return !!(pendingInviteStore.getInvite() || new URLSearchParams(window.location.search).get('invite')); } catch (e) { return !!pendingInviteStore.getInvite(); } }, []);
            const [mode, setMode] = useState(hasInvite ? 'register' : 'login');
            const [name, setName] = useState(''); const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false); const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault(); setErrorMsg(''); setBusy(true); const fm = window.firebaseMethods;
                try {
                    if (mode === 'login') await fm.signInWithEmailAndPassword(window.auth, email.trim(), password);
                    else if (mode === 'register') {
                        if (!name.trim()) { setErrorMsg("Inserisci il Nome."); setBusy(false); return; }
                        const cred = await fm.createUserWithEmailAndPassword(window.auth, email.trim(), password);
                        const newProfile = { uid: cred.user.uid, name: name.trim(), email: email.trim().toLowerCase(), photoURL: '', updatedAt: fm.serverTimestamp() };
                        await fm.updateProfile(cred.user, { displayName: name.trim() }); await fm.setDoc(fm.doc(window.db, "users", cred.user.uid), newProfile, { merge: true });
                        const inviteUid = pendingInviteStore.getInvite(); if (inviteUid && inviteUid !== cred.user.uid && onAutoInvite) await onAutoInvite(cred.user.uid, newProfile, inviteUid);
                        showToast("Benvenuto!");
                    } else if (mode === 'reset') {
                        if (!email.trim()) { setErrorMsg("Inserisci l'email."); setBusy(false); return; }
                        await fm.sendPasswordResetEmail(window.auth, email.trim()); showToast("Email inviata!"); setMode('login');
                    }
                } catch (err) { setErrorMsg("Errore: " + (err.message)); }
                setBusy(false);
            };

            return (
                <div className="h-full w-full overflow-y-auto bg-gradient-to-b from-[#00a884] to-[#eae6df] dark:from-[#005c4b] dark:to-gray-900 flex flex-col items-center justify-center p-4">
                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                        <div className="bg-[#008069] dark:bg-[#005c4b] p-6 text-center text-white">
                            <h1 className="text-2xl font-extrabold tracking-tight"><i className="fa-solid fa-comments"></i> FFchatgram</h1>
                            {hasInvite && <div className="mt-3 bg-white/20 text-xs py-1.5 px-3 rounded-full inline-block font-semibold">Invito rilevato: accedi o registrati!</div>}
                        </div>
                        <div className="p-6">
                            <div className="flex rounded-xl bg-gray-100 dark:bg-gray-700 p-1 mb-5">
                                <button onClick={() => {setMode('login'); setErrorMsg('');}} className={`flex-1 py-2 text-xs font-bold rounded-lg ${mode==='login'?'bg-white dark:bg-gray-600 text-[#008069] dark:text-white shadow':'text-gray-500 dark:text-gray-300'}`}>Accedi</button>
                                <button onClick={() => {setMode('register'); setErrorMsg('');}} className={`flex-1 py-2 text-xs font-bold rounded-lg ${mode==='register'?'bg-white dark:bg-gray-600 text-[#008069] dark:text-white shadow':'text-gray-500 dark:text-gray-300'}`}>Nuovo Affiliato</button>
                            </div>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                {mode === 'register' && <input type="text" required placeholder="Tuo Nome (visibile in chat)" value={name} onChange={e=>setName(e.target.value)} className="w-full px-3.5 py-2.5 bg-white dark:bg-gray-700 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#008069]" />}
                                <input type="email" required placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} className="w-full px-3.5 py-2.5 bg-white dark:bg-gray-700 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#008069]" />
                                {mode !== 'reset' && <input type="password" required placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full px-3.5 py-2.5 bg-white dark:bg-gray-700 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#008069]" />}

                                <button type="submit" disabled={busy} className="w-full bg-[#008069] text-white font-bold py-3 rounded-xl">{busy ? 'Attendere...' : (mode === 'login' ? 'Entra' : mode === 'register' ? 'Crea Account' : 'Invia Reset')}</button>
                            </form>
                        </div>
                    </div>
                    {!isStandalone && <button onClick={triggerInstall} className="mt-4 text-white font-bold text-xs py-3 px-6 bg-black/20 hover:bg-black/30 rounded-xl backdrop-blur-md transition flex items-center gap-2 border border-white/20"><i className="fa-solid fa-download"></i> Installa App sul Telefono</button>}
                </div>
            );
        }

        // --- WORKSPACE (LAUNCHER CHAT O CRM) ---
        function Workspace({ user, userData, setUserData, showToast, triggerInstall, isStandalone, darkMode, toggleDarkMode }) {
            const isAdmin = useMemo(() => checkIsAdmin(user, userData), [user, userData]);
            const [appMode, setAppMode] = useState('chat'); // 'chat' o 'crm'
            const [isLauncherOpen, setIsLauncherOpen] = useState(false);

            useEffect(() => { if (!isAdmin && appMode !== 'chat') setAppMode('chat'); }, [isAdmin, appMode]);

            return (
                <div className="h-full w-full relative overflow-hidden flex bg-[#f0f2f5] dark:bg-gray-900">
                    {isLauncherOpen && isAdmin && (
                        <div className="absolute inset-0 z-50 flex">
                            <div className="w-64 bg-white dark:bg-gray-800 shadow-2xl flex flex-col h-full z-50 animate-fade-in">
                                <div className="bg-[#008069] p-4 text-white font-bold flex justify-between items-center">
                                    <span>Workspace</span><button onClick={() => setIsLauncherOpen(false)}><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="p-2 space-y-1">
                                    <button onClick={() => { setAppMode('chat'); setIsLauncherOpen(false); }} className={`w-full flex items-center gap-3 p-3 rounded-xl transition font-bold text-sm ${appMode==='chat' ? 'bg-[#008069]/10 text-[#008069] dark:text-[#00a884]' : 'text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700'}`}>
                                        <i className="fa-solid fa-comments text-lg w-6"></i> Chat Messaggi
                                    </button>
                                    <button onClick={() => { setAppMode('crm'); setIsLauncherOpen(false); }} className={`w-full flex items-center gap-3 p-3 rounded-xl transition font-bold text-sm ${appMode==='crm' ? 'bg-[#008069]/10 text-[#008069] dark:text-[#00a884]' : 'text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700'}`}>
                                        <i className="fa-solid fa-layer-group text-lg w-6"></i> CRM & Pagine Libere
                                    </button>
                                </div>
                            </div>
                            <div className="flex-1 bg-black/40 backdrop-blur-sm" onClick={() => setIsLauncherOpen(false)}></div>
                        </div>
                    )}
                    {appMode === 'chat' ? (
                        <Dashboard user={user} userData={userData} setUserData={setUserData} showToast={showToast} triggerInstall={triggerInstall} isStandalone={isStandalone} darkMode={darkMode} toggleDarkMode={toggleDarkMode} isAdmin={isAdmin} onOpenLauncher={() => setIsLauncherOpen(true)} />
                    ) : (
                        <CRMModule user={user} isAdmin={isAdmin} showToast={showToast} onOpenLauncher={() => setIsLauncherOpen(true)} />
                    )}
                </div>
            );
        }

        // --- CHAT DASHBOARD ---
        function Dashboard({ user, userData, setUserData, showToast, triggerInstall, isStandalone, darkMode, toggleDarkMode, isAdmin, onOpenLauncher }) {
            const [chats, setChats] = useState([]); const [allUsers, setAllUsers] = useState({});
            const [activeChatId, setActiveChatId] = useState(null); const [searchTerm, setSearchTerm] = useState('');
            const [modal, setModal] = useState(null); const [lightboxUrl, setLightboxUrl] = useState(null);

            const [editName, setEditName] = useState(userData?.name || ''); const [newPass, setNewPass] = useState(''); const [uploadingAvatar, setUploadingAvatar] = useState(false);
            const avatarInputRef = useRef(); const historyPushedRef = useRef(false);
            const [contactEmailSearch, setContactEmailSearch] = useState(''); const [groupName, setGroupName] = useState(''); const [selectedMembers, setSelectedMembers] = useState([]);
            const [broadcastMsg, setBroadcastMsg] = useState(''); const [activeTagFilter, setActiveTagFilter] = useState('Tutte');

            const myInviteUrl = useMemo(() => getInviteUrl(user.uid), [user.uid]);
            useEffect(() => { if (userData?.name) setEditName(userData.name); }, [userData]);

            const selectChat = (chatId) => { setActiveChatId(chatId); if (chatId && !historyPushedRef.current) { try { window.history.pushState({ chatOpen: true }, ''); historyPushedRef.current = true; } catch (e) {} } };
            const handleBackToChatList = () => { setActiveChatId(null); if (historyPushedRef.current) { historyPushedRef.current = false; try { window.history.back(); } catch (e) {} } };

            useEffect(() => {
                const pendingChat = pendingInviteStore.getAutoChat(); if (pendingChat) { selectChat(pendingChat); pendingInviteStore.clearAutoChat(); }
                const onOpenChat = (e) => { if (e.detail?.chatId) { selectChat(e.detail.chatId); pendingInviteStore.clearAutoChat(); } };
                window.addEventListener('ffchatgram-open-chat', onOpenChat); return () => window.removeEventListener('ffchatgram-open-chat', onOpenChat);
            }, []);

            useEffect(() => {
                const handlePopState = () => { historyPushedRef.current = false; if (lightboxUrl) setLightboxUrl(null); else if (modal) setModal(null); else setActiveChatId(null); };
                window.addEventListener('popstate', handlePopState); return () => window.removeEventListener('popstate', handlePopState);
            }, [lightboxUrl, modal]);

            useEffect(() => { const fm = window.firebaseMethods; const unsub = fm.onSnapshot(fm.collection(window.db, "users"), (snap) => { const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); }); setAllUsers(map); }); return () => unsub(); }, []);
            useEffect(() => { const fm = window.firebaseMethods; const q = fm.query(fm.collection(window.db, "chats"), fm.where("members", "array-contains", user.uid)); const unsub = fm.onSnapshot(q, (snap) => { const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0)); setChats(list); }); return () => unsub(); }, [user.uid]);

            const getChatInfo = (chat) => {
                if (!chat) return { name: 'Chat', photoURL: '', isGroup: false }; if (chat.type === 'group') return { name: chat.name, photoURL: chat.photoURL, isGroup: true };
                const otherUid = (chat.members || []).find(uid => uid !== user.uid); const liveOther = otherUid ? allUsers[otherUid] : null; const cachedOther = (otherUid && chat.memberData?.[otherUid]) ? chat.memberData[otherUid] : null;
                return { name: liveOther?.name || cachedOther?.name || 'Affiliato', photoURL: liveOther?.photoURL || cachedOther?.photoURL || '', isGroup: false, otherUid };
            };

            const isSomeoneTyping = (chat) => { if (!chat || !chat.typing) return false; const now = Date.now(); return Object.entries(chat.typing).some(([uid, ts]) => uid !== user.uid && typeof ts === 'number' && (now - ts) < 5000); };
            const handleCopyInvite = () => { if (!isAdmin) return; copyTextSafe(myInviteUrl); setModal('inviteModal'); showToast("Link d'invito copiato!"); };

            const startDirectChatWithUser = async (targetUser) => {
                if (!targetUser || targetUser.uid === user.uid) return; const fm = window.firebaseMethods;
                const existing = chats.find(c => c.type === 'direct' && c.members.includes(targetUser.uid)); if (existing) { selectChat(existing.id); setModal(null); return; }
                const newChatRef = await fm.addDoc(fm.collection(window.db, "chats"), { type: 'direct', members: [user.uid, targetUser.uid], memberData: { [user.uid]: { name: userData?.name }, [targetUser.uid]: { name: targetUser.name } }, lastMessage: 'Nuova conversazione', updatedAt: fm.serverTimestamp() }); selectChat(newChatRef.id); setModal(null);
            };

            const handleCreateGroup = async (e) => {
                e.preventDefault(); if (!groupName.trim()) return showToast("Inserisci il nome", "error"); const fm = window.firebaseMethods; const members = Array.from(new Set([user.uid, ...selectedMembers])); const memberData = {}; members.forEach(uid => { memberData[uid] = { name: allUsers[uid]?.name || 'Affiliato', photoURL: allUsers[uid]?.photoURL || '' }; });
                const ref = await fm.addDoc(fm.collection(window.db, "chats"), { type: 'group', name: groupName.trim(), members, memberData, lastMessage: '👥 Gruppo creato', updatedAt: fm.serverTimestamp() }); setGroupName(''); setSelectedMembers([]); setModal(null); selectChat(ref.id); showToast("Gruppo creato!");
            };

            const handleAddMembersToGroup = async () => {
                const activeChat = chats.find(c => c.id === activeChatId); if (!activeChat || selectedMembers.length === 0) return; const fm = window.firebaseMethods; const updatedMembers = Array.from(new Set([...(activeChat.members || []), ...selectedMembers]));
                await fm.updateDoc(fm.doc(window.db, "chats", activeChat.id), { members: updatedMembers, updatedAt: fm.serverTimestamp() }); setSelectedMembers([]); setModal(null); showToast("Aggiunti al gruppo!");
            };
            
            const handleSendBroadcast = async (e) => {
                e.preventDefault(); if (!broadcastMsg.trim()) return; const fm = window.firebaseMethods; const directChats = chats.filter(c => c.type === 'direct'); if(directChats.length === 0) return showToast("Nessuna chat", "error");

            };

            const handleSaveProfile = async (e) => { e.preventDefault(); if (!editName.trim()) return; const fm = window.firebaseMethods; try { await fm.updateProfile(window.auth.currentUser, { displayName: editName.trim() }); await fm.setDoc(fm.doc(window.db, "users", user.uid), { name: editName.trim(), updatedAt: fm.serverTimestamp() }, { merge: true }); setUserData(prev => ({ ...prev, name: editName.trim() })); showToast("Profilo aggiornato!"); } catch (err) { showToast("Errore salvataggio", "error"); } };
            const handleAvatarChange = async (e) => { const file = e.target.files?.[0]; if (!file) return; setUploadingAvatar(true); const fm = window.firebaseMethods; try { const url = await uploadImageToImgBB(file); await fm.updateProfile(window.auth.currentUser, { photoURL: url }); await fm.setDoc(fm.doc(window.db, "users", user.uid), { photoURL: url, updatedAt: fm.serverTimestamp() }, { merge: true }); setUserData(prev => ({ ...prev, photoURL: url })); showToast("Foto aggiornata!"); } catch (err) { showToast("Errore foto", "error"); } setUploadingAvatar(false); e.target.value = null; };
            const handleChangePassword = async (e) => { e.preventDefault(); if (newPass.length < 6) return showToast("Minimo 6 caratteri", "error"); try { await window.firebaseMethods.updatePassword(window.auth.currentUser, newPass); setNewPass(''); showToast("Password modificata!"); } catch (err) { showToast("Per sicurezza esci e rientra per cambiare pass", "error"); } };

            const activeChat = chats.find(c => c.id === activeChatId) || null; const otherAffiliates = Object.values(allUsers).filter(u => u.uid && u.uid !== user.uid);
            const filteredChats = chats.filter(c => { const matchSearch = getChatInfo(c).name.toLowerCase().includes(searchTerm.toLowerCase()); const matchTag = activeTagFilter === 'Tutte' || (c.tags?.[user.uid] === activeTagFilter); return matchSearch && matchTag; });

            return (
                <>
                    <div className={"w-full md:w-[390px] lg:w-[420px] h-full bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col flex-shrink-0 " + (activeChat ? "hidden md:flex" : "flex")}>
                        <div className="bg-[#f0f2f5] dark:bg-gray-900 px-3 py-3 flex justify-between items-center border-b border-gray-200 dark:border-gray-700 flex-shrink-0">
                            <div className="flex items-center gap-2 cursor-pointer">
                                {isAdmin && <button onClick={onOpenLauncher} className="w-9 h-9 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center text-gray-600 dark:text-gray-300 mr-1 transition"><i className="fa-solid fa-grip text-lg"></i></button>}
                                <div onClick={() => setModal('settings')} className="flex items-center gap-2"><Avatar name={userData?.name} photoURL={userData?.photoURL} /><div className="hidden sm:block"><div className="font-bold text-gray-800 dark:text-gray-100 text-sm truncate max-w-[100px]">{userData?.name || "Profilo"}</div></div></div>
                            </div>
                            <div className="flex gap-1 text-gray-600 dark:text-gray-300">
                                {!isStandalone && <button onClick={triggerInstall} className="w-8 h-8 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i className="fa-solid fa-download"></i></button>}
                                {isAdmin && <button onClick={handleCopyInvite} className="w-8 h-8 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i className="fa-solid fa-link"></i></button>}
                                <button onClick={() => { setContactEmailSearch(''); setModal('newChat'); }} className="w-8 h-8 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i className="fa-solid fa-user-plus"></i></button>
                                <button onClick={() => setModal('settings')} className="w-8 h-8 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center"><i className="fa-solid fa-gear"></i></button>
                            </div>
                        </div>
                        <div className="px-3 py-2 bg-emerald-50/70 dark:bg-[#008069]/20 border-b border-emerald-100 dark:border-[#008069]/30 flex gap-2 flex-shrink-0">
                            {isAdmin && <button onClick={() => { setBroadcastMsg(''); setModal('broadcastModal'); }} className="flex-1 bg-[#008069] text-white text-xs font-bold py-2 rounded-lg shadow-sm"><i className="fa-solid fa-bullhorn"></i> Broadcast</button>}
                            <button onClick={() => setModal('newChat')} className={`bg-white dark:bg-gray-700 text-[#008069] dark:text-[#00a884] border border-[#008069]/30 text-xs font-bold py-2 px-3 rounded-lg ${isAdmin ? 'flex-1' : 'w-full'}`}><i className="fa-solid fa-address-book"></i> Rubrica</button>
                        </div>
                        <div className="p-2.5 border-b border-gray-100 dark:border-gray-700 flex-shrink-0"><div className="bg-[#f0f2f5] dark:bg-gray-900 rounded-xl flex items-center px-3.5 py-2"><i className="fa-solid fa-magnifying-glass text-gray-400"></i><input type="text" placeholder="Cerca una chat..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-transparent border-none outline-none w-full text-sm ml-2.5 text-gray-700 dark:text-gray-200" /></div></div>
                        {isAdmin && (
                            <div className="px-3 py-2 border-b border-gray-100 dark:border-gray-700 flex gap-2 overflow-x-auto flex-shrink-0 no-scrollbar">
                                <button onClick={() => setActiveTagFilter('Tutte')} className={`px-3 py-1 text-xs font-bold rounded-full whitespace-nowrap border ${activeTagFilter==='Tutte' ? 'bg-[#008069] text-white border-[#008069]' : 'bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600'}`}>Tutte</button>
                                {TAGS.map(t => (
                                    <button key={t.id} onClick={() => setActiveTagFilter(t.id)} className={`px-3 py-1 text-xs font-bold rounded-full whitespace-nowrap border ${activeTagFilter===t.id ? 'bg-[#008069] text-white border-[#008069]' : 'bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600'}`}>{t.icon} {t.label}</button>
                                ))}
                            </div>
                        )}
                        <div className="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700">
                            {filteredChats.map(chat => {
                                const info = getChatInfo(chat); const typing = isSomeoneTyping(chat); const isSelected = chat.id === activeChatId;
                                const timeStr = chat.updatedAt?.toDate ? chat.updatedAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                                const tagId = chat.tags?.[user.uid]; const tagObj = TAGS.find(t => t.id === tagId);
                                return (
                                    <div key={chat.id} onClick={() => selectChat(chat.id)} className={`px-4 py-3 flex gap-3.5 cursor-pointer ${isSelected ? 'bg-[#f0f2f5] dark:bg-gray-700' : 'hover:bg-gray-50 dark:hover:bg-gray-750'}`}>
                                        <div className="relative"><Avatar name={info.name} photoURL={info.photoURL} isGroup={info.isGroup} size="w-12 h-12" />{tagObj && <div className="absolute -bottom-1 -right-1 text-xs bg-white dark:bg-gray-800 rounded-full w-5 h-5 flex items-center justify-center shadow">{tagObj.icon}</div>}</div>
