<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FFchatgram</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075e54">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Script per bloccare il popup nativo "Scarica App" su Android/Chrome -->
    <script>
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
        });
    </script>

    <!-- Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- React & Babel 7 (FIX: aggiornato da Babel 6 a Babel 7 per supporto Fragment <>) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html { height: 100%; }
        body { background-color: #d1d7db; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #root { width: 100%; height: 100%; max-width: 1200px; background: white; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        .app-layout { display: flex; height: 100%; position: relative; overflow: hidden; }
        .sidebar { width: 35%; background: #ffffff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; z-index: 10; transition: transform 0.3s ease; }
        .chat-area { width: 65%; background: #efeae2; display: flex; flex-direction: column; z-index: 20; transition: transform 0.3s ease; }
        
        .header { background: #075e54; color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .mobile-back-btn { display: none; background: transparent; border: none; color: white; font-size: 22px; cursor: pointer; padding-right: 15px; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; height: 100%; }
            .sidebar.hidden-mobile { transform: translateX(-100%); }
            .chat-area { width: 100%; position: absolute; height: 100%; transform: translateX(100%); }
            .chat-area.show-mobile { transform: translateX(0); }
            .mobile-back-btn { display: inline-block; }
        }

        .contact-list { overflow-y: auto; flex: 1; }
        .contact-item { padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; }
        .contact-item:hover { background: #f5f6f6; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #25D366; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; margin-right: 15px; overflow: hidden; flex-shrink: 0; }
        
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 10px; margin-bottom: 10px; position: relative; word-wrap: break-word; }
        .message.sent { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 0; }
        .message.received { align-self: flex-start; background: #ffffff; border-bottom-left-radius: 0; }
        
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        .message-time { font-size: 11px; color: #888; text-align: right; display: block; margin-top: 4px; }
        .blue-tick { color: #34B7F1; margin-left: 5px; }
        .grey-tick { color: #999; margin-left: 5px; }
        
        .input-area { padding: 15px; background: #f0f0f0; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .input-area input[type="text"] { flex: 1; padding: 12px 20px; border-radius: 25px; border: none; outline: none; font-size: 15px; }
        .icon-btn { background: none; border: none; color: #54656f; font-size: 22px; cursor: pointer; transition: 0.2s; padding: 5px; }
        .icon-btn:hover { color: #075e54; }
        
        .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; background: #075e54; color: white; padding: 20px; text-align: center; }
        .login-box { background: white; color: #333; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .login-box button { width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .error-msg { color: #d32f2f; background: #fde0dc; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; word-wrap: break-word; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = { 
  apiKey: "AIzaSyDR6F1nGbRhGdDQVXWETK0XlNxhU5AKxEU",
  authDomain: "ffchatgram.firebaseapp.com",
  projectId: "ffchatgram",
  storageBucket: "ffchatgram.firebasestorage.app",
  messagingSenderId: "6270167752",
  appId: "1:6270167752:web:dbe57e9c6166f91fa953fd" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
                return unsubscribe;
            }, []);

            if (loading) return <div style={{display:'flex', height:'100vh', justifyContent:'center', alignItems:'center'}}><h3>Caricamento...</h3></div>;
            return user ? <ChatDashboard user={user} /> : <LoginScreen />;
        }

        function LoginScreen() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [isRegister, setIsRegister] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    if (isRegister) {
                        await auth.createUserWithEmailAndPassword(email, password);
                        await db.collection('users').doc(auth.currentUser.uid).set({
                            email: email,
                            status: 'Online',
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    } else {
                        await auth.signInWithEmailAndPassword(email, password);
                        // FIX: Crea/aggiorna il documento utente anche al login
                        await db.collection('users').doc(auth.currentUser.uid).set({
                            email: email,
                            status: 'Online',
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });
                    }
                } catch (err) {
                    setError("Errore: " + err.message);
                }
            };

            const resetPassword = async () => {
                if(!email) return setError("Inserisci prima la tua email nel campo in alto.");
                try {
                    await auth.sendPasswordResetEmail(email);
                    alert("Email di reset inviata! Controlla la casella di posta.");
                } catch(err) {
                    setError("Errore Reset: " + err.message);
                }
            };

            return (
                <div className="login-screen">
                    <div className="login-box">
                        <h2><i className="fas fa-comments"></i> FFchatgram</h2>
                        <p style={{marginBottom: '20px', color: '#666', fontSize:'14px'}}>
                            {isRegister ? 'Registra il tuo account gratuito' : 'Accedi al tuo account'}
                        </p>
                        
                        {error && <div className="error-msg"><i className="fas fa-exclamation-circle"></i> {error}</div>}
                        
                        <form onSubmit={handleAuth}>
                            <input type="email" placeholder="La tua Email" value={email} onChange={e => setEmail(e.target.value)} required />
                            <input type="password" placeholder="Password (min. 6 caratteri)" value={password} onChange={e => setPassword(e.target.value)} required />
                            <button type="submit">{isRegister ? 'Registrati ed Entra' : 'Accedi'}</button>
                        </form>
                        
                        <div style={{marginTop: '15px', fontSize: '14px'}}>
                            <a href="#" onClick={(e) => {e.preventDefault(); setIsRegister(!isRegister);}} style={{color: '#075e54', textDecoration:'none', display:'block', marginBottom:'10px', fontWeight:'bold'}}>
                                {isRegister ? 'Hai già un account? Accedi da qui' : 'Sei nuovo? Clicca qui per registrarti'}
                            </a>
                            {!isRegister && (
                                <a href="#" onClick={(e) => {e.preventDefault(); resetPassword();}} style={{color: '#888', textDecoration:'underline'}}>Password dimenticata?</a>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ChatDashboard({ user }) {
            const [contacts, setContacts] = useState([]);
            const [selectedChat, setSelectedChat] = useState(null);
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const messagesEndRef = useRef(null);

            useEffect(() => {
                const unsubscribe = db.collection('users').onSnapshot(snapshot => {
                    const usersList = [];
                    snapshot.forEach(doc => {
                        if (doc.id !== user.uid) {
                            usersList.push({ id: doc.id, ...doc.data() });
                        }
                    });
                    setContacts(usersList);
                });
                return unsubscribe;
            }, [user.uid]);

            useEffect(() => {
                if (!selectedChat) return;
                const chatId = user.uid < selectedChat.id ? user.uid + '_' + selectedChat.id : selectedChat.id + '_' + user.uid;
                
                // FIX: Flag per evitare il doppio trigger delle read-receipt
                let isUpdatingRead = false;

                const unsubscribe = db.collection('chats').doc(chatId).collection('messages')
                    .orderBy('timestamp', 'asc')
                    .onSnapshot(snapshot => {
                        const msgs = [];
                        snapshot.forEach(doc => msgs.push({ id: doc.id, ...doc.data() }));
                        setMessages(msgs);
                        setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
                        
                        // FIX: Usa batch write e flag per ottimizzare
                        if (!isUpdatingRead) {
                            const unreadMsgs = msgs.filter(msg => msg.sender !== user.uid && !msg.read);
                            if (unreadMsgs.length > 0) {
                                isUpdatingRead = true;
                                const batch = db.batch();
                                unreadMsgs.forEach(msg => {
                                    const msgRef = db.collection('chats').doc(chatId).collection('messages').doc(msg.id);
                                    batch.update(msgRef, { read: true });
                                });
                                batch.commit().then(() => {
                                    isUpdatingRead = false;
                                }).catch(() => {
                                    isUpdatingRead = false;
                                });
                            }
                        }
                    });
                return unsubscribe;
            }, [selectedChat, user.uid]);

            const sendMessage = async (e, imageUrl = null) => {
                if (e) e.preventDefault();
                if (!newMessage.trim() && !imageUrl) return;

                const chatId = user.uid < selectedChat.id ? user.uid + '_' + selectedChat.id : selectedChat.id + '_' + user.uid;
                
                try {
                    await db.collection('chats').doc(chatId).collection('messages').add({
                        text: newMessage.trim(),
                        imageUrl: imageUrl || null,
                        sender: user.uid,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        read: false
                    });
                    setNewMessage('');
                } catch (error) {
                    alert("Errore nell'invio del messaggio: " + error.message);
                }
            };

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const formData = new FormData();
                formData.append('image', file);

                try {
                    const res = await fetch('https://api.imgbb.com/1/upload?key=c0f85456625fe8081a3039269bb5b40a', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if(data.success) {
                        await sendMessage(null, data.data.url);
                    } else {
                        alert("Errore caricamento immagine.");
                    }
                } catch (error) {
                    alert("Errore di rete durante il caricamento.");
                }
            };

            // Messaggio di Invito Ottimizzato
            const copyInvite = () => {
                const cleanUrl = window.location.origin + window.location.pathname;
                const messaggio = "Ehi! Clicca su questo link per entrare nella chat privata:\n" + cleanUrl + "\n\n(Nota: Puoi usarla comodamente dal browser, non è obbligatorio scaricare o installare nulla!)";
                navigator.clipboard.writeText(messaggio).then(() => {
                    alert("Messaggio di invito copiato nei tuoi appunti! Incollalo su WhatsApp o via Email al tuo ospite.");
                }).catch(() => {
                    // Fallback per browser che non supportano clipboard API
                    const textarea = document.createElement('textarea');
                    textarea.value = messaggio;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert("Messaggio di invito copiato nei tuoi appunti!");
                });
            };

            return (
                <div className="app-layout">
                    {/* RUBRICA */}
                    <div className={`sidebar ${selectedChat ? 'hidden-mobile' : ''}`}>
                        <div className="header">
                            <div style={{display:'flex', alignItems:'center'}}>
                                <div className="avatar"><i className="fas fa-user"></i></div>
                                <div>
                                    <div style={{fontWeight:'bold'}}>Il tuo Profilo</div>
                                    <div style={{fontSize:'12px', color:'#dcf8c6'}}>● Online</div>
                                </div>
                            </div>
                            <div>
                                <button className="icon-btn" onClick={copyInvite} style={{color:'white'}} title="Invita un ospite"><i className="fas fa-link"></i></button>
                                <button className="icon-btn" onClick={() => auth.signOut()} style={{color:'white'}} title="Esci"><i className="fas fa-sign-out-alt"></i></button>
                            </div>
                        </div>
                        
                        <div className="contact-list">
                            {contacts.length === 0 ? (
                                <div style={{padding:'20px', textAlign:'center', color:'#888', fontSize:'14px'}}>
                                    Nessuno è ancora registrato.<br/><br/>Clicca l'icona della catenella 🔗 qui in alto per mandare il link di invito ai tuoi affiliati!
                                </div>
                            ) : (
                                contacts.map(c => (
                                    <div key={c.id} className="contact-item" onClick={() => setSelectedChat(c)}>
                                        <div className="avatar">{c.email.charAt(0).toUpperCase()}</div>
                                        <div>
                                            <div style={{fontWeight:'bold', color:'#333'}}>{c.email.split('@')[0]}</div>
                                            <div style={{fontSize:'13px', color:'#888'}}>Tocca per chattare</div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    {/* AREA CHAT */}
                    <div className={`chat-area ${selectedChat ? 'show-mobile' : ''}`}>
                        {selectedChat ? (
                            <React.Fragment>
                                <div className="header">
                                    <div style={{display:'flex', alignItems:'center'}}>
                                        <button className="mobile-back-btn" onClick={() => setSelectedChat(null)}>
                                            <i className="fas fa-arrow-left"></i>
                                        </button>
                                        <div className="avatar">{selectedChat.email.charAt(0).toUpperCase()}</div>
                                        <div style={{fontWeight:'bold'}}>{selectedChat.email.split('@')[0]}</div>
                                    </div>
                                </div>
                                
                                <div className="messages">
                                    {messages.map(msg => (
                                        <div key={msg.id} className={`message ${msg.sender === user.uid ? 'sent' : 'received'}`}>
                                            {msg.imageUrl && <a href={msg.imageUrl} target="_blank" rel="noopener noreferrer"><img src={msg.imageUrl} alt="Allegato" /></a>}
                                            {msg.text && <div>{msg.text}</div>}
                                            <span className="message-time">
                                                {msg.timestamp ? new Date(msg.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}
                                                {msg.sender === user.uid && (
                                                    <span className={msg.read ? "blue-tick" : "grey-tick"}><i className="fas fa-check-double"></i></span>
                                                )}
                                            </span>
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} />
                                </div>

                                <form className="input-area" onSubmit={(e) => sendMessage(e)}>
                                    <input type="file" id="fileInput" style={{display:'none'}} accept="image/*" onChange={handleImageUpload} />
                                    <button type="button" className="icon-btn" onClick={() => document.getElementById('fileInput').click()}>
                                        <i className="fas fa-paperclip"></i>
                                    </button>
                                    <input type="text" placeholder="Scrivi un messaggio..." value={newMessage} onChange={e => setNewMessage(e.target.value)} />
                                    <button type="submit" className="icon-btn" style={{color: newMessage ? '#075e54' : '#a0a0a0'}}>
                                        <i className="fas fa-paper-plane"></i>
                                    </button>
                                </form>
                            </React.Fragment>
                        ) : (
                            <div style={{flex:1, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', background:'#f0f2f5', color:'#888'}}>
                                <i className="fas fa-comments" style={{fontSize:'60px', color:'#ccc', marginBottom:'15px'}}></i>
                                <h2>FFchatgram</h2>
                                <p>Scegli una chat dalla rubrica per iniziare.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
