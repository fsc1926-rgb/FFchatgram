<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FFchatgram</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#128C7E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyDR6F1nGbRhGdDQVXWETK0XlNxhU5AKxEU",
  authDomain: "ffchatgram.firebaseapp.com",
  projectId: "ffchatgram",
  storageBucket: "ffchatgram.firebasestorage.app",
  messagingSenderId: "6270167752",
  appId: "1:6270167752:web:dbe57e9c6166f91fa953fd"
};
        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.firebaseMethods = { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, doc, setDoc, getDocs };
        
        // Segnale per avvisare l'interfaccia che il database è pronto
        window.isFirebaseReady = true;
        window.dispatchEvent(new Event('firebaseReady'));
    </script>
    <style>
        body { margin: 0; background-color: #eae6df; overflow: hidden; }
        .bg-chat { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; }
        .message-in { background: #ffffff; border-radius: 0px 8px 8px 8px; }
        .message-out { background: #dcf8c6; border-radius: 8px 0px 8px 8px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#128C7E;">
            <h2>Inizializzazione App...</h2>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = window.firebaseMethods.onAuthStateChanged(window.auth, (currentUser) => {
                    setUser(currentUser);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="h-screen flex items-center justify-center">Caricamento...</div>;
            
            return user ? <Dashboard user={user} /> : <AuthScreen />;
        }

        function AuthScreen() {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [name, setName] = useState('');
            const [error, setError] = useState('');

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                try {
                    if (isLogin) {
                        await window.firebaseMethods.signInWithEmailAndPassword(window.auth, email, password);
                    } else {
                        const userCred = await window.firebaseMethods.createUserWithEmailAndPassword(window.auth, email, password);
                        await window.firebaseMethods.setDoc(window.firebaseMethods.doc(window.db, "users", userCred.user.uid), {
                            uid: userCred.user.uid,
                            email: email.toLowerCase(),
                            name: name
                        });
                    }
                } catch (err) {
                    setError(err.message.includes('auth/invalid') ? "Credenziali errate." : err.message);
                }
            };

            return (
                <div className="h-screen flex flex-col items-center justify-center bg-gray-100 px-4">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
                        <h2 className="text-3xl font-bold text-center text-[#128C7E] mb-6">FFchatgram PRO</h2>
                        <form onSubmit={handleAuth} className="space-y-4">
                            {!isLogin && (
                                <input required placeholder="Il tuo Nome" value={name} onChange={e => setName(e.target.value)} className="w-full p-3 border rounded focus:outline-none focus:border-[#128C7E]" />
                            )}
                            <input required type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 border rounded focus:outline-none focus:border-[#128C7E]" />
                            <input required type="password" placeholder="Password (min. 6 caratt.)" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 border rounded focus:outline-none focus:border-[#128C7E]" />
                            {error && <p className="text-red-500 text-sm">{error}</p>}
                            <button type="submit" className="w-full bg-[#128C7E] text-white p-3 rounded font-bold hover:bg-[#075E54]">{isLogin ? 'Accedi' : 'Registrati'}</button>
                        </form>
                        <p className="mt-4 text-center text-sm text-gray-600 cursor-pointer" onClick={() => setIsLogin(!isLogin)}>
                            {isLogin ? "Non hai un account? Registrati" : "Hai già un account? Accedi"}
                        </p>
                    </div>
                </div>
            );
        }

        function Dashboard({ user }) {
            const [chats, setChats] = useState([]);
            const [activeChat, setActiveChat] = useState(null);

            useEffect(() => {
                const q = window.firebaseMethods.query(
                    window.firebaseMethods.collection(window.db, "chats"),
                    window.firebaseMethods.where("members", "array-contains", user.uid)
                );
                
                const unsubscribe = window.firebaseMethods.onSnapshot(q, (snapshot) => {
                    const chatsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    chatsData.sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0));
                    setChats(chatsData);
                });
                return () => unsubscribe();
            }, [user]);

            const addContact = async () => {
                const emailToAdd = prompt("Inserisci l'email dell'affiliato da aggiungere:");
                if (!emailToAdd) return;
                
                const usersRef = window.firebaseMethods.collection(window.db, "users");
                const q = window.firebaseMethods.query(usersRef, window.firebaseMethods.where("email", "==", emailToAdd.toLowerCase()));
                const querySnapshot = await window.firebaseMethods.getDocs(q);
                
                if (querySnapshot.empty) {
                    alert("L'utente non si è ancora registrato! ⚠️

Invitalo a scaricare l'app inviandogli il tuo link. Non appena si registrerà con la sua email, potrai aggiungerlo alla rubrica!");
                    return;
                }
                
                const contact = querySnapshot.docs[0].data();
                if (contact.uid === user.uid) { alert("Non puoi aggiungere te stesso."); return; }

                await window.firebaseMethods.addDoc(window.firebaseMethods.collection(window.db, "chats"), {
                    type: 'direct',
                    members: [user.uid, contact.uid],
                    memberNames: { [user.uid]: user.email, [contact.uid]: contact.name },
                    updatedAt: window.firebaseMethods.serverTimestamp()
                });
                alert("Contatto aggiunto con successo!");
            };

            const copyInviteLink = () => {
                const link = window.location.href.split('?')[0];
                navigator.clipboard.writeText("Ehi! Registrati sulla mia app di messaggistica privata qui: " + link);
                alert("Link di invito copiato! Incollalo su WhatsApp o dove preferisci per invitare il tuo affiliato a registrarsi.");
            };

            const createGroup = async () => {
                const groupName = prompt("Nome del nuovo Gruppo:");
                if (!groupName) return;
                await window.firebaseMethods.addDoc(window.firebaseMethods.collection(window.db, "chats"), {
                    type: 'group',
                    name: groupName,
                    members: [user.uid],
                    updatedAt: window.firebaseMethods.serverTimestamp()
                });
                alert("Gruppo creato!");
            };

            const logout = () => { window.firebaseMethods.signOut(window.auth); };

            return (
                <div className="flex h-screen w-full bg-white overflow-hidden">
                    <div className={`w-full md:w-1/3 bg-gray-50 border-r flex flex-col ${activeChat ? 'hidden md:flex' : 'flex'}`}> 
                        <div className="bg-[#f0f2f5] p-4 flex justify-between items-center border-b">
                            <div className="font-bold text-gray-700 truncate" title={user.email}>{user.email}</div>
                            <div className="flex gap-2">
                                <button onClick={copyInviteLink} className="text-gray-500 hover:text-blue-500" title="Invita tramite Link">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                                </button>
                                <button onClick={addContact} className="text-gray-500 hover:text-[#128C7E]" title="Aggiungi Contatto">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                                </button>
                                <button onClick={createGroup} className="text-gray-500 hover:text-[#128C7E]" title="Nuovo Gruppo">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                </button>
                                <button onClick={logout} className="text-red-500 ml-2" title="Esci">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                </button>
                            </div>
                        </div>
                        <div className="overflow-y-auto flex-1">
                            {chats.map(chat => {
                                let chatName = chat.type === 'group' ? chat.name : (chat.memberNames ? Object.values(chat.memberNames).find(n => n !== user.email) : "Chat");
                                return (
                                    <div key={chat.id} onClick={() => setActiveChat({ id: chat.id, name: chatName })} className="p-4 border-b hover:bg-gray-100 cursor-pointer flex items-center gap-3">
                                        <div className="w-12 h-12 rounded-full bg-[#128C7E] flex items-center justify-center text-white font-bold text-xl uppercase">
                                            {chatName ? chatName[0] : '#'}
                                        </div>
                                        <div className="flex-1 overflow-hidden">
                                            <div className="font-semibold text-gray-800 truncate">{chatName}</div>
                                            <div className="text-sm text-gray-500 truncate">{chat.lastMessage || 'Nessun messaggio'}</div>
                                        </div>
                                    </div>
                                );
                            })}
                            {chats.length === 0 && <div className="p-8 text-center text-gray-400">Nessuna chat. Aggiungi un contatto per iniziare.</div>}
                        </div>
                    </div>

                    <div className={`flex-1 flex-col ${!activeChat ? 'hidden md:flex' : 'flex'}`}>
                        {activeChat ? (
                            <ChatRoom chat={activeChat} user={user} onBack={() => setActiveChat(null)} />
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center bg-[#f0f2f5] border-l border-gray-200">
                                <div className="w-72 h-72 rounded-full bg-gray-200 flex items-center justify-center mb-6">
                                    <svg className="w-32 h-32 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                </div>
                                <h2 className="text-3xl text-gray-500 font-light">FFchatgram per Web</h2>
                                <p className="text-gray-400 mt-2">Invia e ricevi messaggi dai tuoi affiliati in tempo reale.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ChatRoom({ chat, user, onBack }) {
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState("");
            const scrollRef = useRef();

            useEffect(() => {
                const messagesRef = window.firebaseMethods.collection(window.db, "chats", chat.id, "messages");
                const q = window.firebaseMethods.query(messagesRef, window.firebaseMethods.orderBy("timestamp", "asc"));
                
                const unsubscribe = window.firebaseMethods.onSnapshot(q, (snapshot) => {
                    setMessages(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setTimeout(() => scrollRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
                });
                return () => unsubscribe();
            }, [chat.id]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!newMessage.trim()) return;
                const text = newMessage;
                setNewMessage("");

                await window.firebaseMethods.addDoc(window.firebaseMethods.collection(window.db, "chats", chat.id, "messages"), {
                    text,
                    senderId: user.uid,
                    senderName: user.email,
                    timestamp: window.firebaseMethods.serverTimestamp()
                });
                await window.firebaseMethods.setDoc(window.firebaseMethods.doc(window.db, "chats", chat.id), {
                    lastMessage: text,
                    updatedAt: window.firebaseMethods.serverTimestamp()
                }, { merge: true });
            };

            return (
                <div className="flex flex-col h-full bg-chat w-full">
                    <div className="bg-[#f0f2f5] p-3 flex items-center gap-3 border-b border-gray-200">
                        <button onClick={onBack} className="md:hidden text-gray-600 p-2">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <div className="w-10 h-10 rounded-full bg-[#128C7E] flex items-center justify-center text-white font-bold">{chat.name[0]}</div>
                        <div className="font-semibold text-gray-800">{chat.name}</div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.map(msg => {
                            const isMe = msg.senderId === user.uid;
                            return (
                                <div key={msg.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[75%] px-4 py-2 shadow-sm relative ${isMe ? 'message-out' : 'message-in'}`}>
                                        {!isMe && <div className="text-xs text-[#128C7E] font-bold mb-1">{msg.senderName}</div>}
                                        <div className="text-gray-800 text-[15px] leading-snug">{msg.text}</div>
                                        <div className="text-[10px] text-gray-400 text-right mt-1">
                                            {msg.timestamp?.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) || '...'}
                                            {isMe && <span className="ml-1 text-blue-500">✓✓</span>}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        <div ref={scrollRef}></div>
                    </div>

                    <div className="bg-[#f0f2f5] p-3">
                        <form onSubmit={sendMessage} className="flex gap-2 bg-white rounded-full p-1 pl-4 shadow-sm items-center">
                            <input 
                                value={newMessage} 
                                onChange={(e) => setNewMessage(e.target.value)} 
                                placeholder="Scrivi un messaggio..." 
                                className="flex-1 focus:outline-none bg-transparent"
                            />
                            <button type="submit" className="bg-[#128C7E] text-white p-2 rounded-full hover:bg-[#075E54] transition-colors">
                                <svg className="w-5 h-5 translate-x-[-1px] translate-y-[1px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Sistema di avvio sicuro
        const initRender = () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        };

        if (window.isFirebaseReady) {
            initRender();
        } else {
            window.addEventListener('firebaseReady', initRender);
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW setup failed', err));
            });
        }
    </script>
</body>
</html>
