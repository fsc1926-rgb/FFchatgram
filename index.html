        // --- STATO ONLINE IN TEMPO REALE ---
        function getUserPresenceStatus(targetUser) {
            if (!targetUser) return { isOnline: false, label: 'Offline' };
            const lastSeenMs = targetUser.lastSeen?.toMillis 
                ? targetUser.lastSeen.toMillis() 
                : (typeof targetUser.lastSeen === 'number' ? targetUser.lastSeen : (targetUser.updatedAt?.toMillis ? targetUser.updatedAt.toMillis() : 0));
            if (!lastSeenMs) return { isOnline: false, label: 'Offline' };
            
            const diff = Date.now() - lastSeenMs;
            if (diff < 120000) return { isOnline: true, label: 'Online' };
            
            const d = new Date(lastSeenMs);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
            const isYesterday = d.toDateString() === yesterday.toDateString();
            const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            if (isToday) return { isOnline: false, label: `Ultimo accesso: oggi alle ${timeStr}` };
            if (isYesterday) return { isOnline: false, label: `Ultimo accesso: ieri alle ${timeStr}` };
            return { isOnline: false, label: `Ultimo accesso: ${d.toLocaleDateString()} alle ${timeStr}` };
        }

        function playNotificationSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.09);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.22);
            } catch (e) {}
        }

        function copyTextSafe(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
                else fallbackCopy(text);
            } catch (e) { fallbackCopy(text); }
        }
        function fallbackCopy(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.focus(); ta.select();
                document.execCommand('copy'); document.body.removeChild(ta);
            } catch (e) {}
        }
        
        async function uploadImageToImgBB(file) {
            const formData = new FormData(); formData.append('image', file);
            const apiKey = (window.IMGBB_API_KEY).toLowerCase().trim();
            const response = await fetch('https://api.imgbb.com/1/upload?key=' + apiKey, { method: 'POST', body: formData });

            throw new Error('Errore ImgBB');

        // --- PLAYER VOCALE CUSTOM (STILE WHATSAPP/TELEGRAM) ---
        function CustomAudioPlayer({ src }) {
            const audioRef = useRef(null);
            const [playing, setPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            const [currentTime, setCurrentTime] = useState(0);
            const [speed, setSpeed] = useState(1);

            const togglePlay = () => {
                const a = audioRef.current;
                if (!a) return;
                if (playing) { a.pause(); setPlaying(false); }
                else { a.play().catch(()=>{}); setPlaying(true); }
            };

            const handleTimeUpdate = () => {
                const a = audioRef.current;
                if (!a) return;
                setCurrentTime(a.currentTime);
                if (a.duration && !isNaN(a.duration)) setProgress((a.currentTime / a.duration) * 100);
            };

            const handleLoadedMetadata = () => {
                const a = audioRef.current;
                if (a && a.duration && !isNaN(a.duration) && a.duration !== Infinity) setDuration(a.duration);
            };

            const handleSeek = (e) => {
                const a = audioRef.current;
                const val = Number(e.target.value);
                if (a && a.duration && !isNaN(a.duration)) {
                    a.currentTime = (val / 100) * a.duration;
                    setProgress(val);
                }
            };

            const toggleSpeed = () => {
                const nextSpeed = speed === 1 ? 1.5 : speed === 1.5 ? 2 : 1;
                setSpeed(nextSpeed);
                if (audioRef.current) audioRef.current.playbackRate = nextSpeed;
            };

            const fmt = (s) => {
                if (!s || isNaN(s) || s === Infinity) return "0:00";
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return `${m}:${sec < 10 ? '0' : ''}${sec}`;
            };

            return (
                <div className="flex items-center gap-2.5 bg-black/5 dark:bg-white/10 px-3 py-2 rounded-2xl w-60 sm:w-72 my-1 select-none">
                    <audio
                        ref={audioRef}
                        src={src}
                        onTimeUpdate={handleTimeUpdate}
                        onLoadedMetadata={handleLoadedMetadata}
                        onEnded={() => { setPlaying(false); setProgress(0); setCurrentTime(0); }}
                        className="hidden"
                    />
                    <button
                        type="button"
                        onClick={togglePlay}
                        className="w-9 h-9 rounded-full bg-[#008069] text-white flex items-center justify-center flex-shrink-0 shadow cursor-pointer hover:opacity-90 transition"
                    >
                        <i className={`fa-solid ${playing ? 'fa-pause' : 'fa-play ml-0.5'} text-xs`}></i>
                    </button>
                    <div className="flex-1 flex flex-col gap-1 min-w-0">
                        <input
                            type="range"
                            min="0"
                            max="100"
                            value={progress || 0}
                            onChange={handleSeek}
                            className="w-full h-1.5 bg-gray-300 dark:bg-gray-600 rounded-lg appearance-none cursor-pointer accent-[#008069]"
                        />
                        <div className="flex justify-between text-[10px] opacity-75 font-mono">
                            <span>{fmt(currentTime)}</span>
                            <span>{duration ? fmt(duration) : 'Vocale'}</span>
                        </div>
                    </div>
                    <button
                        type="button"
                        onClick={toggleSpeed}
                        className="px-2 py-1 rounded-lg bg-[#008069]/15 dark:bg-white/15 text-[#008069] dark:text-emerald-300 font-extrabold text-[10px] flex-shrink-0 cursor-pointer hover:bg-[#008069]/25 transition"
                    >
                        {speed}x
                    </button>
                </div>
            );
        }

        // --- HELPER PER LA FORMATTAZIONE (ADMIN TOOLBAR) ---
        function applyFormatting(ref, prefix, suffix, changeHandler) {
            const ta = ref.current;
            if (!ta) return;
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const text = ta.value;
            const sel = text.substring(start, end);
            const newVal = text.substring(0, start) + prefix + sel + suffix + text.substring(end);
            
            changeHandler(newVal);
            
            setTimeout(() => {
                ta.focus();
                ta.setSelectionRange(start + prefix.length, end + prefix.length);
            }, 10);
        }

        // --- FORMATTAZIONE TESTO E EMBED VIDEO ---
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getVideoEmbedUrl(line) {
            const trimmed = String(line || '').trim();
            // YouTube
            const ytMatch = trimmed.match(/^(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})(?:\S+)?$/);
            if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}`;
            // Vimeo
            const vimeoMatch = trimmed.match(/^(?:https?:\/\/)?(?:www\.)?vimeo\.com\/(\d+)(?:\S+)?$/);
            if (vimeoMatch) return `https://player.vimeo.com/video/${vimeoMatch[1]}`;
            // Loom
            const loomMatch = trimmed.match(/^(?:https?:\/\/)?(?:www\.)?loom\.com\/share\/([a-zA-Z0-9]+)(?:\S+)?$/);
            if (loomMatch) return `https://www.loom.com/embed/${loomMatch[1]}`;
            return null;
        }

        function formatText(text, enableLinks = true, searchTerm = '', enableVideoEmbed = false) {
            if (!text) return null;
            const lines = String(text).split(String.fromCharCode(10));
            return lines.map((line, i) => {
                if (enableVideoEmbed) {
                    const embedUrl = getVideoEmbedUrl(line);
                    if (embedUrl) {
                        return (
                            <div key={i} className="my-4 rounded-2xl overflow-hidden shadow-lg aspect-video w-full bg-black border border-gray-200 dark:border-gray-700">
                                <iframe
                                    src={embedUrl}
                                    className="w-full h-full border-0"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowFullScreen
                                    title="Video Academy"
                                ></iframe>
                            </div>
                        );
                    }
                }

                let safeLine = escapeHtml(line);
                
                if (searchTerm && searchTerm.trim()) {
                     const regex = new RegExp(`(${escapeHtml(searchTerm.trim())})`, 'gi');
                     safeLine = safeLine.replace(regex, '<mark class="bg-yellow-200 dark:bg-yellow-800 dark:text-white">$1</mark>');
                }

                if (enableLinks) {
                    safeLine = safeLine.replace(
                        /((?:https?:\/\/|www\.)[^\s<]+)/gi,
                        (match) => {
                            if(match.includes('<mark') || match.includes('</mark>')) return match;
                            const href = match.toLowerCase().startsWith('http') ? match : 'https://' + match;
                            return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="md-link" onclick="event.stopPropagation()">${match}</a>`;
                        }
                    );
                }
                safeLine = safeLine.replace(/\*([^*]+)\*/g, '<span class="md-bold">$1</span>');
                safeLine = safeLine.replace(/(^|\s)_([^_]+)_(?=\s|$|[.,!?;:])/g, '$1<span class="md-italic">$2</span>');
                return (
                    <Fragment key={i}>
                        <span dangerouslySetInnerHTML={{ __html: safeLine }} />
                        {i < lines.length - 1 && <br />}
                    </Fragment>
                );
            });
        }

        function exportChatToTxt(chatInfo, messages) {
            if (!messages || messages.length === 0) return;
            let exportText = `--- Chat con ${chatInfo.name || 'Affiliato'} ---\nData Esportazione: ${new Date().toLocaleString()}\n\n`;
            messages.forEach(msg => {
                const date = msg.timestamp?.toDate ? msg.timestamp.toDate().toLocaleString() : 'Data sconosciuta';
                const sender = msg.senderName || 'Utente';
                let content = msg.text || '';
                if (msg.type === 'image') content = '[Immagine Allegata: ' + msg.imageUrl + '] ' + content;
                if (msg.type === 'file') content = '[Documento Allegato: ' + msg.fileUrl + '] ' + content;
                if (msg.type === 'audio') content = '[Nota Vocale: ' + msg.audioUrl + ']';
                if (msg.type === 'poll') content = '[Sondaggio: ' + (msg.pollData?.question || '') + ']';
                exportText += `[${date}] ${sender}:\n${content}\n\n`;
            });
            const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Chat_FFchatgram_${(chatInfo.name || 'chat').replace(/[^a-z0-9]/gi, '_').toLowerCase()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function Avatar({ name, photoURL, isGroup, size = "w-11 h-11", textSize = "text-base", showOnlineDot = false, isOnline = false }) {
            const initial = name ? name.trim()[0].toUpperCase() : '?';
            return (
                <div className={`relative flex-shrink-0 ${size}`}>
                    {photoURL ? (
                        <img src={photoURL} alt="Avatar" onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/100x100/008069/ffffff?text=' + initial; }} className={size + " rounded-full object-cover border border-black/10 dark:border-white/10 bg-emerald-700"} />
                    ) : (
                        <div className={size + " rounded-full flex items-center justify-center font-bold text-white shadow-inner " + (isGroup ? "bg-teal-600" : "bg-[#008069]") + " " + textSize}>
                            {isGroup ? <i className="fa-solid fa-users text-sm"></i> : initial}
                        </div>
                    )}
                    {showOnlineDot && isOnline && (
                        <span className="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-white dark:border-gray-800 rounded-full shadow" title="Online ora"></span>
                    )}
                </div>
            );
        }

        function InstallGuideModal({ onClose }) {
            const ua = typeof navigator !== 'undefined' ? navigator.userAgent.toLowerCase() : '';
            const isIOS = /iphone|ipad|ipod/.test(ua);
            const isInApp = /whatsapp|fbav|fban|instagram|telegram/.test(ua);
            return (
                <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" onClick={onClose}>
                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold flex items-center gap-2"><i className="fa-solid fa-mobile-screen-button"></i> Installa App</h3><button onClick={onClose} className="cursor-pointer"><i className="fa-solid fa-xmark text-lg"></i></button></div>
                        <div className="p-5 space-y-4 text-sm text-gray-700 dark:text-gray-200">
                            {isInApp && <div className="bg-amber-50 dark:bg-amber-900/30 p-3.5 rounded-xl text-amber-900 dark:text-amber-200 text-xs"><b>Passo Preliminare:</b> Tocca i 3 puntini ⋮ e scegli "Apri nel browser".</div>}
                            {isIOS ? (
                                <div className="space-y-3"><div className="font-bold">iPhone / iPad (Safari):</div>
                                    <div className="flex gap-3 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl"><span className="w-6 h-6 rounded-full bg-[#008069] text-white flex items-center justify-center text-xs">1</span><div>Tocca il pulsante <b>Condividi</b> in basso.</div></div>
                                    <div className="flex gap-3 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl"><span className="w-6 h-6 rounded-full bg-[#008069] text-white flex items-center justify-center text-xs">2</span><div>Tocca <b>"Aggiungi a schermata Home"</b>.</div></div>
                                </div>
                            ) : (
                                <div className="space-y-3"><div className="font-bold">Android:</div>
                                    <div className="flex gap-3 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl"><span className="w-6 h-6 rounded-full bg-[#008069] text-white flex items-center justify-center text-xs">1</span><div>Tocca i <b>3 puntini ⋮</b> in alto a destra.</div></div>
                                    <div className="flex gap-3 bg-gray-50 dark:bg-gray-700 p-3 rounded-xl"><span className="w-6 h-6 rounded-full bg-[#008069] text-white flex items-center justify-center text-xs">2</span><div>Seleziona <b>"Installa app"</b> o <b>"Aggiungi a schermata Home"</b>.</div></div>
                                </div>
                            )}
                            <button onClick={onClose} className="w-full bg-[#008069] text-white font-bold py-3 rounded-xl cursor-pointer">Chiudi</button>
                        </div>
                    </div>

            );

        function App() {
            const [fbReady, setFbReady] = useState(!!window.firebaseReady);
            const [fbError, setFbError] = useState(window.firebaseInitError || '');
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [toast, setToast] = useState(null);

            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('ffchatgram_theme') === 'dark');
            const toggleDarkMode = () => { const newVal = !darkMode; setDarkMode(newVal); localStorage.setItem('ffchatgram_theme', newVal ? 'dark' : 'light'); };

            const [accentTheme, setAccentTheme] = useState(() => localStorage.getItem('ffchatgram_accent') || 'emerald');
            useEffect(() => {
                document.documentElement.setAttribute('data-theme-accent', accentTheme);
                localStorage.setItem('ffchatgram_accent', accentTheme);
            }, [accentTheme]);

            const [isStandalone, setIsStandalone] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(() => window.deferredPwaPrompt || null);
            const [showInstallGuide, setShowInstallGuide] = useState(false);

            const showToast = (msg, type = 'success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3500); };

            useEffect(() => { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch (e) {} }, []);

            useEffect(() => {
                const checkStandalone = () => { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } };
                setIsStandalone(checkStandalone());
                const onPromptReady = () => setDeferredPrompt(window.deferredPwaPrompt);
                const onInstalled = () => { setDeferredPrompt(null); setIsStandalone(true); setShowInstallGuide(false); showToast("Installata con successo!"); };
                window.addEventListener('pwa-prompt-ready', onPromptReady); window.addEventListener('pwa-installed', onInstalled);
                return () => { window.removeEventListener('pwa-prompt-ready', onPromptReady); window.removeEventListener('pwa-installed', onInstalled); };
            }, []);

            const triggerInstall = async () => {
                if (isStandalone) return showToast("L'App è già installata!");
                const promptEvent = deferredPrompt || window.deferredPwaPrompt;
                if (promptEvent) { try { promptEvent.prompt(); const { outcome } = await promptEvent.userChoice; if (outcome === 'accepted') { window.deferredPwaPrompt = null; setDeferredPrompt(null); } return; } catch (err) {} }
                setShowInstallGuide(true);
            };

            useEffect(() => {
                if (fbReady) return;
                const onReady = () => setFbReady(true); const onError = () => setFbError(window.firebaseInitError || 'Errore Firebase');
                window.addEventListener('firebase-ready', onReady); window.addEventListener('firebase-error', onError);
                const timeout = setTimeout(() => { if (!window.firebaseReady) setFbError('Connessione bloccata. Verifica la rete.'); }, 8000);
                return () => { window.removeEventListener('firebase-ready', onReady); window.removeEventListener('firebase-error', onError); clearTimeout(timeout); };
            }, [fbReady]);

            const handleAutoInvite = async (myUid, myProfile, inviterUid) => {
                if (!myUid || !inviterUid || myUid === inviterUid) return;
                try {
                    const fm = window.firebaseMethods;
                    const inviterSnap = await fm.getDoc(fm.doc(window.db, "users", inviterUid));
                    const inviterData = inviterSnap.exists() ? inviterSnap.data() : { name: 'Amministratore' };
                    const q = fm.query(fm.collection(window.db, "chats"), fm.where("members", "array-contains", myUid));
                    const existingSnap = await fm.getDocs(q);
                    const existingDoc = existingSnap.docs.find(d => d.data().type === 'direct' && d.data().members && d.data().members.includes(inviterUid));
                    let targetChatId = null;
                    if (existingDoc) targetChatId = existingDoc.id;
                    else {
                        const newChatRef = await fm.addDoc(fm.collection(window.db, "chats"), {
                            type: 'direct', members: [myUid, inviterUid],
                            memberData: { [myUid]: { name: myProfile?.name, photoURL: myProfile?.photoURL }, [inviterUid]: { name: inviterData.name, photoURL: inviterData.photoURL } },
                            lastMessage: '👋 Chat avviata tramite link di invito!',
                            lastSenderId: inviterUid,
                            unreadBy: [myUid],
                            updatedAt: fm.serverTimestamp()
                        });
                        targetChatId = newChatRef.id; showToast('Collegamento completato!');
                    }
                    pendingInviteStore.clearInvite();
                    if (targetChatId) { pendingInviteStore.setAutoChat(targetChatId); window.dispatchEvent(new CustomEvent('ffchatgram-open-chat', { detail: { chatId: targetChatId } })); }
                    try { window.history.replaceState({}, document.title, window.location.pathname); } catch (e) {}
                } catch (e) {}
            };

            useEffect(() => {
                if (!fbReady || !window.firebaseMethods) return;
                const fm = window.firebaseMethods;
                const unsub = fm.onAuthStateChanged(window.auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userRef = fm.doc(window.db, "users", currentUser.uid); const snap = await fm.getDoc(userRef);
                            let profileData;
                            if (snap.exists()) {
                                profileData = snap.data();
                                if (!profileData.email && currentUser.email) profileData.email = currentUser.email.toLowerCase();
                                await fm.setDoc(userRef, { lastSeen: fm.serverTimestamp() }, { merge: true });
                            } else {
                                profileData = { uid: currentUser.uid, name: currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : 'Affiliato'), email: (currentUser.email || '').toLowerCase(), photoURL: currentUser.photoURL || '', lastSeen: fm.serverTimestamp(), updatedAt: fm.serverTimestamp() };
                                await fm.setDoc(userRef, profileData, { merge: true });
                            }
                            setUserData(profileData);
                            let inviteUid = pendingInviteStore.getInvite();
                            try { const params = new URLSearchParams(window.location.search); if (params.get('invite')) inviteUid = params.get('invite').trim(); } catch (e) {}
                            if (inviteUid && inviteUid !== currentUser.uid) await handleAutoInvite(currentUser.uid, profileData, inviteUid);
                        } catch (e) {}
                    } else setUserData(null);
                    setAuthLoading(false);
                });
                return () => unsub();
            }, [fbReady]);

            // Heartbeat per aggiornare lo Stato Online in Tempo Reale ogni 45s
            useEffect(() => {
                if (!user || !fbReady || !window.firebaseMethods) return;
                const fm = window.firebaseMethods;
                const updatePresence = () => {
                    fm.setDoc(fm.doc(window.db, "users", user.uid), { lastSeen: fm.serverTimestamp() }, { merge: true }).catch(()=>{});
                };
                updatePresence();
                const interval = setInterval(updatePresence, 45000);
                const onVisibility = () => { if (document.visibilityState === 'visible') updatePresence(); };
                window.addEventListener('visibilitychange', onVisibility);
                return () => { clearInterval(interval); window.removeEventListener('visibilitychange', onVisibility); };
            }, [user, fbReady]);

            if (fbError) return <div className="h-full w-full flex items-center justify-center p-6"><div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center"><h2>Errore Connessione</h2><p>{fbError}</p></div></div>;
            if (!fbReady || authLoading) return <div className="h-full w-full flex items-center justify-center"><div className="w-14 h-14 border-4 border-[#008069] border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className={`h-full w-full overflow-hidden relative select-text ${darkMode ? 'dark' : ''}`} style={{ height: '100dvh', position: 'fixed', inset: 0 }}>
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-semibold text-sm flex items-center gap-2.5" style={{ backgroundColor: toast.type === 'error' ? '#dc2626' : 'var(--brand-primary)' }}>
                            <i className={toast.type === 'error' ? "fa-solid fa-circle-exclamation" : "fa-solid fa-check"}></i><span>{toast.msg}</span>
                        </div>
                    )}
                    {showInstallGuide && <InstallGuideModal onClose={() => setShowInstallGuide(false)} />}
                    {user ? (
                        <Workspace user={user} userData={userData} setUserData={setUserData} showToast={showToast} triggerInstall={triggerInstall} isStandalone={isStandalone} darkMode={darkMode} toggleDarkMode={toggleDarkMode} accentTheme={accentTheme} setAccentTheme={setAccentTheme} />
                    ) : (
                        <AuthScreen showToast={showToast} onAutoInvite={handleAutoInvite} triggerInstall={triggerInstall} isStandalone={isStandalone} />
                    )}
                </div>
            );
        }

        function AuthScreen({ showToast, onAutoInvite, triggerInstall, isStandalone }) {
            const hasInvite = useMemo(() => { try { return !!(pendingInviteStore.getInvite() || new URLSearchParams(window.location.search).get('invite')); } catch (e) { return !!pendingInviteStore.getInvite(); } }, []);
            const [mode, setMode] = useState(hasInvite ? 'register' : 'login');
            const [name, setName] = useState(''); const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
            const [busy, setBusy] = useState(false); const [errorMsg, setErrorMsg] = useState('');

            const handleSSO = async (provider) => {
                setErrorMsg(''); setBusy(true);
                const fm = window.firebaseMethods;
                try {
                    const result = await fm.signInWithPopup(window.auth, provider);
                    const cred = result.user;
                    const userRef = fm.doc(window.db, "users", cred.uid);
                    const snap = await fm.getDoc(userRef);
                    let profileToSave;
                    if (snap.exists()) {
                        profileToSave = snap.data();
                    } else {
                        profileToSave = { uid: cred.uid, name: cred.displayName || (cred.email ? cred.email.split('@')[0] : 'Affiliato'), email: (cred.email || '').toLowerCase(), photoURL: cred.photoURL || '', lastSeen: fm.serverTimestamp(), updatedAt: fm.serverTimestamp() };
                        await fm.setDoc(userRef, profileToSave, { merge: true });
                    }
                    const inviteUid = pendingInviteStore.getInvite(); 
                    if (inviteUid && inviteUid !== cred.uid && onAutoInvite) {
                        await onAutoInvite(cred.uid, profileToSave, inviteUid);
                    }
                    showToast("Accesso effettuato!");
                } catch (err) {
                    if (err.code !== 'auth/popup-closed-by-user') {
                        setErrorMsg("Errore accesso: " + (err.message));
                    }
                }
                setBusy(false);
            };

            const handleSubmit = async (e) => {
                e.preventDefault(); setErrorMsg(''); setBusy(true); const fm = window.firebaseMethods;
                try {
                    if (mode === 'login') await fm.signInWithEmailAndPassword(window.auth, email.trim(), password);
                    else if (mode === 'register') {
                        if (!name.trim()) { setErrorMsg("Inserisci il Nome."); setBusy(false); return; }
                        const cred = await fm.createUserWithEmailAndPassword(window.auth, email.trim(), password);
                        const newProfile = { uid: cred.user.uid, name: name.trim(), email: email.trim().toLowerCase(), photoURL: '', lastSeen: fm.serverTimestamp(), updatedAt: fm.serverTimestamp() };
                        await fm.updateProfile(cred.user, { displayName: name.trim() });
                        await fm.setDoc(fm.doc(window.db, "users", cred.user.uid), newProfile, { merge: true });
                        const inviteUid = pendingInviteStore.getInvite();
                        if (inviteUid && inviteUid !== cred.user.uid && onAutoInvite) await onAutoInvite(cred.user.uid, newProfile, inviteUid);
                        showToast("Benvenuto!");
                    } else if (mode === 'reset') {
                        if (!email.trim()) { setErrorMsg("Inserisci l'email."); setBusy(false); return; }
                        await fm.sendPasswordResetEmail(window.auth, email.trim()); showToast("Email inviata!"); setMode('login');
                    }
                } catch (err) { setErrorMsg("Errore: " + (err.message)); }
                setBusy(false);
            };

            return (
                <div className="h-full w-full overflow-y-auto bg-gradient-to-b from-[#00a884] to-[#eae6df] dark:from-[#005c4b] dark:to-gray-900 flex flex-col items-center justify-center p-4">
                    <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                        <div className="bg-[#008069] dark:bg-[#005c4b] p-6 text-center text-white">
                            <h1 className="text-2xl font-extrabold tracking-tight"><i className="fa-solid fa-comments"></i> FFchatgram</h1>
                            {hasInvite && <div className="mt-3 bg-white/20 text-xs py-1.5 px-3 rounded-full inline-block font-semibold">Invito rilevato: accedi o registrati!</div>}
                        </div>
                        <div className="p-6">
                            <div className="flex rounded-xl bg-gray-100 dark:bg-gray-700 p-1 mb-5">
                                <button type="button" onClick={() => {setMode('login'); setErrorMsg('');}} className={`flex-1 py-2 text-xs font-bold rounded-lg cursor-pointer ${mode==='login'?'bg-white dark:bg-gray-600 text-[#008069] dark:text-white shadow':'text-gray-500 dark:text-gray-300'}`}>Accedi</button>
                                <button type="button" onClick={() => {setMode('register'); setErrorMsg('');}} className={`flex-1 py-2 text-xs font-bold rounded-lg cursor-pointer ${mode==='register'?'bg-white dark:bg-gray-600 text-[#008069] dark:text-white shadow':'text-gray-500 dark:text-gray-300'}`}>Nuovo Affiliato</button>
                                <button type="button" onClick={() => {setMode('reset'); setErrorMsg('');}} className={`flex-1 py-2 text-xs font-bold rounded-lg cursor-pointer ${mode==='reset'?'bg-white dark:bg-gray-600 text-[#008069] dark:text-white shadow':'text-gray-500 dark:text-gray-300'}`}>Recupera</button>
                            </div>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                {mode === 'register' && <input type="text" required placeholder="Tuo Nome (visibile in chat)" value={name} onChange={e=>setName(e.target.value)} className="w-full px-3.5 py-2.5 bg-white dark:bg-gray-700 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#008069]" />}
                                <input type="email" required placeholder="Email (privata)" value={email} onChange={e=>setEmail(e.target.value)} className="w-full px-3.5 py-2.5 bg-white dark:bg-gray-700 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#008069]" />
                                {mode !== 'reset' && <input type="password" required placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full px-3.5 py-2.5 bg-white dark:bg-gray-700 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none focus:border-[#008069]" />}
                                {errorMsg && <div className="bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-xs font-semibold p-3 rounded-xl">{errorMsg}</div>}
                                <button type="submit" disabled={busy} className="w-full bg-[#008069] text-white font-bold py-3 rounded-xl cursor-pointer">{busy ? 'Attendere...' : (mode === 'login' ? 'Entra' : mode === 'register' ? 'Crea Account' : 'Invia Reset')}</button>
                            </form>

                            {mode !== 'reset' && (
                                <div className="mt-6">
                                    <div className="relative flex py-2 items-center">
                                        <div className="flex-grow border-t border-gray-200 dark:border-gray-600"></div>
                                        <span className="flex-shrink-0 mx-4 text-gray-400 text-xs uppercase font-bold">Oppure accedi con</span>
                                        <div className="flex-grow border-t border-gray-200 dark:border-gray-600"></div>
                                    </div>
                                    <div className="mt-3 flex gap-2">
                                        <button type="button" onClick={() => handleSSO(window.firebaseMethods.googleProvider)} disabled={busy} className="flex-1 bg-white hover:bg-gray-50 text-gray-700 font-bold py-2.5 rounded-xl border border-gray-300 shadow-sm flex items-center justify-center gap-2 transition disabled:opacity-50 cursor-pointer">
                                            <i className="fa-brands fa-google text-red-500"></i> Google
                                        </button>
                                        <button type="button" onClick={() => handleSSO(window.firebaseMethods.appleProvider)} disabled={busy} className="flex-1 bg-black hover:bg-gray-900 text-white font-bold py-2.5 rounded-xl shadow-sm flex items-center justify-center gap-2 transition disabled:opacity-50 cursor-pointer">
                                            <i className="fa-brands fa-apple text-white text-lg"></i> Apple
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    {!isStandalone && <button onClick={triggerInstall} className="mt-4 text-white font-bold text-xs py-3 px-6 bg-black/20 hover:bg-black/30 rounded-xl backdrop-blur-md transition flex items-center gap-2 border border-white/20 cursor-pointer"><i className="fa-solid fa-download"></i> Installa App sul Telefono</button>}
                </div>
            );
        }

        function Workspace({ user, userData, setUserData, showToast, triggerInstall, isStandalone, darkMode, toggleDarkMode, accentTheme, setAccentTheme }) {
            const isAdmin = useMemo(() => checkIsAdmin(user, userData), [user, userData]);
            const [appMode, setAppMode] = useState('chat'); // 'chat' | 'academy' | 'crm'
            const [isLauncherOpen, setIsLauncherOpen] = useState(false);
            const [unreadChatCount, setUnreadChatCount] = useState(0);

            useEffect(() => { if (!isAdmin && appMode === 'crm') setAppMode('chat'); }, [isAdmin, appMode]);

            // Conteggio badge notifiche chat non lette per la Dock
            useEffect(() => {
                const fm = window.firebaseMethods;
                const q = fm.query(fm.collection(window.db, "chats"), fm.where("members", "array-contains", user.uid));
                const unsub = fm.onSnapshot(q, (snap) => {
                    const count = snap.docs.filter(d => Array.isArray(d.data().unreadBy) && d.data().unreadBy.includes(user.uid)).length;
                    setUnreadChatCount(count);
                });
                return () => unsub();
            }, [user.uid]);

            // Gestione apertura diretta Chat da Scheda CRM
            const handleOpenDirectChatWithUid = async (targetUid) => {
                if (!targetUid || targetUid === user.uid) return;
                const fm = window.firebaseMethods;
                try {
                    const q = fm.query(fm.collection(window.db, "chats"), fm.where("members", "array-contains", user.uid));
                    const snap = await fm.getDocs(q);
                    const existing = snap.docs.find(d => d.data().type === 'direct' && (d.data().members || []).includes(targetUid));
                    let chatId;
                    if (existing) {
                        chatId = existing.id;
                    } else {
                        const targetSnap = await fm.getDoc(fm.doc(window.db, "users", targetUid));
                        const targetData = targetSnap.exists() ? targetSnap.data() : { name: 'Affiliato' };
                        const newRef = await fm.addDoc(fm.collection(window.db, "chats"), {
                            type: 'direct',
                            members: [user.uid, targetUid],
                            memberData: { [user.uid]: { name: userData?.name }, [targetUid]: { name: targetData.name } },
                            lastMessage: 'Nuova conversazione',
                            lastSenderId: user.uid,
                            unreadBy: [],
                            updatedAt: fm.serverTimestamp()
                        });
                        chatId = newRef.id;
                    }

        function Dashboard({ user, userData, setUserData, showToast, triggerInstall, isStandalone, darkMode, toggleDarkMode, accentTheme, setAccentTheme, isAdmin, onOpenLauncher }) {
            const [chats, setChats] = useState([]); const [allUsers, setAllUsers] = useState({});
            const [activeChatId, setActiveChatId] = useState(null); const [searchTerm, setSearchTerm] = useState('');
            const [modal, setModal] = useState(null); const [lightboxUrl, setLightboxUrl] = useState(null);

            const [editName, setEditName] = useState(userData?.name || ''); const [newPass, setNewPass] = useState(''); const [uploadingAvatar, setUploadingAvatar] = useState(false);
            const avatarInputRef = useRef(); const historyPushedRef = useRef(false);
            const [contactEmailSearch, setContactEmailSearch] = useState(''); const [groupName, setGroupName] = useState(''); const [selectedMembers, setSelectedMembers] = useState([]);
            const [broadcastMsg, setBroadcastMsg] = useState(''); const [activeTagFilter, setActiveTagFilter] = useState('Tutte');
            const broadcastRef = useRef(null);

            const myInviteUrl = useMemo(() => getInviteUrl(user.uid), [user.uid]);
            useEffect(() => { if (userData?.name) setEditName(userData.name); }, [userData]);

            const selectChat = (chatId) => {
                setActiveChatId(chatId);

                    const fm = window.firebaseMethods;

                    if (!historyPushedRef.current) {

                    }

            useEffect(() => {
                const pendingChat = pendingInviteStore.getAutoChat(); if (pendingChat) { selectChat(pendingChat); pendingInviteStore.clearAutoChat(); }
                const onOpenChat = (e) => { if (e.detail?.chatId) { selectChat(e.detail.chatId); pendingInviteStore.clearAutoChat(); } };
                window.addEventListener('ffchatgram-open-chat', onOpenChat); return () => window.removeEventListener('ffchatgram-open-chat', onOpenChat);
            }, []);

            useEffect(() => {
                const handlePopState = () => { historyPushedRef.current = false; if (lightboxUrl) setLightboxUrl(null); else if (modal) setModal(null); else setActiveChatId(null); };
                window.addEventListener('popstate', handlePopState); return () => window.removeEventListener('popstate', handlePopState);
            }, [lightboxUrl, modal]);

            useEffect(() => { const fm = window.firebaseMethods; const unsub = fm.onSnapshot(fm.collection(window.db, "users"), (snap) => { const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); }); setAllUsers(map); }); return () => unsub(); }, []);
            useEffect(() => { const fm = window.firebaseMethods; const q = fm.query(fm.collection(window.db, "chats"), fm.where("members", "array-contains", user.uid)); const unsub = fm.onSnapshot(q, (snap) => { const list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0)); setChats(list); }); return () => unsub(); }, [user.uid]);

            const getChatInfo = (chat) => {
                if (!chat) return { name: 'Chat', photoURL: '', isGroup: false, isOnline: false, presenceLabel: '' };
                if (chat.type === 'group') return { name: chat.name, photoURL: chat.photoURL, isGroup: true, isOnline: false, presenceLabel: `${(chat.members || []).length} partecipanti` };
                const otherUid = (chat.members || []).find(uid => uid !== user.uid);
                const liveOther = otherUid ? allUsers[otherUid] : null;
                const cachedOther = (otherUid && chat.memberData?.[otherUid]) ? chat.memberData[otherUid] : null;
                const presence = getUserPresenceStatus(liveOther);
                return {
                    name: liveOther?.name || cachedOther?.name || 'Affiliato',
                    photoURL: liveOther?.photoURL || cachedOther?.photoURL || '',
                    isGroup: false,
                    otherUid,
                    isOnline: presence.isOnline,
                    presenceLabel: presence.label
                };
            };

            const isSomeoneTyping = (chat) => { if (!chat || !chat.typing) return false; const now = Date.now(); return Object.entries(chat.typing).some(([uid, ts]) => uid !== user.uid && typeof ts === 'number' && (now - ts) < 5000); };
            const handleCopyInvite = () => { if (!isAdmin) return; copyTextSafe(myInviteUrl); setModal('inviteModal'); showToast("Link d'invito copiato!"); };

            const startDirectChatWithUser = async (targetUser) => {
                if (!targetUser || targetUser.uid === user.uid) return; const fm = window.firebaseMethods;
                const existing = chats.find(c => c.type === 'direct' && c.members.includes(targetUser.uid)); if (existing) { selectChat(existing.id); setModal(null); return; }
                const newChatRef = await fm.addDoc(fm.collection(window.db, "chats"), { type: 'direct', members: [user.uid, targetUser.uid], memberData: { [user.uid]: { name: userData?.name }, [targetUser.uid]: { name: targetUser.name } }, lastMessage: 'Nuova conversazione', lastSenderId: user.uid, unreadBy: [], updatedAt: fm.serverTimestamp() }); selectChat(newChatRef.id); setModal(null);
            };

            const handleCreateGroup = async (e) => {
                e.preventDefault(); if (!groupName.trim()) return showToast("Inserisci il nome", "error"); const fm = window.firebaseMethods; const members = Array.from(new Set([user.uid, ...selectedMembers])); const memberData = {}; members.forEach(uid => { memberData[uid] = { name: allUsers[uid]?.name || 'Affiliato', photoURL: allUsers[uid]?.photoURL || '' }; });
                const ref = await fm.addDoc(fm.collection(window.db, "chats"), { type: 'group', name: groupName.trim(), members, memberData, lastMessage: '👥 Gruppo creato', lastSenderId: user.uid, unreadBy: selectedMembers, updatedAt: fm.serverTimestamp() }); setGroupName(''); setSelectedMembers([]); setModal(null); selectChat(ref.id); showToast("Gruppo creato!");
            };

            const handleAddMembersToGroup = async () => {
                const activeChat = chats.find(c => c.id === activeChatId); if (!activeChat || selectedMembers.length === 0) return; const fm = window.firebaseMethods; const updatedMembers = Array.from(new Set([...(activeChat.members || []), ...selectedMembers]));
                await fm.updateDoc(fm.doc(window.db, "chats", activeChat.id), { members: updatedMembers, updatedAt: fm.serverTimestamp() }); setSelectedMembers([]); setModal(null); showToast("Aggiunti al gruppo!");
            };
            
            const handleSendBroadcast = async (e) => {
                e.preventDefault(); if (!broadcastMsg.trim()) return; const fm = window.firebaseMethods; const directChats = chats.filter(c => c.type === 'direct'); if(directChats.length === 0) return showToast("Nessuna chat", "error");
                showToast("Invio broadcast in corso...", "info");
                try {
                    await Promise.all(directChats.map(async (c) => {
                        const otherMembers = (c.members || []).filter(id => id !== user.uid);
                        await fm.addDoc(fm.collection(window.db, "chats", c.id, "messages"), { type: 'text', text: broadcastMsg.trim(), imageUrl: '', senderId: user.uid, senderName: userData?.name || 'Amministratore', readBy: [], reactions: {}, timestamp: fm.serverTimestamp() });
                        await fm.updateDoc(fm.doc(window.db, "chats", c.id), { lastMessage: '📢 ' + broadcastMsg.trim(), lastSenderId: user.uid, unreadBy: otherMembers, updatedAt: fm.serverTimestamp() });
                    }));
                    setBroadcastMsg(''); setModal(null); showToast(`Broadcast inviato!`);
                } catch (err) { showToast("Errore invio", "error"); }
            };

            const handleSaveProfile = async (e) => { e.preventDefault(); if (!editName.trim()) return; const fm = window.firebaseMethods; try { await fm.updateProfile(window.auth.currentUser, { displayName: editName.trim() }); await fm.setDoc(fm.doc(window.db, "users", user.uid), { name: editName.trim(), updatedAt: fm.serverTimestamp() }, { merge: true }); setUserData(prev => ({ ...prev, name: editName.trim() })); showToast("Profilo aggiornato!"); } catch (err) { showToast("Errore salvataggio", "error"); } };
            const handleAvatarChange = async (e) => { const file = e.target.files?.[0]; if (!file) return; setUploadingAvatar(true); const fm = window.firebaseMethods; try { const url = await uploadImageToImgBB(file); await fm.updateProfile(window.auth.currentUser, { photoURL: url }); await fm.setDoc(fm.doc(window.db, "users", user.uid), { photoURL: url, updatedAt: fm.serverTimestamp() }, { merge: true }); setUserData(prev => ({ ...prev, photoURL: url })); showToast("Foto aggiornata!"); } catch (err) { showToast("Errore foto", "error"); } setUploadingAvatar(false); e.target.value = null; };
            const handleChangePassword = async (e) => { e.preventDefault(); if (newPass.length < 6) return showToast("Minimo 6 caratteri", "error"); try { await window.firebaseMethods.updatePassword(window.auth.currentUser, newPass); setNewPass(''); showToast("Password modificata!"); } catch (err) { showToast("Per sicurezza esci e rientra per cambiare pass", "error"); } };

            const activeChat = chats.find(c => c.id === activeChatId) || null;
            const otherAffiliates = Object.values(allUsers).filter(u => u.uid && u.uid !== user.uid);
            const filteredChats = chats.filter(c => { const matchSearch = (getChatInfo(c).name || '').toLowerCase().includes(searchTerm.toLowerCase()); const matchTag = activeTagFilter === 'Tutte' || (c.tags?.[user.uid] === activeTagFilter); return matchSearch && matchTag; });

            const handleBroadcastFormat = (prefix, suffix) => applyFormatting(broadcastRef, prefix, suffix, setBroadcastMsg);

            return (
                <>
                    <div className={"w-full md:w-[360px] lg:w-[400px] h-full bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col flex-shrink-0 " + (activeChat ? "hidden md:flex" : "flex")}>
                        <div className="bg-[#f0f2f5] dark:bg-gray-900 px-3 py-3 flex justify-between items-center border-b border-gray-200 dark:border-gray-700 flex-shrink-0">
                            <div className="flex items-center gap-2 cursor-pointer">
                                <button onClick={onOpenLauncher} title="Menu Applicazioni" className="md:hidden w-9 h-9 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center text-[#008069] dark:text-[#00a884] mr-1 transition cursor-pointer"><i className="fa-solid fa-grip text-lg"></i></button>
                                <div onClick={() => setModal('settings')} className="flex items-center gap-2"><Avatar name={userData?.name} photoURL={userData?.photoURL} showOnlineDot={true} isOnline={true} /><div className="hidden sm:block"><div className="font-bold text-gray-800 dark:text-gray-100 text-sm truncate max-w-[110px]">{userData?.name || "Profilo"}</div><div className="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold">● Online</div></div></div>
                            </div>
                            <div className="flex gap-1 text-gray-600 dark:text-gray-300">

                        {/* SEARCH CHAT */}

                        {isAdmin && (

                                {TAGS.map(t => (
                                    <button key={t.id} onClick={() => setActiveTagFilter(t.id)} className={`px-3 py-1 text-xs font-bold rounded-full whitespace-nowrap border cursor-pointer ${activeTagFilter===t.id ? 'bg-[#008069] text-white border-[#008069]' : 'bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-600'}`}>{t.icon} {t.label}</button>
                                ))}
                            </div>

                        <div className="flex-1 overflow-y-auto divide-y divide-gray-100 dark:divide-gray-700">
                            {filteredChats.map(chat => {
                                const info = getChatInfo(chat); const typing = isSomeoneTyping(chat); const isSelected = chat.id === activeChatId;
                                const timeStr = chat.updatedAt?.toDate ? chat.updatedAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                                const tagId = chat.tags?.[user.uid]; const tagObj = TAGS.find(t => t.id === tagId);
                                const isUnread = Array.isArray(chat.unreadBy) && chat.unreadBy.includes(user.uid) && !isSelected;

                                return (
                                    <div key={chat.id} onClick={() => selectChat(chat.id)} className={`px-4 py-3 flex gap-3.5 cursor-pointer ${isSelected ? 'bg-[#f0f2f5] dark:bg-gray-700' : 'hover:bg-gray-50 dark:hover:bg-gray-750'}`}>
                                        <div className="relative">
                                            <Avatar name={info.name} photoURL={info.photoURL} isGroup={info.isGroup} size="w-12 h-12" showOnlineDot={!info.isGroup} isOnline={info.isOnline} />
                                            {tagObj && <div className="absolute -bottom-1 -right-1 text-xs bg-white dark:bg-gray-800 rounded-full w-5 h-5 flex items-center justify-center shadow">{tagObj.icon}</div>}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="flex justify-between items-center mb-0.5">
                                                <span className={"text-sm truncate " + (isUnread ? "font-extrabold text-gray-900 dark:text-white" : "font-bold text-gray-900 dark:text-white")}>{info.name}</span>

                    )}
                    {modal === 'newChat' && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md flex flex-col max-h-[85vh]"><div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold">Rubrica</h3><button onClick={() => setModal(null)} className="cursor-pointer"><i className="fa-solid fa-xmark"></i></button></div><div className="p-4 border-b dark:border-gray-700"><input type="text" placeholder="Cerca affiliato..." value={contactEmailSearch} onChange={e=>setContactEmailSearch(e.target.value)} className="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none" /></div><div className="flex-1 overflow-y-auto p-2">{otherAffiliates.filter(u=>(u.name||'').toLowerCase().includes(contactEmailSearch.toLowerCase())).map(u=>{ const pres = getUserPresenceStatus(u); return (<div key={u.uid} onClick={()=>startDirectChatWithUser(u)} className="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-xl flex items-center justify-between cursor-pointer"><div className="flex gap-3"><Avatar name={u.name} photoURL={u.photoURL} showOnlineDot={true} isOnline={pres.isOnline} /><div><div className="font-bold text-sm dark:text-white">{u.name}</div><div className={`text-[11px] ${pres.isOnline ? 'text-emerald-600 font-bold' : 'text-gray-400'}`}>{pres.isOnline ? '● Online ora' : pres.label}</div></div></div></div>);})}</div></div></div>
                    )}
                    {modal === 'newGroup' && isAdmin && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><form onSubmit={handleCreateGroup} className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md flex flex-col max-h-[85vh]"><div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold">Nuovo Gruppo</h3><button type="button" onClick={() => setModal(null)} className="cursor-pointer"><i className="fa-solid fa-xmark"></i></button></div><div className="p-4 border-b dark:border-gray-700"><input type="text" required placeholder="Nome Gruppo" value={groupName} onChange={e=>setGroupName(e.target.value)} className="w-full px-3 py-2 border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none" /></div><div className="flex-1 overflow-y-auto p-2">{otherAffiliates.map(u=>{const checked=selectedMembers.includes(u.uid); return(<div key={u.uid} onClick={()=>setSelectedMembers(p=>checked?p.filter(id=>id!==u.uid):[...p,u.uid])} className="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 flex justify-between cursor-pointer"><div className="flex gap-3"><Avatar name={u.name} photoURL={u.photoURL} size="w-8 h-8" /><span className="font-bold text-sm dark:text-white">{u.name}</span></div><input type="checkbox" checked={checked} readOnly className="cursor-pointer" /></div>);})}</div><div className="p-4 flex gap-2"><button type="submit" className="w-full py-2.5 bg-[#008069] text-white font-bold rounded-xl text-xs cursor-pointer">Crea</button></div></form></div>
                    )}
                    {modal === 'addGroupMember' && activeChat && isAdmin && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md flex flex-col max-h-[85vh]"><div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold">Aggiungi a {activeChat.name}</h3><button onClick={() => setModal(null)} className="cursor-pointer"><i className="fa-solid fa-xmark"></i></button></div><div className="flex-1 overflow-y-auto p-2">{otherAffiliates.map(u=>{const alreadyIn=(activeChat.members||[]).includes(u.uid); const checked=alreadyIn||selectedMembers.includes(u.uid); return(<div key={u.uid} onClick={()=>{if(!alreadyIn)setSelectedMembers(p=>p.includes(u.uid)?p.filter(id=>id!==u.uid):[...p,u.uid]);}} className={`p-3 flex justify-between ${alreadyIn?'opacity-50':'hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer'}`}><div className="flex gap-3"><Avatar name={u.name} photoURL={u.photoURL} size="w-8 h-8" /><span className="font-bold text-sm dark:text-white">{u.name}</span></div><input type="checkbox" checked={checked} disabled={alreadyIn} readOnly className="cursor-pointer" /></div>);})}</div><div className="p-4 flex gap-2"><button onClick={handleAddMembersToGroup} className="w-full py-2.5 bg-[#008069] text-white font-bold rounded-xl text-xs cursor-pointer">Aggiungi Selezionati</button></div></div></div>
                    )}
                    {modal === 'tagChat' && activeChat && isAdmin && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-sm overflow-hidden"><div className="bg-[#008069] px-4 py-3 text-white flex justify-between"><h3 className="font-bold text-sm">Etichetta Chat</h3><button onClick={() => setModal(null)} className="cursor-pointer"><i className="fa-solid fa-xmark"></i></button></div><div className="p-2"><div onClick={() => { window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", activeChat.id), { ['tags.'+user.uid]: window.firebaseMethods.deleteField ? window.firebaseMethods.deleteField() : null }); setModal(null); }} className="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer font-bold text-gray-700 dark:text-gray-200 border-b dark:border-gray-700 text-sm">Nessuna Etichetta</div>{TAGS.map(t => (<div key={t.id} onClick={() => { window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", activeChat.id), { ['tags.'+user.uid]: t.id }); setModal(null); }} className="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer font-bold text-gray-700 dark:text-gray-200 border-b dark:border-gray-700 text-sm">{t.icon} {t.label}</div>))}</div></div></div>
                    )}
                    {lightboxUrl && <div className="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4" onClick={() => setLightboxUrl(null)}><button className="absolute top-5 right-5 text-white text-2xl cursor-pointer"><i className="fa-solid fa-xmark"></i></button><img src={lightboxUrl} className="max-w-full max-h-[85vh] object-contain rounded-lg" onClick={e=>e.stopPropagation()} /></div>}
                </>
            );
        }

        function ChatRoom({ chat, chatInfo, user, userData, setUserData, allUsers, isTyping, isAdmin, onBack, onOpenAddMembers, onOpenLightbox, showToast, setModal, globalSearchTerm }) {
            const [allMessages, setAllMessages] = useState([]);
            const [text, setText] = useState(''); const [replyTo, setReplyTo] = useState(null);
            const [confirmDeleteId, setConfirmDeleteId] = useState(null); const [uploadingImg, setUploadingImg] = useState(false);
            const [showQuick, setShowQuick] = useState(false);
            const [reactionPickerMsgId, setReactionPickerMsgId] = useState(null);
            
            // Modifica Messaggi Inviati
            const [editingMsg, setEditingMsg] = useState(null);

            // Gestione Risposte Rapide (⚡) su Firebase
            const [showQuickManager, setShowQuickManager] = useState(false);
            const [newQuickReplyText, setNewQuickReplyText] = useState('');
            const quickRepliesList = useMemo(() => {
                return Array.isArray(userData?.quickReplies) && userData.quickReplies.length > 0
                    ? userData.quickReplies
                    : DEFAULT_QUICK_REPLIES;
            }, [userData?.quickReplies]);

            // Anteprima Immagine + Didascalia prima dell'invio
            const [pendingImage, setPendingImage] = useState(null); // { file, previewUrl, caption }

            // Sondaggi Istantanei (Polls)
            const [showPollModal, setShowPollModal] = useState(false);
            const [pollQuestion, setPollQuestion] = useState('');
            const [pollOptions, setPollOptions] = useState(['', '']);

            const [isRecording, setIsRecording] = useState(false);
            const [recordingTime, setRecordingTime] = useState(0);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const timerRef = useRef(null);
            const docInputRef = useRef(null);

            const messagesEndRef = useRef(); const fileInputRef = useRef(); const initialLoadRef = useRef(true);

            useEffect(() => {
                const fm = window.firebaseMethods;
                fm.updateDoc(fm.doc(window.db, "chats", chat.id), { unreadBy: fm.arrayRemove(user.uid) }).catch(()=>{});

                const unsub = fm.onSnapshot(fm.query(fm.collection(window.db, "chats", chat.id, "messages"), fm.orderBy("timestamp", "asc")), (snap) => {
                    setAllMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    snap.docChanges().forEach((c) => {
                        if (c.type === 'added' && c.doc.data().senderId !== user.uid) {
                            const readBy = c.doc.data().readBy || [];
                            if (!readBy.includes(user.uid)) {
                                fm.updateDoc(fm.doc(window.db, "chats", chat.id, "messages", c.doc.id), { readBy: fm.arrayUnion(user.uid) }).catch(()=>{});
                            }
                            fm.updateDoc(fm.doc(window.db, "chats", chat.id), { unreadBy: fm.arrayRemove(user.uid) }).catch(()=>{});
                            if (!initialLoadRef.current) playNotificationSound();
                        }
                    });
                    if (initialLoadRef.current) initialLoadRef.current = false;
                    setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 80);
                });
                return () => unsub();
            }, [chat.id, user.uid]);

            const handleTextChange = (e) => { setText(e.target.value); window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", chat.id), { ['typing.' + user.uid]: Date.now() }).catch(()=>{}); };

            const sendPayload = async (msgText, type = 'text', fileData = null) => {
                const fm = window.firebaseMethods; const currentReply = replyTo; setText(''); setReplyTo(null); setShowQuick(false);
                const otherMembers = (chat.members || []).filter(id => id !== user.uid);
                fm.updateDoc(fm.doc(window.db, "chats", chat.id), { ['typing.' + user.uid]: 0 }).catch(()=>{});
                
                const messageObj = {
                    type, text: msgText, senderId: user.uid, senderName: userData?.name || 'Affiliato',
                    readBy: [], reactions: {},
                    replyToData: currentReply ? { id: currentReply.id, senderName: currentReply.senderName || 'Affiliato', text: currentReply.text || 'Allegato' } : null,
                    timestamp: fm.serverTimestamp()
                };

                if (type === 'image') messageObj.imageUrl = fileData;
                else if (type === 'file') { messageObj.fileUrl = fileData.url; messageObj.fileName = fileData.name; }
                else if (type === 'audio') messageObj.audioUrl = fileData;
                else if (type === 'poll') messageObj.pollData = fileData;

                await fm.addDoc(fm.collection(window.db, "chats", chat.id, "messages"), messageObj);
                
                let summary = msgText;
                if(type === 'image') summary = msgText ? `📷 ${msgText}` : '📷 Foto';
                if(type === 'audio') summary = '🎤 Nota vocale';
                if(type === 'file') summary = '📎 ' + fileData.name;
                if(type === 'poll') summary = '📊 Sondaggio: ' + fileData.question;

                await fm.updateDoc(fm.doc(window.db, "chats", chat.id), {
                    lastMessage: summary, lastSenderId: user.uid, unreadBy: otherMembers, updatedAt: fm.serverTimestamp()
                });
            };

            const toggleReaction = async (msg, emoji) => {
                const fm = window.firebaseMethods;
                const currentReactions = msg.reactions || {};
                const usersForEmoji = currentReactions[emoji] || [];
                const hasReacted = usersForEmoji.includes(user.uid);
                const msgRef = fm.doc(window.db, "chats", chat.id, "messages", msg.id);
                try {
                    await fm.updateDoc(msgRef, {
                        [`reactions.${emoji}`]: hasReacted ? fm.arrayRemove(user.uid) : fm.arrayUnion(user.uid)
                    });
                } catch (e) {}
                setReactionPickerMsgId(null);
            };

            const handlePinMessage = async (msg) => { await window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", chat.id), { pinnedMessage: { id: msg.id, text: msg.text || (msg.type === 'poll' ? msg.pollData?.question : 'Allegato'), senderName: msg.senderName || 'Utente' } }); showToast("Fissato in alto!"); };
            const handleUnpinMessage = async () => { await window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", chat.id), { pinnedMessage: null }); };
            
            const handleSendForm = async (e) => {
                e.preventDefault();
                if (!text.trim()) return;
                if (editingMsg) {
                    const fm = window.firebaseMethods;
                    try {
                        await fm.updateDoc(fm.doc(window.db, "chats", chat.id, "messages", editingMsg.id), {
                            text: text.trim(),
                            edited: true
                        });
                        setEditingMsg(null);
                        setText('');
                        showToast("Messaggio modificato!");
                    } catch (err) {
                        showToast("Errore modifica", "error");
                    }
                    return;
                }
                await sendPayload(text.trim(), 'text');
            };

            const startEditMessage = (msg) => {
                setEditingMsg(msg);
                setReplyTo(null);
                setText(msg.text || '');
            };

            // Salvataggio Risposte Rapide su Firebase
            const saveQuickRepliesToFirebase = async (newList) => {
                const fm = window.firebaseMethods;
                try {
                    await fm.setDoc(fm.doc(window.db, "users", user.uid), { quickReplies: newList }, { merge: true });
                    setUserData(prev => ({ ...prev, quickReplies: newList }));
                } catch (e) {
                    showToast("Errore salvataggio risposte", "error");
                }
            };

            const handleAddQuickReply = async (e) => {
                e.preventDefault();
                if (!newQuickReplyText.trim()) return;
                const updated = [...quickRepliesList, newQuickReplyText.trim()];
                await saveQuickRepliesToFirebase(updated);
                setNewQuickReplyText('');
                showToast("Risposta rapida aggiunta!");
            };

            const handleDeleteQuickReply = async (idx) => {
                const updated = quickRepliesList.filter((_, i) => i !== idx);
                await saveQuickRepliesToFirebase(updated);
            };
            
            // Selezione Immagine -> apre Modale Anteprima + Didascalia
            const handleImagePick = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const previewUrl = URL.createObjectURL(file);
                setPendingImage({ file, previewUrl, caption: text || '' });
                e.target.value = null;
            };

            const confirmSendPendingImage = async (e) => {
                if (e) e.preventDefault();
                if (!pendingImage) return;
                const { file, previewUrl, caption } = pendingImage;
                setPendingImage(null);
                setUploadingImg(true);
                try {
                    const url = await uploadImageToImgBB(file);
                    await sendPayload((caption || '').trim(), 'image', url);
                    showToast("Foto inviata!");
                } catch (err) {
                    showToast("Errore invio foto", "error");
                }
                URL.revokeObjectURL(previewUrl);
                setUploadingImg(false);
            };

            // Creazione e Voto Sondaggio (Polls)
            const handleCreatePoll = async (e) => {
                e.preventDefault();
                const validOpts = pollOptions.map(o => o.trim()).filter(Boolean);
                if (!pollQuestion.trim() || validOpts.length < 2) {
                    return showToast("Inserisci la domanda e almeno 2 opzioni", "error");
                }
                const pollData = {
                    question: pollQuestion.trim(),
                    options: validOpts.map((t, i) => ({ id: String(i), text: t })),
                    votes: {}
                };
                await sendPayload('', 'poll', pollData);
                setPollQuestion('');
                setPollOptions(['', '']);
                setShowPollModal(false);
                showToast("Sondaggio pubblicato!");
            };

            const handleVotePoll = async (msg, optId) => {
                const fm = window.firebaseMethods;
                const currentPoll = msg.pollData || {};
                const currentVotes = { ...(currentPoll.votes || {}) };
                const options = currentPoll.options || [];

                options.forEach(o => {
                    const arr = Array.isArray(currentVotes[o.id]) ? currentVotes[o.id] : [];
                    currentVotes[o.id] = arr.filter(u => u !== user.uid);
                });

                const alreadyVotedThis = (currentPoll.votes?.[optId] || []).includes(user.uid);
                if (!alreadyVotedThis) {
                    currentVotes[optId] = [...(currentVotes[optId] || []), user.uid];
                }

                try {
                    await fm.updateDoc(fm.doc(window.db, "chats", chat.id, "messages", msg.id), {
                        'pollData.votes': currentVotes
                    });
                } catch (e) {}
            };
            
            const handleFilePick = async (e) => {
                const file = e.target.files?.[0]; if(!file) return;
                if(file.size > 20 * 1024 * 1024) { showToast("File troppo grande (Max 20MB)", "error"); return; }
                setUploadingImg(true);
                try {
                    const fm = window.firebaseMethods;
                    const storageRef = fm.ref(window.storage, `chat_docs/${chat.id}/${Date.now()}_${file.name}`);
                    await fm.uploadBytesResumable(storageRef, file);
                    const url = await fm.getDownloadURL(storageRef);
                    await sendPayload('', 'file', { url, name: file.name });
                    showToast("Documento inviato!");
                } catch(err) { showToast("Errore invio file", "error"); }
                setUploadingImg(false); e.target.value=null;
            };

            const toggleRecording = async () => {
                if (isRecording) {
                    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                        mediaRecorderRef.current.stop();
                    }
                    clearInterval(timerRef.current);
                    setIsRecording(false);
                    setRecordingTime(0);
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        let options = {};
                        if (window.MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                            options = { mimeType: 'audio/webm;codecs=opus' };
                        } else if (window.MediaRecorder.isTypeSupported('audio/mp4')) {
                            options = { mimeType: 'audio/mp4' };
                        }
                        
                        const mediaRecorder = new MediaRecorder(stream, options);
                        mediaRecorderRef.current = mediaRecorder;
                        audioChunksRef.current = [];

                        mediaRecorder.ondataavailable = (event) => { if (event.data && event.data.size > 0) audioChunksRef.current.push(event.data); };
                        mediaRecorder.onstop = async () => {
                            if(audioChunksRef.current.length === 0) return;
                            const actualMimeType = mediaRecorder.mimeType || 'audio/webm';
                            const audioBlob = new Blob(audioChunksRef.current, { type: actualMimeType });
                            const ext = actualMimeType.includes('mp4') ? 'mp4' : 'webm';
                            setUploadingImg(true);
                            try {
                                const fm = window.firebaseMethods;
                                const storageRef = fm.ref(window.storage, `chat_audio/${chat.id}/${Date.now()}.${ext}`);
                                await fm.uploadBytesResumable(storageRef, audioBlob);
                                const url = await fm.getDownloadURL(storageRef);
                                await sendPayload('', 'audio', url);
                            } catch(e) { showToast("Errore invio audio", "error"); }
                            setUploadingImg(false);
                            stream.getTracks().forEach(track => track.stop());
                        };

                        mediaRecorder.start(200);
                        setIsRecording(true);
                        setRecordingTime(0);
                        timerRef.current = setInterval(() => setRecordingTime(prev => prev + 1), 1000);
                    } catch (err) {
                        showToast("Microfono non autorizzato o non supportato", "error");
                    }
                }
            };

            const handleDeleteMessage = async (msgId) => { try { await window.firebaseMethods.deleteDoc(window.firebaseMethods.doc(window.db, "chats", chat.id, "messages", msgId)); setConfirmDeleteId(null); } catch (err) {} };
            const formatTime = (secs) => { const m = Math.floor(secs/60); const s = secs%60; return `${m}:${s<10?'0':''}${s}`; };

            const filteredMessages = useMemo(() => {
                if (!globalSearchTerm || !globalSearchTerm.trim()) return allMessages.slice(-60);
                const st = globalSearchTerm.toLowerCase().trim();
                return allMessages.filter(m => (m.text || '').toLowerCase().includes(st) || (m.fileName || '').toLowerCase().includes(st) || (m.pollData?.question || '').toLowerCase().includes(st));
            }, [allMessages, globalSearchTerm]);

            return (
                <div className="flex flex-col h-full w-full relative overflow-hidden" onClick={() => setReactionPickerMsgId(null)}>
                    <div className="bg-[#f0f2f5] dark:bg-gray-900 px-3 py-2.5 flex items-center justify-between border-b dark:border-gray-700 z-20 flex-shrink-0 sticky top-0">
                        <div className="flex items-center gap-2.5 min-w-0">
                            <button onClick={onBack} className="flex gap-1.5 bg-[#008069]/10 dark:bg-[#008069]/30 text-[#008069] dark:text-[#00a884] font-bold text-xs px-3 py-1.5 rounded-lg cursor-pointer"><i className="fa-solid fa-arrow-left text-sm"></i><span>Indietro</span></button>
                            <Avatar name={chatInfo.name} photoURL={chatInfo.photoURL} isGroup={chatInfo.isGroup} size="w-10 h-10" showOnlineDot={!chatInfo.isGroup} isOnline={chatInfo.isOnline} />
                            <div className="min-w-0">
                                <div className="font-bold text-gray-900 dark:text-white text-sm truncate">{chatInfo.name}</div>
                                {isTyping ? (
                                    <div className="text-xs text-[#00a884] animate-pulse">sta scrivendo...</div>
                                ) : (
                                    <div className={`text-[11px] truncate ${chatInfo.isOnline ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-gray-500 dark:text-gray-400'}`}>
                                        {chatInfo.isOnline ? '● Online' : chatInfo.presenceLabel}
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="flex gap-1.5 flex-shrink-0">
                            <button onClick={() => exportChatToTxt(chatInfo, allMessages)} title="Esporta Chat in TXT" className="bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-400 text-xs font-bold px-3 py-1.5 rounded-lg transition hover:bg-blue-200 dark:hover:bg-blue-800/40 cursor-pointer">
                                <i className="fa-solid fa-file-export"></i>
                            </button>
                            {isAdmin && (
