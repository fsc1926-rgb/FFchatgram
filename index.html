                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className={"flex-1 h-full flex flex-col bg-chat-pattern overflow-hidden " + (!activeChat ? "hidden md:flex" : "flex w-full")}>
                        {activeChat ? (
                            <ChatRoom key={activeChat.id} chat={activeChat} chatInfo={getChatInfo(activeChat)} user={user} userData={userData} allUsers={allUsers} isTyping={isSomeoneTyping(activeChat)} isAdmin={isAdmin} onBack={handleBackToChatList} onOpenAddMembers={() => { setSelectedMembers([]); setModal('addGroupMember'); }} onOpenLightbox={setLightboxUrl} showToast={showToast} setModal={setModal} />
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center border-l border-gray-200 dark:border-gray-700 p-6 text-center">
                                <div className="w-24 h-24 rounded-full bg-[#008069]/10 dark:bg-[#008069]/30 flex items-center justify-center mb-4"><i className="fa-solid fa-shield-halved text-5xl text-[#008069]"></i></div>
                                <h2 className="text-2xl font-bold text-gray-700 dark:text-gray-200">FFchatgram</h2>
                                <p className="text-sm text-gray-500 dark:text-gray-400 mt-2">Seleziona una chat a sinistra o apri la rubrica per iniziare.</p>
                            </div>
                        )}
                    </div>

                    {modal === 'settings' && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
                                <div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold"><i className="fa-solid fa-gear"></i> Impostazioni</h3><button onClick={() => setModal(null)}><i className="fa-solid fa-xmark"></i></button></div>
                                <div className="p-5 space-y-5 max-h-[80vh] overflow-y-auto">
                                    <div className="flex items-center gap-4"><Avatar name={userData?.name} photoURL={userData?.photoURL} size="w-16 h-16" textSize="text-2xl" /><div className="flex-1"><div className="font-bold text-gray-800 dark:text-white">{userData?.name || 'Profilo'}</div><div className="text-xs text-emerald-600 dark:text-emerald-400 font-semibold mb-2">🔒 Privacy protetta</div><input type="file" accept="image/*" ref={avatarInputRef} onChange={handleAvatarChange} className="hidden" /><button disabled={uploadingAvatar} onClick={() => avatarInputRef.current?.click()} className="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-xs font-bold px-3 py-1.5 rounded-lg">{uploadingAvatar ? 'Caricamento...' : '📷 Cambia Foto'}</button></div></div>
                                    <div className="flex items-center justify-between border-t border-gray-200 dark:border-gray-700 pt-4"><div className="text-sm font-bold text-gray-700 dark:text-gray-200"><i className="fa-solid fa-moon text-gray-500 dark:text-gray-400 mr-2"></i>Tema Scuro</div><button onClick={toggleDarkMode} className={`w-12 h-6 rounded-full p-1 transition-colors ${darkMode ? 'bg-[#008069]' : 'bg-gray-300'}`}><div className={`w-4 h-4 bg-white rounded-full transition-transform ${darkMode ? 'translate-x-6' : ''}`}></div></button></div>
                                    {!isStandalone && <button onClick={() => { setModal(null); triggerInstall(); }} className="w-full py-3 bg-emerald-50 dark:bg-emerald-900/30 text-[#008069] dark:text-[#00a884] font-bold text-xs rounded-xl flex items-center justify-center gap-2"><i className="fa-solid fa-download"></i> Installa App sulla Home</button>}
                                    <form onSubmit={handleSaveProfile} className="border-t border-gray-200 dark:border-gray-700 pt-4 space-y-2"><label className="block text-xs font-bold text-gray-600 dark:text-gray-400">Nickname</label><div className="flex gap-2"><input type="text" value={editName} onChange={e => setEditName(e.target.value)} className="flex-1 px-3 py-2 bg-white dark:bg-gray-700 dark:text-white border dark:border-gray-600 rounded-xl text-sm" /><button type="submit" className="bg-[#008069] text-white text-xs font-bold px-4 rounded-xl">Salva</button></div></form>
                                    <form onSubmit={handleChangePassword} className="space-y-2"><label className="block text-xs font-bold text-gray-600 dark:text-gray-400">Password</label><div className="flex gap-2"><input type="password" placeholder="Nuova pass (min 6)" value={newPass} onChange={e => setNewPass(e.target.value)} className="flex-1 px-3 py-2 bg-white dark:bg-gray-700 dark:text-white border dark:border-gray-600 rounded-xl text-sm" /><button type="submit" className="bg-blue-600 text-white text-xs font-bold px-4 rounded-xl">Aggiorna</button></div></form>
                                    <div className="border-t border-gray-200 dark:border-gray-700 pt-4"><button onClick={() => window.firebaseMethods.signOut(window.auth)} className="w-full py-2.5 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 font-bold text-xs rounded-xl"><i className="fa-solid fa-right-from-bracket mr-1.5"></i> Esci Account</button></div>
                                </div>
                            </div>
                        </div>
                    )}
                    {modal === 'broadcastModal' && isAdmin && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><form onSubmit={handleSendBroadcast} className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md overflow-hidden"><div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold"><i className="fa-solid fa-bullhorn"></i> Messaggio Broadcast</h3><button type="button" onClick={() => setModal(null)}><i className="fa-solid fa-xmark"></i></button></div><div className="p-5 space-y-4"><textarea required rows="4" placeholder="Scrivi il tuo annuncio..." value={broadcastMsg} onChange={e=>setBroadcastMsg(e.target.value)} className="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 dark:text-white border border-gray-300 dark:border-gray-600 rounded-xl text-sm outline-none resize-none"></textarea><button type="submit" className="w-full bg-[#008069] text-white font-bold py-3 rounded-xl"><i className="fa-solid fa-paper-plane mr-2"></i> Invia a Tutti</button></div></form></div>
                    )}
                    {modal === 'inviteModal' && isAdmin && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md overflow-hidden"><div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold"><i className="fa-solid fa-share-nodes"></i> Invita</h3><button onClick={() => setModal(null)}><i className="fa-solid fa-xmark"></i></button></div><div className="p-5 space-y-4"><input type="text" readOnly value={myInviteUrl} onClick={(e)=>e.target.select()} className="w-full px-3 py-2.5 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-xs font-mono" /><div className="space-y-2"><button onClick={()=>{copyTextSafe(myInviteUrl); showToast("Copiato!");}} className="w-full bg-[#008069] text-white font-bold text-xs py-3 rounded-xl"><i className="fa-solid fa-copy"></i> Copia Link</button><a href={"https://wa.me/?text=" + encodeURIComponent("Entra nella mia chat privata FFchatgram:\n" + myInviteUrl)} target="_blank" className="w-full bg-[#25D366] text-white font-bold text-xs py-3 rounded-xl flex items-center justify-center gap-2"><i className="fa-brands fa-whatsapp text-base"></i> WhatsApp</a></div></div></div></div>
                    )}
                    {modal === 'newChat' && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md flex flex-col max-h-[85vh]"><div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold">Rubrica</h3><button onClick={() => setModal(null)}><i className="fa-solid fa-xmark"></i></button></div><div className="p-4 border-b dark:border-gray-700"><input type="text" placeholder="Cerca..." value={contactEmailSearch} onChange={e=>setContactEmailSearch(e.target.value)} className="w-full px-3 py-2 bg-gray-100 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none" /></div><div className="flex-1 overflow-y-auto p-2">{otherAffiliates.filter(u=>u.name.toLowerCase().includes(contactEmailSearch.toLowerCase())).map(u=>(<div key={u.uid} onClick={()=>startDirectChatWithUser(u)} className="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-xl flex items-center justify-between cursor-pointer"><div className="flex gap-3"><Avatar name={u.name} photoURL={u.photoURL} /><div><div className="font-bold text-sm dark:text-white">{u.name}</div><div className="text-[11px] text-emerald-600">● Verificato</div></div></div></div>))}</div></div></div>
                    )}
                    {modal === 'newGroup' && isAdmin && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><form onSubmit={handleCreateGroup} className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md flex flex-col max-h-[85vh]"><div className="bg-[#008069] px-5 py-4 text-white flex justify-between"><h3 className="font-bold">Nuovo Gruppo</h3><button type="button" onClick={() => setModal(null)}><i className="fa-solid fa-xmark"></i></button></div><div className="p-4 border-b dark:border-gray-700"><input type="text" required placeholder="Nome Gruppo" value={groupName} onChange={e=>setGroupName(e.target.value)} className="w-full px-3 py-2 border dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl text-sm outline-none" /></div><div className="flex-1 overflow-y-auto p-2">{otherAffiliates.map(u=>{const checked=selectedMembers.includes(u.uid); return(<div key={u.uid} onClick={()=>setSelectedMembers(p=>checked?p.filter(id=>id!==u.uid):[...p,u.uid])} className="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 flex justify-between cursor-pointer"><div className="flex gap-3"><Avatar name={u.name} photoURL={u.photoURL} size="w-8 h-8" /><span className="font-bold text-sm dark:text-white">{u.name}</span></div><input type="checkbox" checked={checked} readOnly /></div>);})}</div><div className="p-4 flex gap-2"><button type="submit" className="w-full py-2.5 bg-[#008069] text-white font-bold rounded-xl text-xs">Crea</button></div></form></div>
                    )}
                    {modal === 'tagChat' && activeChat && isAdmin && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-sm overflow-hidden"><div className="bg-[#008069] px-4 py-3 text-white flex justify-between"><h3 className="font-bold text-sm">Etichetta Chat</h3><button onClick={() => setModal(null)}><i className="fa-solid fa-xmark"></i></button></div><div className="p-2"><div onClick={() => { window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", activeChat.id), { ['tags.'+user.uid]: window.firebaseMethods.deleteField ? window.firebaseMethods.deleteField() : null }); setModal(null); }} className="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer font-bold text-gray-700 dark:text-gray-200 border-b dark:border-gray-700 text-sm">Nessuna Etichetta</div>{TAGS.map(t => (<div key={t.id} onClick={() => { window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", activeChat.id), { ['tags.'+user.uid]: t.id }); setModal(null); }} className="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer font-bold text-gray-700 dark:text-gray-200 border-b dark:border-gray-700 text-sm">{t.icon} {t.label}</div>))}</div></div></div>
                    )}
                    {lightboxUrl && <div className="fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4" onClick={() => setLightboxUrl(null)}><button className="absolute top-5 right-5 text-white text-2xl"><i className="fa-solid fa-xmark"></i></button><img src={lightboxUrl} className="max-w-full max-h-[85vh] object-contain rounded-lg" onClick={e=>e.stopPropagation()} /></div>}
                </>
            );
        }

        // --- COMPONENTE STANZA CHAT ---
        function ChatRoom({ chat, chatInfo, user, userData, allUsers, isTyping, isAdmin, onBack, onOpenAddMembers, onOpenLightbox, showToast, setModal }) {
            const [allMessages, setAllMessages] = useState([]);
            const [text, setText] = useState(''); const [replyTo, setReplyTo] = useState(null);
            const [confirmDeleteId, setConfirmDeleteId] = useState(null); const [uploadingImg, setUploadingImg] = useState(false);
            const [showQuick, setShowQuick] = useState(false);
            const messagesEndRef = useRef(); const fileInputRef = useRef(); const initialLoadRef = useRef(true);

            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.query(fm.collection(window.db, "chats", chat.id, "messages"), fm.orderBy("timestamp", "asc")), (snap) => {
                    setAllMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    snap.docChanges().forEach((c) => {
                        if (c.type === 'added' && c.doc.data().senderId !== user.uid) {
                            const readBy = c.doc.data().readBy || []; if (!readBy.includes(user.uid)) fm.updateDoc(fm.doc(window.db, "chats", chat.id, "messages", c.doc.id), { readBy: fm.arrayUnion(user.uid) }).catch(()=>{});
                            if (!initialLoadRef.current) playNotificationSound();
                        }
                    });
                    if (initialLoadRef.current) initialLoadRef.current = false;
                    setTimeout(() => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 80);
                });
                return () => unsub();
            }, [chat.id, user.uid]);

            const handleTextChange = (e) => { setText(e.target.value); window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", chat.id), { ['typing.' + user.uid]: Date.now() }).catch(()=>{}); };

            const sendPayload = async (msgText, type = 'text', imageUrl = '') => {
                const fm = window.firebaseMethods; const currentReply = replyTo; setText(''); setReplyTo(null); setShowQuick(false);
                fm.updateDoc(fm.doc(window.db, "chats", chat.id), { ['typing.' + user.uid]: 0 }).catch(()=>{});
                await fm.addDoc(fm.collection(window.db, "chats", chat.id, "messages"), { type, text: msgText, imageUrl, senderId: user.uid, senderName: userData?.name || 'Affiliato', readBy: [], replyToData: currentReply ? { id: currentReply.id, senderName: currentReply.senderName || 'Affiliato', text: currentReply.text || 'Foto' } : null, timestamp: fm.serverTimestamp() });
                await fm.updateDoc(fm.doc(window.db, "chats", chat.id), { lastMessage: type === 'image' ? '📷 Foto' : msgText, updatedAt: fm.serverTimestamp() });
            };

            const handlePinMessage = async (msg) => { await window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", chat.id), { pinnedMessage: { id: msg.id, text: msg.text || 'Foto', senderName: msg.senderName || 'Utente' } }); showToast("Fissato!"); };
            const handleUnpinMessage = async () => { await window.firebaseMethods.updateDoc(window.firebaseMethods.doc(window.db, "chats", chat.id), { pinnedMessage: null }); };
            const handleSendForm = async (e) => { e.preventDefault(); if (text.trim()) await sendPayload(text.trim(), 'text'); };
            const handleImagePick = async (e) => { const file = e.target.files?.[0]; if (!file) return; setUploadingImg(true); try { const url = await uploadImageToImgBB(file); await sendPayload('', 'image', url); showToast("Inviata!"); } catch (err) { showToast("Errore foto", "error"); } setUploadingImg(false); e.target.value=null; };
            const handleDeleteMessage = async (msgId) => { try { await window.firebaseMethods.deleteDoc(window.firebaseMethods.doc(window.db, "chats", chat.id, "messages", msgId)); setConfirmDeleteId(null); } catch (err) {} };

            return (
                <div className="flex flex-col h-full w-full relative overflow-hidden">
                    <div className="bg-[#f0f2f5] dark:bg-gray-900 px-3 py-2.5 flex items-center justify-between border-b dark:border-gray-700 z-20 flex-shrink-0 sticky top-0">
                        <div className="flex items-center gap-2.5 min-w-0">
                            <button onClick={onBack} className="flex gap-1.5 bg-[#008069]/10 dark:bg-[#008069]/30 text-[#008069] dark:text-[#00a884] font-bold text-xs px-3 py-1.5 rounded-lg"><i className="fa-solid fa-arrow-left text-sm"></i><span>Indietro</span></button>
                            <Avatar name={chatInfo.name} photoURL={chatInfo.photoURL} isGroup={chatInfo.isGroup} size="w-10 h-10" />
                            <div className="min-w-0"><div className="font-bold text-gray-900 dark:text-white text-sm truncate">{chatInfo.name}</div>{isTyping ? <div className="text-xs text-[#00a884] animate-pulse">sta scrivendo...</div> : <div className="text-[11px] text-gray-500 dark:text-gray-400">● Attiva</div>}</div>
                        </div>
                        {isAdmin && (
                            <div className="flex gap-1.5 flex-shrink-0">
                                <button onClick={() => setModal('tagChat')} className="bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-400 text-xs font-bold px-3 py-1.5 rounded-lg"><i className="fa-solid fa-tag"></i></button>
                                {chatInfo.isGroup && <button onClick={onOpenAddMembers} className="bg-[#008069]/10 dark:bg-[#008069]/30 text-[#008069] dark:text-[#00a884] text-xs font-bold px-3 py-1.5 rounded-lg"><i className="fa-solid fa-user-plus"></i></button>}
                            </div>
                        )}
                    </div>
                    {chat.pinnedMessage && (
                        <div className="bg-white/90 dark:bg-gray-800/90 backdrop-blur border-b dark:border-gray-700 px-4 py-2 flex justify-between items-center z-10 shadow-sm"><div className="flex items-center gap-2 min-w-0"><i className="fa-solid fa-thumbtack text-[#008069] dark:text-[#00a884]"></i><div className="truncate text-xs"><div className="font-bold text-[#008069] dark:text-[#00a884]">{chat.pinnedMessage.senderName}</div><div className="text-gray-600 dark:text-gray-300 truncate">{chat.pinnedMessage.text}</div></div></div><button onClick={handleUnpinMessage} className="text-gray-500 p-2"><i className="fa-solid fa-xmark"></i></button></div>
                    )}
                    <div className="flex-1 overflow-y-auto p-4 space-y-2.5">
                        {allMessages.slice(-50).map(msg => {
                            const isMe = msg.senderId === user.uid; const isRead = msg.readBy?.length > 0;
                            return (
                                <div key={msg.id} className={"flex " + (isMe ? "justify-end" : "justify-start")}>
                                    <div className={"max-w-[85%] sm:max-w-[70%] px-3 py-2 relative group " + (isMe ? "bubble-out" : "bubble-in")}>
                                        {!isMe && chatInfo.isGroup && <div className="text-xs font-bold text-[#008069] mb-0.5">{msg.senderName}</div>}
                                        {msg.replyToData && <div className="bg-black/5 dark:bg-white/5 border-l-4 border-[#008069] px-2.5 py-1.5 mb-1.5 rounded text-xs"><div className="font-bold text-[#008069]">{msg.replyToData.senderName}</div><div className="opacity-80 truncate">{msg.replyToData.text}</div></div>}
                                        {msg.type === 'image' && <div className="mb-1"><img src={msg.imageUrl} onClick={()=>onOpenLightbox(msg.imageUrl)} className="rounded-lg max-h-72 object-cover cursor-pointer" /></div>}
                                        {msg.text && <div className="text-[15px] break-words whitespace-pre-wrap leading-snug">{msg.text}</div>}
                                        <div className="flex items-center justify-end gap-2 mt-1">
                                            <button onClick={()=>handlePinMessage(msg)} className="opacity-60 hover:opacity-100 text-[11px]"><i className="fa-solid fa-thumbtack"></i></button>
                                            <button onClick={()=>setReplyTo(msg)} className="opacity-60 hover:opacity-100 text-[11px]"><i className="fa-solid fa-reply"></i></button>
                                            {isMe && (confirmDeleteId===msg.id ? <span className="text-[10px] bg-red-100 dark:bg-red-900/50 px-1 rounded"><button onClick={()=>handleDeleteMessage(msg.id)} className="text-red-600 font-bold">Eli</button> | <button onClick={()=>setConfirmDeleteId(null)}>No</button></span> : <button onClick={()=>setConfirmDeleteId(msg.id)} className="opacity-60 text-[11px]"><i className="fa-solid fa-trash"></i></button>)}
                                            <span className="text-[10px] opacity-60">{msg.timestamp?.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
                                            {isMe && <i className={"fa-solid fa-check-double text-[11px] " + (isRead ? "text-[#34B7F1]" : "opacity-50")}></i>}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        <div ref={messagesEndRef}></div>
                    </div>
                    {replyTo && <div className="bg-[#f0f2f5] dark:bg-gray-800 px-4 py-2 border-t dark:border-gray-700 border-l-4 border-l-[#008069] flex justify-between flex-shrink-0"><div className="text-xs truncate"><div className="font-bold text-[#008069]">Rispondi a {replyTo.senderName}</div><div className="text-gray-600 dark:text-gray-300 truncate">{replyTo.text || 'Foto'}</div></div><button onClick={()=>setReplyTo(null)} className="text-gray-500"><i className="fa-solid fa-xmark"></i></button></div>}
                    {showQuick && isAdmin && <div className="bg-white dark:bg-gray-800 border-t dark:border-gray-700 p-2 overflow-x-auto flex gap-2 flex-shrink-0 no-scrollbar">{QUICK_REPLIES.map((r,i)=><button key={i} onClick={()=>{setText(r); setShowQuick(false);}} className="bg-gray-100 dark:bg-gray-700 dark:text-gray-200 text-xs px-3 py-2 rounded-xl whitespace-nowrap">{r.substring(0, 30)}...</button>)}</div>}
                    <div className="bg-[#f0f2f5] dark:bg-gray-900 px-3 py-2.5 flex items-center gap-2 border-t dark:border-gray-700 flex-shrink-0">
                        {isAdmin && <button onClick={()=>setShowQuick(!showQuick)} className="w-9 h-9 rounded-full text-amber-500 hover:bg-gray-200 dark:hover:bg-gray-800"><i className="fa-solid fa-bolt text-lg"></i></button>}
                        <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImagePick} className="hidden" />
                        <button disabled={uploadingImg} onClick={()=>fileInputRef.current?.click()} className="w-10 h-10 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800">{uploadingImg ? <div className="w-5 h-5 border-2 border-[#008069] border-t-transparent rounded-full animate-spin"></div> : <i className="fa-solid fa-paperclip text-lg"></i>}</button>
                        <form onSubmit={handleSendForm} className="flex-1 flex gap-2">
                            <input type="text" value={text} onChange={handleTextChange} placeholder="Scrivi un messaggio..." className="flex-1 bg-white dark:bg-gray-700 dark:text-white rounded-full px-4 py-2.5 text-sm outline-none" />
                            <button type="submit" disabled={!text.trim()} className="w-10 h-10 rounded-full bg-[#008069] text-white disabled:opacity-40"><i className="fa-solid fa-paper-plane"></i></button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- MODULO CRM (NOTION STYLE) ---
        function CRMModule({ user, isAdmin, showToast, onOpenLauncher }) {
            const [allUsers, setAllUsers] = useState({});
            const [customPages, setCustomPages] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            
            const [activeSelection, setActiveSelection] = useState(null); // { type: 'profile' | 'page', id: string }
            const [activeData, setActiveData] = useState(null);
            const historyPushedRef = useRef(false);

            // Fetch Affiliati
            useEffect(() => {
                const fm = window.firebaseMethods;
                const unsub = fm.onSnapshot(fm.collection(window.db, "users"), (snap) => {
                    const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); }); setAllUsers(map);
                });
                return () => unsub();
            }, []);

            // Fetch Pagine Personalizzate (Notion)
            useEffect(() => {
                const fm = window.firebaseMethods;
                const q = fm.query(fm.collection(window.db, "crm_pages"), fm.where("ownerId", "==", user.uid));
                const unsub = fm.onSnapshot(q, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.updatedAt?.toMillis() || 0) - (a.updatedAt?.toMillis() || 0));
                    setCustomPages(list);
                });
                return () => unsub();
            }, [user.uid]);

            // Fetch Dati della Scheda Attiva
            useEffect(() => {
                if (!activeSelection) { setActiveData(null); return; }
                const fm = window.firebaseMethods;
                let unsub;
                if (activeSelection.type === 'profile') {
                    unsub = fm.onSnapshot(fm.doc(window.db, "crm_profiles", activeSelection.id), (doc) => {
                        if (doc.exists()) setActiveData(doc.data());
                        else setActiveData({ icon: '👤', status: 'Lead (Nuovo)', phone: '', campaign: '', notes: '' });
                    });
                } else if (activeSelection.type === 'page') {
                    unsub = fm.onSnapshot(fm.doc(window.db, "crm_pages", activeSelection.id), (doc) => {
                        if (doc.exists()) setActiveData(doc.data());
                    });
                }
                return () => { if (unsub) unsub(); };
            }, [activeSelection]);

            const selectItem = (type, id) => {
                setActiveSelection({ type, id });
                if (id && !historyPushedRef.current) { try { window.history.pushState({ crmOpen: true }, ''); historyPushedRef.current = true; } catch (e) {} }
            };
            const handleBackToList = () => { setActiveSelection(null); if (historyPushedRef.current) { historyPushedRef.current = false; try { window.history.back(); } catch (e) {} } };

            useEffect(() => {
                const handlePopState = () => { historyPushedRef.current = false; setActiveSelection(null); };
                window.addEventListener('popstate', handlePopState); return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            // Crea Nuova Pagina Vuota
            const createNewPage = async () => {
                const fm = window.firebaseMethods;
                try {
                    const ref = await fm.addDoc(fm.collection(window.db, "crm_pages"), {
                        ownerId: user.uid, title: "", icon: "📄", content: "", updatedAt: fm.serverTimestamp()
                    });
                    selectItem('page', ref.id);
                } catch (e) { showToast("Errore creazione pagina", "error"); }
            };

            const deleteActivePage = async () => {
                if (!activeSelection || activeSelection.type !== 'page') return;
                const fm = window.firebaseMethods;
                if(window.confirm("Sei sicuro di voler eliminare questa pagina?")) {
                    try {
                        await fm.deleteDoc(fm.doc(window.db, "crm_pages", activeSelection.id));
                        setActiveSelection(null); showToast("Pagina eliminata!");
                    } catch (e) { showToast("Errore", "error"); }
                }
            };

            const updateField = (field, value) => {
                if (!activeSelection) return;
                const fm = window.firebaseMethods;
                const collectionName = activeSelection.type === 'profile' ? "crm_profiles" : "crm_pages";
                const ref = fm.doc(window.db, collectionName, activeSelection.id);
                fm.setDoc(ref, { [field]: value, updatedAt: fm.serverTimestamp() }, { merge: true }).catch(() => {});
            };

            const autoResizeTextarea = (e) => {
                e.target.style.height = 'auto'; e.target.style.height = (e.target.scrollHeight) + 'px';
                updateField(activeSelection.type === 'page' ? 'content' : 'notes', e.target.value);
            };

            const affiliates = Object.values(allUsers).filter(u => u.uid && u.uid !== user.uid);
            const filteredAffiliates = affiliates.filter(u => u.name.toLowerCase().includes(searchTerm.toLowerCase()) || u.email.toLowerCase().includes(searchTerm.toLowerCase()));
            const filteredPages = customPages.filter(p => (p.title || 'Senza Titolo').toLowerCase().includes(searchTerm.toLowerCase()));

            return (
                <>
                    {/* BARRA LATERALE CRM */}
                    <div className={"w-full md:w-[320px] lg:w-[350px] h-full bg-gray-50 dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col flex-shrink-0 " + (activeSelection ? "hidden md:flex" : "flex")}>
                        <div className="bg-[#008069] px-4 py-4 flex items-center gap-3 text-white flex-shrink-0">
                            <button onClick={onOpenLauncher} className="w-9 h-9 rounded-full hover:bg-white/20 flex items-center justify-center transition"><i className="fa-solid fa-grip text-lg"></i></button>
                            <div className="font-bold text-lg">Workspace</div>
                        </div>
                        
                        <div className="p-3 flex-shrink-0 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
                            <div className="bg-gray-100 dark:bg-gray-900 rounded-xl flex items-center px-3.5 py-2 mb-2">
                                <i className="fa-solid fa-magnifying-glass text-gray-400"></i>
                                <input type="text" placeholder="Cerca pagina o affiliato..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-transparent border-none outline-none w-full text-sm ml-2.5 text-gray-700 dark:text-gray-200" />
                            </div>
                            <button onClick={createNewPage} className="w-full bg-gray-900 dark:bg-gray-700 hover:bg-black dark:hover:bg-gray-600 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-2 transition">
                                <i className="fa-solid fa-plus"></i> Nuova Pagina
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-3 space-y-4">
                            {/* SEZIONE PAGINE LIBERE */}
                            <div>
                                <div className="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2 px-1">📄 Le Mie Note</div>
                                <div className="space-y-1">
                                    {filteredPages.map(p => (
                                        <div key={p.id} onClick={() => selectItem('page', p.id)} className={`p-2 rounded-lg flex items-center gap-3 cursor-pointer transition ${activeSelection?.id === p.id ? 'bg-[#008069]/10 dark:bg-[#008069]/30 text-[#008069] dark:text-[#00a884] font-bold' : 'hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 font-medium'}`}>
                                            <span className="text-lg">{p.icon || '📄'}</span>
                                            <div className="text-sm truncate">{p.title || 'Senza Titolo'}</div>
                                        </div>
                                    ))}
                                    {filteredPages.length === 0 && <div className="text-xs text-gray-400 px-2 italic">Nessuna pagina trovata.</div>}
                                </div>
                            </div>

                            {/* SEZIONE AFFILIATI */}
                            <div>
                                <div className="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-2 px-1">👥 Profili Affiliati</div>
                                <div className="space-y-1">
                                    {filteredAffiliates.map(u => (
                                        <div key={u.uid} onClick={() => selectItem('profile', u.uid)} className={`p-2 rounded-lg flex items-center gap-3 cursor-pointer transition ${activeSelection?.id === u.uid ? 'bg-white dark:bg-gray-700 shadow-sm border border-gray-200 dark:border-gray-600' : 'hover:bg-gray-200 dark:hover:bg-gray-700'}`}>
                                            <Avatar name={u.name} photoURL={u.photoURL} size="w-8 h-8" />
                                            <div className="flex-1 min-w-0"><div className="font-bold text-sm text-gray-900 dark:text-white truncate">{u.name}</div><div className="text-[10px] text-gray-500 dark:text-gray-400 truncate">{u.email}</div></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* FOGLIO NOTION PRINCIPALE */}
                    <div className={"flex-1 h-full flex flex-col bg-white dark:bg-[#191919] overflow-y-auto " + (!activeSelection ? "hidden md:flex" : "flex w-full")}>
                        {activeSelection && activeData ? (
                            <div className="max-w-4xl w-full mx-auto pb-32">
                                
                                {/* COPERTINA */}
                                <div className="h-32 sm:h-56 w-full bg-gradient-to-r from-emerald-200 to-[#008069] dark:from-[#005c4b] dark:to-gray-900 relative flex-shrink-0 group">
                                    <button onClick={handleBackToList} className="md:hidden absolute top-4 left-4 w-10 h-10 bg-black/20 hover:bg-black/40 text-white rounded-full flex items-center justify-center backdrop-blur transition"><i className="fa-solid fa-arrow-left"></i></button>
                                    {activeSelection.type === 'page' && (
                                        <button onClick={deleteActivePage} className="absolute top-4 right-4 w-10 h-10 bg-black/20 hover:bg-red-500 text-white rounded-full flex items-center justify-center backdrop-blur transition"><i className="fa-solid fa-trash"></i></button>
                                    )}
                                </div>

                                <div className="px-6 sm:px-16 -mt-12 sm:-mt-16 relative z-10">
                                    {/* ICONA EMOJI */}
                                    <input 
                                        type="text" 
                                        value={activeData.icon || (activeSelection.type === 'profile' ? '👤' : '📄')} 
                                        onChange={e => updateField('icon', e.target.value)} 
                                        className="w-24 h-24 sm:w-28 sm:h-28 text-6xl sm:text-7xl bg-white dark:bg-[#191919] rounded-2xl flex items-center justify-center text-center outline-none mb-6 p-0 border-none bg-transparent" 
                                    />
                                    
                                    {/* TITOLO PAGINA (SOLO CUSTOM PAGE) */}
                                    {activeSelection.type === 'page' ? (
                                        <input 
                                            type="text" 
                                            placeholder="Senza Titolo" 
                                            value={activeData.title || ''} 
                                            onChange={e => updateField('title', e.target.value)} 
                                            className="w-full text-4xl sm:text-5xl font-extrabold text-gray-900 dark:text-white mb-8 tracking-tight bg-transparent outline-none placeholder-gray-300 dark:placeholder-gray-700" 
                                        />
                                    ) : (
                                        <h1 className="text-4xl sm:text-5xl font-extrabold text-gray-900 dark:text-white mb-8 tracking-tight">{allUsers[activeSelection.id]?.name}</h1>
                                    )}
                                    
                                    {/* PROPRIETA' CRM (SOLO AFFILIATI) */}
                                    {activeSelection.type === 'profile' && (
                                        <div className="space-y-3 mb-10 border-b border-gray-200 dark:border-gray-800 pb-8">
                                            <div className="flex items-center gap-6">
                                                <div className="w-32 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-chart-pie w-4"></i> Stato CRM</div>
                                                <select value={activeData.status || 'Lead (Nuovo)'} onChange={e => updateField('status', e.target.value)} className="flex-1 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded outline-none text-gray-900 dark:text-white font-medium cursor-pointer transition">
                                                    {CRM_STATUSES.map(s => <option key={s} value={s} className="dark:bg-gray-800">{s}</option>)}
                                                </select>
                                            </div>
                                            <div className="flex items-center gap-6">
                                                <div className="w-32 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-phone w-4"></i> Telefono</div>
                                                <input type="text" placeholder="Aggiungi telefono..." value={activeData.phone || ''} onChange={e => updateField('phone', e.target.value)} className="flex-1 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded outline-none text-gray-900 dark:text-white transition" />
                                            </div>
                                            <div className="flex items-center gap-6">
                                                <div className="w-32 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-bullseye w-4"></i> Campagna</div>
                                                <input type="text" placeholder="Es. Google Ads..." value={activeData.campaign || ''} onChange={e => updateField('campaign', e.target.value)} className="flex-1 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded outline-none text-gray-900 dark:text-white transition" />
                                            </div>
                                        </div>
                                    )}
                                    
                                    {/* FOGLIO NOTION / TEXTAREA INFINITA */}
                                    <div className="relative">
                                        <textarea
                                            placeholder="Premi per iniziare a scrivere..."
                                            defaultValue={activeSelection.type === 'page' ? (activeData.content || '') : (activeData.notes || '')}
                                            onBlur={autoResizeTextarea}
                                            onChange={(e) => { e.target.style.height = 'auto'; e.target.style.height = (e.target.scrollHeight) + 'px'; }}
                                            className="notion-textarea w-full bg-transparent text-gray-800 dark:text-gray-200 outline-none text-base sm:text-lg"
                                        ></textarea>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-center p-6">
                                <div className="w-24 h-24 bg-gray-100 dark:bg-gray-800 rounded-3xl flex items-center justify-center mb-6"><i className="fa-solid fa-layer-group text-5xl text-gray-300 dark:text-gray-600"></i></div>
                                <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-200">Workspace Interno</h2>
                                <p className="text-gray-500 dark:text-gray-400 mt-2 max-w-sm">Crea nuove pagine di appunti o seleziona un affiliato per gestire la sua scheda CRM.</p>
                            </div>
                        )}
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);

</body>
