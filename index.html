                                                <div className="w-40 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-graduation-cap w-4 text-blue-500"></i> Completamento Academy</div>
                                                <div className="flex-1 flex items-center gap-3">
                                                    <div className="flex-1 h-2.5 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden max-w-xs">
                                                        <div className="h-full bg-[#008069]" style={{ width: `${getAffiliateAcademyPct(activeSelection.id)}%` }}></div>
                                                    </div>
                                                    <span className="text-xs font-extrabold text-[#008069] dark:text-[#00a884]">{getAffiliateAcademyPct(activeSelection.id)}%</span>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-6"><div className="w-40 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-phone w-4"></i> Telefono</div><input type="text" placeholder="Aggiungi telefono..." value={activeData.phone || ''} onChange={e => updateField('phone', e.target.value)} className="flex-1 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded outline-none text-gray-900 dark:text-white transition" /></div>
                                            <div className="flex items-center gap-6"><div className="w-40 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-bullseye w-4"></i> Campagna</div><input type="text" placeholder="Es. Google Ads..." value={activeData.campaign || ''} onChange={e => updateField('campaign', e.target.value)} className="flex-1 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded outline-none text-gray-900 dark:text-white transition" /></div>
                                            <div className="flex items-center gap-6">
                                                <div className="w-40 text-sm text-gray-500 dark:text-gray-400 font-semibold flex items-center gap-2"><i className="fa-solid fa-bell w-4 text-amber-500"></i> Data Ricontatto</div>
                                                <div className="flex items-center gap-2 flex-1">
                                                    <input type="date" value={activeData.followUpDate || ''} onChange={e => updateField('followUpDate', e.target.value)} className="bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 p-1.5 rounded outline-none text-gray-900 dark:text-white text-sm cursor-pointer transition" />
                                                    {activeData.followUpDate && <button type="button" onClick={() => updateField('followUpDate', '')} className="text-xs text-gray-400 hover:text-red-500 px-2 py-1 cursor-pointer">Rimuovi</button>}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div className="relative">
                                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2 pb-2 border-b border-gray-100 dark:border-gray-800">
                                            <div className="text-gray-400 dark:text-gray-500 font-bold text-xs uppercase flex items-center gap-2"><i className="fa-solid fa-align-left"></i> Foglio di Lavoro & Checklist</div>
                                            <div className="flex items-center gap-2">
                                                <button type="button" onClick={() => setViewChecklistMode(prev => !prev)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${viewChecklistMode ? 'bg-[#008069] text-white' : 'bg-emerald-50 dark:bg-emerald-900/30 text-[#008069] dark:text-[#00a884]'}`}>{viewChecklistMode ? '✏️ Modifica Testo' : '✅ Spunta Checklist'}</button>
                                            </div>
                                        </div>

                                        {!viewChecklistMode && <AdminToolbar onFormat={handleCrmFormat} />}
                                        
                                        {viewChecklistMode ? (
                                            <div className="min-h-[300px] space-y-1 py-2">{renderInteractiveChecklist(activeData[currentNoteField] || '', currentNoteField)}</div>
                                        ) : (
                                            <textarea ref={crmNoteRef} placeholder="Premi per iniziare a scrivere. Usa [ ] ad inizio riga per creare una checklist..." value={activeData[currentNoteField] || ''} onChange={(e) => { e.target.style.height = 'auto'; e.target.style.height = (e.target.scrollHeight) + 'px'; updateField(currentNoteField, e.target.value); setActiveData({...activeData, [currentNoteField]: e.target.value}); }} className="w-full bg-transparent text-gray-800 dark:text-gray-200 outline-none text-base sm:text-lg min-h-[300px] resize-none leading-relaxed"></textarea>
                                        )}
                                        <div className="mt-8 pt-4 border-t border-gray-100 dark:border-gray-800 text-xs text-gray-400 dark:text-gray-500">💡 Usa la barra degli strumenti in alto o digita <code className="bg-gray-100 dark:bg-gray-800 px-1.5 py-0.5 rounded">[ ] Testo</code> per le checklist.</div>
                                    </div>
                                </div>
                            </div>
                        ) : crmViewMode === 'kanban' ? (
                            /* VISTA KANBAN A COLONNE (PIPELINE AFFILIATI) */
                            <div className="flex-1 flex flex-col p-6 overflow-hidden">
                                <div className="flex items-center justify-between mb-4 flex-shrink-0">
                                    <div>
                                        <h2 className="text-xl font-extrabold text-gray-800 dark:text-white">Pipeline Kanban Affiliati</h2>
                                        <p className="text-xs text-gray-500">Sposta gli affiliati da una fase all'altra con un clic o apri la loro chat diretta.</p>
                                    </div>
                                    <button onClick={() => setCrmViewMode('dashboard')} className="bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 text-xs font-bold px-4 py-2 rounded-xl cursor-pointer">
                                        Torna a Dashboard KPI
                                    </button>
                                </div>
                                <div className="flex-1 flex gap-4 overflow-x-auto pb-4">
                                    {CRM_STATUSES.map(statusCol => {
                                        const colUsers = affiliates.filter(u => (allCrmProfiles[u.uid]?.status || 'Lead (Nuovo)') === statusCol);
                                        return (
                                            <div key={statusCol} className="w-72 flex-shrink-0 bg-gray-50 dark:bg-gray-800/70 rounded-2xl border border-gray-200 dark:border-gray-700 flex flex-col max-h-full">
                                                <div className="p-3 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                                                    <span className="font-extrabold text-xs uppercase tracking-wider text-gray-700 dark:text-gray-200">{statusCol}</span>
                                                    <span className="bg-[#008069] text-white text-[10px] font-bold px-2 py-0.5 rounded-full">{colUsers.length}</span>
                                                </div>
                                                <div className="flex-1 overflow-y-auto p-2.5 space-y-2.5">
                                                    {colUsers.map(u => {
                                                        const crm = allCrmProfiles[u.uid] || {};
                                                        const pct = getAffiliateAcademyPct(u.uid);
                                                        return (
                                                            <div key={u.uid} className="bg-white dark:bg-gray-900 p-3 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-2">
                                                                <div className="flex items-center justify-between gap-2">
                                                                    <div onClick={() => selectItem('profile', u.uid)} className="flex items-center gap-2 min-w-0 cursor-pointer">
                                                                        <Avatar name={u.name} photoURL={u.photoURL} size="w-8 h-8" textSize="text-xs" />
                                                                        <div className="min-w-0">
                                                                            <div className="font-bold text-xs text-gray-900 dark:text-white truncate">{u.name}</div>
                                                                            <div className="text-[10px] text-gray-400">🎓 Academy {pct}%</div>
                                                                        </div>
                                                                    </div>
                                                                    <button onClick={() => onOpenDirectChat(u.uid)} title="Apri Chat" className="w-7 h-7 rounded-lg bg-[#008069]/10 text-[#008069] dark:text-[#00a884] flex items-center justify-center cursor-pointer flex-shrink-0">
                                                                        <i className="fa-solid fa-comments text-xs"></i>
                                                                    </button>
                                                                </div>
                                                                {Number(crm.revenue) > 0 && (
                                                                    <div className="text-[11px] font-bold text-emerald-600 dark:text-emerald-400">💰 € {Number(crm.revenue).toLocaleString()}</div>
                                                                )}
                                                                <select
                                                                    value={crm.status || 'Lead (Nuovo)'}
                                                                    onChange={e => updateAffiliateStatusQuick(u.uid, e.target.value)}
                                                                    className="w-full text-[11px] bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 rounded-lg px-2 py-1 outline-none cursor-pointer"
                                                                >
                                                                    {CRM_STATUSES.map(st => <option key={st} value={st}>Sposta in: {st}</option>)}
                                                                </select>
                                                            </div>
                                                        );
                                                    })}
                                                    {colUsers.length === 0 && <div className="text-center text-xs text-gray-400 py-6 italic">Nessun affiliato</div>}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-center p-6">
                                <div className="w-16 h-16 bg-gray-100 dark:bg-gray-800 rounded-3xl flex items-center justify-center mb-3"><i className="fa-solid fa-layer-group text-3xl text-[#008069]"></i></div>
                                <h2 className="text-2xl font-bold text-gray-800 dark:text-gray-200">Dashboard Generale CRM & BI</h2>
                                <p className="text-gray-500 dark:text-gray-400 mt-1 mb-5 text-sm">Panoramica in tempo reale della tua rete affiliati:</p>
                                
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full max-w-2xl mb-6">
                                    <div className="bg-emerald-50 dark:bg-emerald-900/20 p-4 rounded-2xl border border-emerald-100 dark:border-emerald-900/30 text-center">
                                        <div className="text-2xl font-extrabold text-[#008069] dark:text-[#00a884] mb-1">{totalAffiliates}</div><div className="text-[10px] font-bold text-emerald-700 dark:text-emerald-500 uppercase">Affiliati Totali</div>
                                    </div>
                                    <div className="bg-blue-50 dark:bg-blue-900/20 p-4 rounded-2xl border border-blue-100 dark:border-blue-900/30 text-center">
                                        <div className="text-2xl font-extrabold text-blue-600 dark:text-blue-400 mb-1">{newThisWeek}</div><div className="text-[10px] font-bold text-blue-700 dark:text-blue-500 uppercase">Nuovi (7 gg)</div>
                                    </div>
                                    <div className="bg-amber-50 dark:bg-amber-900/20 p-4 rounded-2xl border border-amber-100 dark:border-amber-900/30 text-center">
                                        <div className="text-2xl font-extrabold text-amber-600 dark:text-amber-400 mb-1">{dueFollowUps.length}</div><div className="text-[10px] font-bold text-amber-700 dark:text-amber-500 uppercase">Follow-up Oggi</div>
                                    </div>
                                    <div className="bg-purple-50 dark:bg-purple-900/20 p-4 rounded-2xl border border-purple-100 dark:border-purple-900/30 text-center">
                                        <div className="text-2xl font-extrabold text-purple-600 dark:text-purple-400 mb-1">€{totalNetworkRevenue.toLocaleString()}</div><div className="text-[10px] font-bold text-purple-700 dark:text-purple-400 uppercase">Volume Rete</div>
                                    </div>
                                </div>

                                {/* CLASSIFICA TOP 3 AFFILIATI */}
                                {top3Affiliates.length > 0 && (
                                    <div className="w-full max-w-2xl bg-gradient-to-r from-amber-50 to-yellow-50 dark:from-gray-800 dark:to-gray-800 border border-amber-200 dark:border-gray-700 rounded-2xl p-4 mb-5 text-left">
                                        <div className="text-xs font-extrabold uppercase text-amber-800 dark:text-amber-400 mb-2.5 flex items-center gap-1.5"><i className="fa-solid fa-trophy"></i> Top 3 Affiliati per Performance</div>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            {top3Affiliates.map((u, idx) => (
                                                <div key={u.uid} onClick={() => selectItem('profile', u.uid)} className="bg-white dark:bg-gray-900 p-2.5 rounded-xl flex items-center justify-between cursor-pointer shadow-sm">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <span className="text-base">{idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉'}</span>
                                                        <span className="text-xs font-bold text-gray-800 dark:text-white truncate">{u.name}</span>
                                                    </div>
                                                    <span className="text-xs font-extrabold text-emerald-600">€{u.revenue.toLocaleString()}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {dueFollowUps.length > 0 && (
                                    <div className="w-full max-w-2xl bg-amber-50/70 dark:bg-amber-900/15 border border-amber-200 dark:border-amber-800/40 rounded-2xl p-4 mb-6 text-left">
                                        <div className="text-xs font-extrabold uppercase text-amber-800 dark:text-amber-400 mb-2 flex items-center gap-1.5"><i className="fa-solid fa-bell"></i> Da Ricontattare Oggi (o Scaduti)</div>
                                        <div className="space-y-1.5 max-h-40 overflow-y-auto">
                                            {dueFollowUps.map(u => (
                                                <div key={u.uid} className="p-2 bg-white dark:bg-gray-800 rounded-xl flex items-center justify-between hover:shadow-sm transition">
                                                    <div onClick={() => selectItem('profile', u.uid)} className="flex items-center gap-2.5 cursor-pointer flex-1">
                                                        <Avatar name={u.name} photoURL={u.photoURL} size="w-7 h-7" textSize="text-xs" />
                                                        <span className="text-xs font-bold text-gray-800 dark:text-white">{u.name}</span>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-[11px] font-mono text-amber-700 dark:text-amber-400 font-semibold">{allCrmProfiles[u.uid]?.followUpDate}</span>
                                                        <button onClick={() => onOpenDirectChat(u.uid)} className="bg-[#008069] text-white text-[10px] font-bold px-2.5 py-1 rounded-lg cursor-pointer">💬 Chat</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                                <div className="flex flex-wrap justify-center gap-3">
                                    <button onClick={() => setCrmViewMode('kanban')} className="bg-gray-900 dark:bg-gray-700 text-white text-xs font-bold px-5 py-3 rounded-xl shadow flex items-center gap-2 transition cursor-pointer"><i className="fa-solid fa-table-columns"></i> Apri Pipeline Kanban</button>
                                    <button onClick={handleExportExcel} className="bg-[#008069] hover:bg-[#017561] text-white text-xs font-bold px-5 py-3 rounded-xl shadow flex items-center gap-2 transition cursor-pointer"><i className="fa-solid fa-file-excel"></i> Scarica Report Completo CRM (.xlsx)</button>
                                </div>
                            </div>
                        )}
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
    <script>
        try { if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').then(r=>{try{r.update()}catch(e){}}).catch(()=>{}); }); } } catch(e) {}
    </script>
</body>
</html>
